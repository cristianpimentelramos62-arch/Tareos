<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Sistema de Tareos</title>
<style>
  :root {
    --accent: #38bdf8;
    --accent-rgb: 56, 189, 248;
    --accent-contrast: #04131e;
    --bg-base: #060a10;
    --glass-bg: rgba(16, 23, 35, 0.62);
    --glass-bg-strong: rgba(20, 29, 44, 0.78);
    --glass-input: rgba(8, 13, 22, 0.68);
    --glass-border: rgba(255, 255, 255, 0.14);
    --text-main: #f3f6fb;
    --text-muted: #94a3b8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --glass-blur: 18px;
    --wall-image: none;
    --wall-opacity: 0.35;
    --radius-card: 22px;
    --radius-btn: 14px;
    --radius-input: 12px;
  }

  [data-theme="light"] {
    --bg-base: #eef3f9;
    --glass-bg: rgba(255, 255, 255, 0.66);
    --glass-bg-strong: rgba(255, 255, 255, 0.84);
    --glass-input: rgba(241, 245, 249, 0.85);
    --glass-border: rgba(15, 23, 42, 0.12);
    --text-main: #0f172a;
    --text-muted: #475569;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  .app-wallpaper {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-color: var(--bg-base);
    background-image: var(--wall-image);
    background-size: cover;
    background-position: center;
    opacity: var(--wall-opacity);
    transition: opacity 0.25s ease, background-image 0.25s ease;
  }

  .app-glow {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at 15% 10%, rgba(var(--accent-rgb), 0.16), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(var(--accent-rgb), 0.10), transparent 50%);
  }

  .app-shell {
    position: relative;
    z-index: 2;
    max-width: 980px;
    margin: 0 auto;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(32px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur)) saturate(160%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-card);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  }

  .glass-strong {
    background: var(--glass-bg-strong);
    backdrop-filter: blur(calc(var(--glass-blur) + 4px)) saturate(170%);
    -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 4px)) saturate(170%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-card);
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    margin-bottom: 10px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    flex-shrink: 0;
  }

  .dot.syncing { background: var(--warn); }
  .dot.offline { background: var(--err); }

  .mode-switch {
    display: inline-flex;
    background: var(--glass-input);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 2px;
    flex-shrink: 0;
  }

  .mode-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }

  .mode-btn.active {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .login-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 90px);
    padding: 8px 0;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    padding: 22px 18px;
  }

  .login-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }

  .login-title {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .login-sub {
    margin: 0 0 16px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .btn-refresh-cloud {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--glass-input);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 700;
    padding: 7px 11px;
    border-radius: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .btn-refresh-cloud:hover {
    border-color: var(--accent);
  }

  .pin-input {
    display: block;
    width: 100%;
    max-width: 100%;
    padding: 14px 16px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 8px;
    text-align: center;
    color: var(--text-main);
    background: var(--glass-input);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--radius-input);
    outline: none;
    margin-bottom: 12px;
  }

  .pin-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.22);
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 13px 16px;
    border: none;
    border-radius: var(--radius-btn);
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }

  .btn-sm {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 8px 12px;
    border: 1px solid var(--glass-border);
    border-radius: 11px;
    background: var(--glass-input);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-sm.accent {
    background: var(--accent);
    color: var(--accent-contrast);
    border-color: transparent;
  }

  .btn-sm.ok {
    background: rgba(34, 197, 94, 0.18);
    color: #4ade80;
    border-color: rgba(34, 197, 94, 0.4);
  }

  [data-theme="light"] .btn-sm.ok {
    color: #15803d;
  }

  .btn-sm.danger {
    background: rgba(239, 68, 68, 0.16);
    color: #f87171;
    border-color: rgba(239, 68, 68, 0.35);
  }

  [data-theme="light"] .btn-sm.danger {
    color: #b91c1c;
  }

  .login-msg {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    min-height: 18px;
    text-align: center;
  }

  .session-card {
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .session-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .user-name {
    font-size: 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.03em;
    background: rgba(var(--accent-rgb), 0.18);
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.35);
  }

  .user-meta {
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .report-tabs {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 8px 10px;
    margin-bottom: 12px;
    scrollbar-width: none;
  }

  .report-tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .section-card {
    padding: 16px;
    margin-bottom: 12px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .section-title {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
  }

  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
  }

  label.lbl {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input.inp, select.sel, textarea.txt {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text-main);
    background: var(--glass-input);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-input);
    outline: none;
  }

  input.inp:focus, select.sel:focus, textarea.txt:focus {
    border-color: var(--accent);
  }

  input[readonly].inp {
    opacity: 0.78;
    font-weight: 700;
  }

  .chips-box {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 6px;
  }

  .chip-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-input);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .chip-toggle.selected {
    background: rgba(var(--accent-rgb), 0.22);
    border-color: var(--accent);
    color: var(--accent);
  }

  .entry-row {
    padding: 12px;
    border-radius: 16px;
    background: var(--glass-input);
    border: 1px solid var(--glass-border);
    margin-bottom: 10px;
  }

  .dni-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .dni-wrap input.inp {
    padding-right: 34px;
  }

  .btn-clear-dni {
    position: absolute;
    right: 6px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: rgba(148, 163, 184, 0.25);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .table-scroll {
    width: 100%;
    overflow-x: auto;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
  }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    min-width: 720px;
  }

  table.data-table th {
    background: rgba(var(--accent-rgb), 0.16);
    color: var(--text-main);
    font-weight: 800;
    padding: 8px 9px;
    text-align: left;
    border-bottom: 1px solid var(--glass-border);
    white-space: nowrap;
  }

  table.data-table td {
    padding: 7px 9px;
    border-bottom: 1px solid var(--glass-border);
    color: var(--text-main);
    white-space: nowrap;
  }

  table.data-table tr.total-row td {
    background: rgba(34, 197, 94, 0.16);
    font-weight: 800;
  }

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 90;
    display: none;
  }

  .drawer-backdrop.open { display: block; }

  .drawer {
    position: fixed;
    top: 0;
    right: -340px;
    width: min(330px, 88vw);
    height: 100%;
    z-index: 91;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    overflow-y: auto;
    transition: right 0.24s ease;
  }

  .drawer.open { right: 0; }

  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 12px 13px;
    margin-bottom: 8px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: var(--glass-input);
    color: var(--text-main);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }

  .drawer-item.active {
    border-color: var(--accent);
    background: rgba(var(--accent-rgb), 0.18);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.68);
    z-index: 120;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }

  .modal-backdrop.open { display: flex; }

  .modal-card {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 18px;
  }

  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 12px;
  }

  .swatch {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.5);
    cursor: pointer;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="app-wallpaper" id="appWallpaper"></div>
  <div class="app-glow"></div>

  <div class="app-shell">
    <!-- Barra superior de conexión y modo Drive / Demo -->
    <div class="glass top-bar">
      <div class="status-pill" id="cloudStatus">
        <span class="dot" id="cloudDot"></span>
        <span id="cloudText">Drive listo</span>
      </div>
      <div class="mode-switch">
        <button class="mode-btn active" id="btnModeDrive" onclick="setConnectionMode('drive')">Drive</button>
        <button class="mode-btn" id="btnModeDemo" onclick="setConnectionMode('demo')">Demo</button>
      </div>
    </div>

    <!-- Pantalla de inicio de sesión con PIN -->
    <div class="login-wrap" id="loginScreen">
      <div class="glass login-card">
        <div class="login-top">
          <div>
            <h1 class="login-title">Sistema de Tareos</h1>
            <p class="login-sub">Ingresa tu PIN de acceso</p>
          </div>
          <button class="btn-refresh-cloud" id="btnRefreshLogin" onclick="refreshFromCloud(true)" title="Actualizar usuarios y maestros desde Drive">
            <span>↻</span>
            <span id="refreshLoginLabel">Actualizar</span>
          </button>
        </div>

        <input
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="8"
          id="loginPin"
          class="pin-input"
          placeholder="••••"
          autocomplete="off"
        />

        <button class="btn-primary" id="btnLogin" onclick="attemptLogin()">Ingresar</button>
        <div class="login-msg" id="loginMsg"></div>
      </div>
    </div>

    <!-- Contenedor principal de sesión activa -->
    <div id="mainApp" class="hidden">
      <div class="glass session-card">
        <div class="session-row">
          <div>
            <div class="user-name">
              <span id="activeUserName">Usuario</span>
              <span class="badge" id="activeUserRole">ROL</span>
              <span class="badge" id="activeUserScope">ZONA</span>
            </div>
            <div class="user-meta" id="activeUserMeta"></div>
          </div>
          <div class="toolbar-actions">
            <button class="btn-sm" onclick="refreshFromCloud(true)">↻ Sync</button>
            <button class="btn-sm accent" onclick="openDrawer()">☰ Menú</button>
          </div>
        </div>
      </div>

      <div class="glass report-tabs" id="reportTabsBar"></div>

      <div id="viewResumen" class="hidden"></div>
      <div id="viewTareo" class="hidden"></div>
      <div id="viewAsistencia" class="hidden"></div>
      <div id="viewAjuste" class="hidden"></div>
      <div id="viewProyeccion" class="hidden"></div>
      <div id="viewHistorial" class="hidden"></div>

      <div id="viewAdminUsuarios" class="hidden"></div>
      <div id="viewAdminMaestros" class="hidden"></div>
      <div id="viewAdminApariencia" class="hidden"></div>
    </div>
  </div>

  <!-- Menú lateral desplegable -->
  <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
  <aside class="glass-strong drawer" id="sideDrawer">
    <div class="section-head">
      <h3 class="section-title">Menú</h3>
      <button class="btn-sm" onclick="closeDrawer()">✕</button>
    </div>

    <div id="drawerAdminBlock" class="hidden">
      <button class="drawer-item" id="navAdminUsuarios" onclick="openAdminTab('usuarios')">
        <span>👥 Usuarios y Zonas</span><span>›</span>
      </button>
      <button class="drawer-item" id="navAdminMaestros" onclick="openAdminTab('maestros')">
        <span>📚 Maestros (Ciclos, Labores, Pers.)</span><span>›</span>
      </button>
    </div>

    <button class="drawer-item" id="navAdminApariencia" onclick="openAdminTab('apariencia')">
      <span>🎨 Apariencia y Tema</span><span>›</span>
    </button>

    <button class="drawer-item danger" onclick="logout()">
      <span style="color:var(--err);">⎋ Cerrar sesión</span><span>›</span>
    </button>
  </aside>

  <!-- Modal reutilizable -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
    <div class="glass-strong modal-card" id="modalCard"></div>
  </div>

  <!-- Inputs ocultos para archivos -->
  <input type="file" id="hiddenExcelInput" accept=".xlsx,.xls,.csv" class="hidden" />
  <input type="file" id="hiddenBgInput" accept="image/*" class="hidden" />

    function todayISO() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    function tomorrowISO() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return d.toISOString().slice(0, 10);
    }

    function getISOWeek(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split("-").map(Number);
      if (parts.length !== 3) return "";
      const dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
      const dayNum = dt.getUTCDay() || 7;
      dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
      return Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
    }

    function hexToRgb(hex) {
      const clean = (hex || "#38bdf8").replace("#", "");
      const num = parseInt(clean.length === 3 ? clean.split("").map(c => c + c).join("") : clean, 16);
      return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
    }

    function applyAppearance(forLockScreen) {
      const ap = S.apariencia;
      document.documentElement.setAttribute("data-theme", ap.theme || "dark");
      document.documentElement.style.setProperty("--accent", ap.accent || "#38bdf8");
      document.documentElement.style.setProperty("--accent-rgb", hexToRgb(ap.accent || "#38bdf8"));
      document.documentElement.style.setProperty("--wall-opacity", String(ap.wallOpacity ?? 0.35));

      const showWall = Boolean(ap.wallImage) && (
        ap.wallScope === "both" ||
        (forLockScreen && ap.wallScope === "lock") ||
        (!forLockScreen && ap.wallScope === "app")
      );
      document.documentElement.style.setProperty("--wall-image", showWall ? `url("${ap.wallImage}")` : "none");
    }

    function saveLocalCache() {
      try {
        localStorage.setItem("tareos_cache_v2", JSON.stringify({
          usuarios: S.usuarios,
          zonas: S.zonas,
          personal: S.personal,
          labores: S.labores,
          ciclos: S.ciclos,
          formatos: S.formatos,
          destinos: S.destinos,
          reportes: S.reportes
        }));
      } catch (_) {}
    }

    function loadLocalCache() {
      try {
        const raw = localStorage.getItem("tareos_cache_v2");
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.usuarios)) S.usuarios = data.usuarios;
        if (Array.isArray(data.zonas) && data.zonas.length) S.zonas = data.zonas;
        if (Array.isArray(data.personal)) S.personal = data.personal;
        if (Array.isArray(data.labores)) S.labores = data.labores;
        if (Array.isArray(data.ciclos) && data.ciclos.length) S.ciclos = data.ciclos;
        if (Array.isArray(data.formatos) && data.formatos.length) S.formatos = data.formatos;
        if (Array.isArray(data.destinos) && data.destinos.length) S.destinos = data.destinos;
        if (Array.isArray(data.reportes)) S.reportes = pruneOldReports(data.reportes);
      } catch (_) {}
    }

    function pruneOldReports(list) {
      const now = Date.now();
      return (list || []).filter(r => {
        const t = new Date(r.savedAt || r.fecha || Date.now()).getTime();
        return Number.isNaN(t) || (now - t) <= THIRTY_DAYS_MS;
      });
    }

    async function apiCall(payload, timeoutMs = 4500) {
      if (S.mode !== "drive" || !API_URL) return null;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } catch (_) {
        clearTimeout(timer);
        return null;
      }
    }

    function applyCloudPayload(data) {
      if (!data || !data.ok) return false;
      if (Array.isArray(data.usuarios)) {
        S.usuarios = data.usuarios;
      }
      if (data.maestros) {
        if (Array.isArray(data.maestros.zonas) && data.maestros.zonas.length) S.zonas = data.maestros.zonas;
        if (Array.isArray(data.maestros.personal)) S.personal = data.maestros.personal;
        if (Array.isArray(data.maestros.labores)) S.labores = data.maestros.labores;
        if (Array.isArray(data.maestros.ciclos) && data.maestros.ciclos.length) S.ciclos = data.maestros.ciclos;
        if (Array.isArray(data.maestros.formatos) && data.maestros.formatos.length) S.formatos = data.maestros.formatos;
        if (Array.isArray(data.maestros.destinos) && data.maestros.destinos.length) S.destinos = data.maestros.destinos;
      }
      if (data.apariencia) {
        S.apariencia = Object.assign({}, S.apariencia, data.apariencia);
        if (S.apariencia.theme) localStorage.setItem("tareos_theme", S.apariencia.theme);
        if (S.apariencia.accent) localStorage.setItem("tareos_accent", S.apariencia.accent);
        if (typeof S.apariencia.wallOpacity === "number") localStorage.setItem("tareos_wall_opacity", String(S.apariencia.wallOpacity));
        if (S.apariencia.wallScope) localStorage.setItem("tareos_wall_scope", S.apariencia.wallScope);
        if (typeof S.apariencia.wallImage === "string") {
          try { localStorage.setItem("tareos_wall_image", S.apariencia.wallImage); } catch (_) {}
        }
        applyAppearance(!S.user);
      }
      if (Array.isArray(data.reportes)) {
        S.reportes = pruneOldReports(data.reportes);
      }
      syncZonesFromMasters();
      saveLocalCache();
      return true;
    }

    function syncZonesFromMasters() {
      const setZ = new Set((S.zonas || []).map(z => String(z).trim().toUpperCase()).filter(Boolean));
      S.ciclos.forEach(c => { if (c.zona) setZ.add(String(c.zona).trim().toUpperCase()); });
      S.usuarios.forEach(u => (u.zonas || []).forEach(z => { if (z) setZ.add(String(z).trim().toUpperCase()); }));
      S.zonas = Array.from(setZ);
    }

    function getAvailableFundos(filterZones) {
      const setF = new Set();
      S.ciclos.forEach(c => {
        if (!c.fundo) return;
        const fUpper = String(c.fundo).trim().toUpperCase();
        const zUpper = String(c.zona || "").trim().toUpperCase();
        if (!filterZones || !filterZones.length || filterZones.includes("TODAS") || filterZones.includes(zUpper)) {
          setF.add(fUpper);
        }
      });
      S.usuarios.forEach(u => {
        const uZonas = (u.zonas || []).map(z => String(z).toUpperCase());
        const zoneMatch = !filterZones || !filterZones.length || filterZones.includes("TODAS") || uZonas.some(z => filterZones.includes(z));
        if (zoneMatch) {
          (u.fundos || []).forEach(f => { if (f) setF.add(String(f).trim().toUpperCase()); });
        }
      });
      return Array.from(setF);
    }

    function getUserAllowedFundos() {
      const u = S.user;
      if (!u) return [];
      if (u.perfil === "ADMI") return getAvailableFundos(["TODAS"]);
      if (u.perfil === "AUXILIAR") return getAvailableFundos(u.zonas || []);
      if (Array.isArray(u.fundos) && u.fundos.length) {
        return u.fundos.map(f => String(f).trim().toUpperCase());
      }
      return getAvailableFundos(u.zonas || []);
    }

    async function refreshFromCloud(showFeedback) {
      const lbl = document.getElementById("refreshLoginLabel");
      if (showFeedback) {
        setCloudStatus("Sincronizando...", "syncing");
        if (lbl) lbl.textContent = "...";
      }
      const res = await apiCall({ action: "init" }, 4500);
      const ok = applyCloudPayload(res);
      if (showFeedback) {
        if (ok) {
          setCloudStatus("Nube OK (" + S.usuarios.length + " usr)", "ok");
          if (S.user) renderAllViews();
        } else {
          setCloudStatus(S.mode === "drive" ? "Caché local" : "Modo Demo", "offline");
        }
        if (lbl) lbl.textContent = "Actualizar";
      }
      return ok;
    }

    async function attemptLogin() {
      const pinInput = document.getElementById("loginPin");
      const msg = document.getElementById("loginMsg");
      const pin = (pinInput.value || "").replace(/\D/g, "").trim();
      if (!pin) return;

      msg.style.color = "var(--text-muted)";
      msg.textContent = "Validando PIN...";

      if (pin === MASTER_PIN) {
        enterSession({
          nombre: "Administrador",
          perfil: "ADMI",
          zonas: ["TODAS"],
          fundos: [],
          pin: MASTER_PIN
        });
        refreshFromCloud(false);
        return;
      }

      let found = S.usuarios.find(u => String(u.pin).trim() === pin);

      if (!found && S.mode === "drive") {
        const res = await apiCall({ action: "login", pin }, 4500);
        if (res && res.ok && res.usuario) {
          applyCloudPayload(res.bootstrap || res);
          found = res.usuario;
        }
      }

      if (found) {
        enterSession(found);
        refreshFromCloud(false);
      } else {
        msg.style.color = "var(--err)";
        msg.textContent = "PIN no encontrado. Si lo creaste recién, pulsa Actualizar.";
        setTimeout(() => {
          pinInput.value = "";
          pinInput.focus();
        }, 550);
      }
    }

        ];

      } else {

          { id: "tareo", label: "Tareo" },
          { id: "asistencia", label: "Asistencia" },
          { id: "ajuste", label: "Ajuste" },
          { id: "proyeccion", label: "Proyección" },
          { id: "historial", label: "Historial (30d)" }
        ];
      }

      tabsBar.innerHTML = tabs.map(t =>
        `<button class="tab-btn ${S.activeTab === t.id ? "active" : ""}" onclick="switchTab('${t.id}')">${t.label}</button>`
      ).join("");

      switchTab(S.activeTab);
    }

    function logout() {
      closeDrawer();
      S.user = null;
      applyAppearance(true);
      document.getElementById("mainApp").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
      const pinEl = document.getElementById("loginPin");
      pinEl.value = "";
      document.getElementById("loginMsg").textContent = "";
      pinEl.focus();
    }

    function openDrawer() {
      document.getElementById("drawerBackdrop").classList.add("open");
      document.getElementById("sideDrawer").classList.add("open");
    }

    function closeDrawer() {
      document.getElementById("drawerBackdrop").classList.remove("open");
      document.getElementById("sideDrawer").classList.remove("open");
    }

    function hideAllViews() {
      ["viewResumen", "viewTareo", "viewAsistencia", "viewAjuste", "viewProyeccion", "viewHistorial",
       "viewAdminUsuarios", "viewAdminMaestros", "viewAdminApariencia"]
        .forEach(id => document.getElementById(id).classList.add("hidden"));
    }

    function switchTab(tabId) {
      S.activeTab = tabId;
      document.querySelectorAll("#reportTabsBar .tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.textContent.toLowerCase().includes(tabId.slice(0, 5)));
      });
      hideAllViews();

      if (tabId === "resumen") {
        document.getElementById("viewResumen").classList.remove("hidden");
        renderResumen();
      } else if (tabId === "tareo") {
        document.getElementById("viewTareo").classList.remove("hidden");
        renderTareo();
      } else if (tabId === "asistencia") {
        document.getElementById("viewAsistencia").classList.remove("hidden");
        renderAsistencia();
      } else if (tabId === "ajuste") {
        document.getElementById("viewAjuste").classList.remove("hidden");
        renderAjuste();
      } else if (tabId === "proyeccion") {
        document.getElementById("viewProyeccion").classList.remove("hidden");
        renderProyeccion();
      } else if (tabId === "historial") {
        document.getElementById("viewHistorial").classList.remove("hidden");
        renderHistorial();
      }
    }

    function openAdminTab(adminTab) {
      closeDrawer();
      if ((adminTab === "usuarios" || adminTab === "maestros") && S.user?.perfil !== "ADMI") return;
      S.activeAdminTab = adminTab;
      hideAllViews();
      document.querySelectorAll("#reportTabsBar .tab-btn").forEach(b => b.classList.remove("active"));

      if (adminTab === "usuarios") {
        document.getElementById("viewAdminUsuarios").classList.remove("hidden");
        renderAdminUsuarios();
      } else if (adminTab === "maestros") {
        document.getElementById("viewAdminMaestros").classList.remove("hidden");
        renderAdminMaestros();
      } else if (adminTab === "apariencia") {
        document.getElementById("viewAdminApariencia").classList.remove("hidden");
        renderAdminApariencia();
      }
    }

    function renderAllViews() {
      if (!S.user) return;
      enterSession(S.user);
    }

    // ---------------- RESUMEN CONSOLIDADO ----------------
    function getFilteredReportsForUser() {
      const u = S.user;
      const all = pruneOldReports(S.reportes);
      if (!u || u.perfil === "ADMI") return all;
      const allowedFundos = getUserAllowedFundos();
      return all.filter(r => {
        const rf = String(r.fundo || "").trim().toUpperCase();
        if (!rf || rf === "TODOS") return true;
        return allowedFundos.includes(rf);
      });
    }

    function renderResumen() {
      const container = document.getElementById("viewResumen");
      const reps = getFilteredReportsForUser();
      const sub = S.resumenSubTab || "tareos";

      const tareosList = reps.filter(r => r.tipo === "tareo");
      const asisList = reps.filter(r => r.tipo === "asistencia");
      const ajusteRows = reps.filter(r => r.tipo === "ajuste").flatMap(r => r.filas || []);
      const proyRows = reps.filter(r => r.tipo === "proyeccion").flatMap(r => r.filas || []);

      let tableHtml = "";
      if (sub === "tareos") {
        const totalPers = tareosList.reduce((acc, r) => acc + (r.filas ? r.filas.length : 0), 0);
        const totalHrs = tareosList.reduce((acc, r) => acc + (r.filas || []).reduce((s, f) => s + (parseFloat(f.horas) || 0), 0), 0);
        tableHtml = `
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Fecha</th><th>Fundo</th><th>Labor</th><th>Responsable</th><th>Trabajadores</th><th>Horas</th></tr></thead>

                  const hrs = (r.filas || []).reduce((s, f) => s + (parseFloat(f.horas) || 0), 0);

                }).join("") || `<tr><td colspan="6">Sin tareos registrados en el alcance.</td></tr>`}
                <tr class="total-row"><td colspan="4">TOTAL TAREO</td><td>${totalPers}</td><td>${totalHrs.toFixed(1)}</td></tr>
              </tbody>
            </table>
          </div>`;
      } else if (sub === "asistencia") {
        const rows = asisList.flatMap(r => (r.filas || []).map(f => ({ fecha: r.fecha, fundo: f.fundo || r.fundo, resp: r.responsable, ...f })));
        const totJorn = rows.reduce((s, x) => s + (parseFloat(x.jornales) || 0), 0);
        const totAv = rows.reduce((s, x) => s + (parseFloat(x.avance) || 0), 0);
        tableHtml = `
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Fecha</th><th>Fundo</th><th>Módulo</th><th>Variedad</th><th>Jornales</th><th>Avance</th><th>Responsable</th></tr></thead>

                ${rows.map(x => `<tr><td>${x.fecha || ""}</td><td>${x.fundo || ""}</td><td>${x.modulo || ""}</td><td>${x.variedad || ""}</td><td>${x.jornales || 0}</td><td>${x.avance || 0}</td><td>${x.resp || ""}</td></tr>`).join("") || `<tr><td colspan="7">Sin asistencias registradas.</td></tr>`}
                <tr class="total-row"><td colspan="4">TOTAL ASISTENCIA</td><td>${totJorn.toFixed(1)}</td><td>${totAv.toFixed(1)}</td><td></td></tr>
              </tbody>
            </table>
          </div>`;
      } else if (sub === "ajuste") {
        const totHa = ajusteRows.reduce((s, r) => s + (parseFloat(r.ha) || 0), 0);
        const totJorn = ajusteRows.reduce((s, r) => s + (parseFloat(r.jornales) || 0), 0);
        const totKilos = ajusteRows.reduce((s, r) => s + (parseFloat(r.kilos) || 0), 0);
        const kgHaPond = totHa > 0 ? (totKilos / totHa).toFixed(1) : "0.0";
        const kgJornPond = totJorn > 0 ? (totKilos / totJorn).toFixed(1) : "0.0";
        tableHtml = `
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Semana</th><th>Fecha</th><th>Tipo</th><th>Fundo</th><th>Módulo</th><th>Variedad</th><th>Ciclo</th>
                  <th>Responsable</th><th>Formato</th><th>Destino</th><th>Días Reingreso</th><th>Ha</th><th>Kg/Ha</th>

                </tr>
              </thead>
              <tbody>

                    <td>${r.modulo || ""}</td><td>${r.variedad || ""}</td><td>${r.ciclo || ""}</td><td>${r.responsable || ""}</td>

                    <td>${r.ha ?? ""}</td><td>${r.kgHa ?? ""}</td><td>${r.jornales ?? ""}</td>

                  <td colspan="11">TOTAL AJUSTE</td>

        const kgJornPond = totJorn > 0 ? (totKilos / totJorn).toFixed(1) : "0.0";
        tableHtml = `
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Semana</th><th>Fecha</th><th>Tipo</th><th>Fundo</th><th>Módulo</th><th>Variedad</th><th>Ciclo</th>
                  <th>Formato</th><th>Destino</th><th>Días de Reingreso</th><th>Ha</th><th>Kg/Ha</th>
                  <th>Jornales (Cosechador)</th><th>Kilos</th><th>Kg/Jornales</th>

              <tbody>

                  <tr>
                    <td>${r.semana || ""}</td><td>${r.fecha || ""}</td><td>Cosecha</td><td>${r.fundo || ""}</td>
                    <td>${r.modulo || ""}</td><td>${r.variedad || ""}</td><td>${r.ciclo || ""}</td>
                    <td></td><td></td><td>${r.diasReingreso ?? ""}</td>

                    <td>${r.kilos ?? ""}</td><td>${r.kgJornales ?? ""}</td>
                  </tr>`).join("") || `<tr><td colspan="15">Sin registros de Proyección.</td></tr>`}
                <tr class="total-row">
                  <td colspan="10">TOTAL PROYECCIÓN</td>
                  <td>${totHa.toFixed(2)}</td><td>${kgHaPond}</td><td>${totJorn.toFixed(1)}</td>
                  <td>${Math.round(totKilos)}</td><td>${kgJornPond}</td>
                </tr>
              </tbody>

      container.innerHTML = `
        <div class="glass section-card">
          <div class="section-head">
            <h2 class="section-title">Resumen Consolidado</h2>
            <div class="toolbar-actions">
              <button class="btn-sm ok" onclick="exportResumenPNG()">🖼 PNG</button>
              <button class="btn-sm accent" onclick="exportResumenExcel()">📊 Excel</button>

            <button class="chip-toggle ${sub === "asistencia" ? "selected" : ""}" onclick="setResumenSub('asistencia')">Asistencia (${asisList.length})</button>
            <button class="chip-toggle ${sub === "ajuste" ? "selected" : ""}" onclick="setResumenSub('ajuste')">Ajuste (${ajusteRows.length})</button>

    function setResumenSub(sub) {

    // ---------------- TAREO ----------------

            <div>
              <label class="lbl">Labor</label>
              <select class="sel" onchange="S.tareoDraft.labor = this.value">
                <option value="">${S.labores.length ? "Selecciona labor" : "Sin labores cargadas"}</option>
                ${S.labores.map(l => {
                  const val = l.codigo ? `${l.codigo} - ${l.nombre}` : l.nombre;

    function onTareoDniInput(idx, val) {
      const clean = val.replace(/\D/g, "");
      S.tareoDraft.filas[idx].dni = clean;
      const found = S.personal.find(p => String(p.dni).trim() === clean);
      if (found) {
        S.tareoDraft.filas[idx].nombre = found.nombre;
        renderTareo();
      }
    }

    function clearTareoDni(idx) {
      S.tareoDraft.filas[idx].dni = "";
      S.tareoDraft.filas[idx].nombre = "";
      renderTareo();
    }

    function addTareoRow() {
      S.tareoDraft.filas.push({ dni: "", nombre: "", horas: "8" });
      renderTareo();
    }

    function removeTareoRow(idx) {
      if (S.tareoDraft.filas.length > 1) {
        S.tareoDraft.filas.splice(idx, 1);
      } else {
        S.tareoDraft.filas[0] = { dni: "", nombre: "", horas: "8" };
      }
      renderTareo();
    }

            <h2 class="section-title">Distribución Cosecha · Asistencia</h2>

              <button class="btn-sm" onclick="downloadTemplate('asistencia')">Plantilla</button>

              <button class="btn-sm ok" onclick="exportAsistenciaPNG()">🖼 Foto PNG</button>
              <button class="btn-sm" onclick="exportAsistenciaExcel()">Excel</button>

          </div>
          <div class="grid-2" style="margin-bottom:12px;">
            <div>
              <label class="lbl">Fecha</label>
              <input type="date" class="inp" value="${S.asistenciaDraft.fecha}" onchange="S.asistenciaDraft.fecha = this.value" />

            <div>
              <label class="lbl">Fundo principal</label>
              <select class="sel" onchange="S.asistenciaDraft.fundo = this.value; renderAsistencia();">
                ${allowedFundos.map(f => `<option value="${esc(f)}" ${S.asistenciaDraft.fundo === f ? "selected" : ""}>${esc(f)}</option>`).join("")}
              </select>
            </div>
          </div>
          ${rowsHtml}
          <div class="toolbar-actions" style="margin-top:10px;">
            <button class="btn-sm" onclick="addAsisRow()">+ Agregar fila</button>

        </div>`;

    function onAsisRowFundo(idx, val) {
      S.asistenciaDraft.filas[idx].fundo = val;
      S.asistenciaDraft.filas[idx].modulo = "";
      S.asistenciaDraft.filas[idx].variedad = "";
      renderAsistencia();
    }

    function onAsisRowModulo(idx, val) {
      S.asistenciaDraft.filas[idx].modulo = val;
      S.asistenciaDraft.filas[idx].variedad = "";
      renderAsistencia();
    }

    function addAsisRow() {
      const f = S.asistenciaDraft.fundo || (getUserAllowedFundos()[0] || "");
      S.asistenciaDraft.filas.push({ fundo: f, modulo: "", variedad: "", jornales: "", avance: "" });
      renderAsistencia();
    }

    function removeAsisRow(idx) {
      if (S.asistenciaDraft.filas.length > 1) S.asistenciaDraft.filas.splice(idx, 1);
      else S.asistenciaDraft.filas[0] = { fundo: S.asistenciaDraft.fundo, modulo: "", variedad: "", jornales: "", avance: "" };
      renderAsistencia();
    }

    // ---------------- HELPERS DE CICLOS ----------------
    function getModulosByFundo(fundo) {
      const fu = String(fundo || "").trim().toUpperCase();
      const setM = new Set();
      S.ciclos.forEach(c => {
        if (String(c.fundo || "").trim().toUpperCase() === fu && c.modulo !== undefined && c.modulo !== "") {
          setM.add(String(c.modulo).trim());
        }
      });
      return Array.from(setM);
    }

    function getVariedadesByFundoModulo(fundo, modulo) {
      const fu = String(fundo || "").trim().toUpperCase();
      const mu = String(modulo || "").trim();
      const setV = new Set();
      S.ciclos.forEach(c => {
        if (String(c.fundo || "").trim().toUpperCase() === fu && (!mu || String(c.modulo).trim() === mu) && c.variedad) {
          setV.add(String(c.variedad).trim());
        }
      });
      return Array.from(setV);
    }

    function lookupCiclo(fundo, modulo, variedad) {
      const fu = String(fundo || "").trim().toUpperCase();
      const mu = String(modulo || "").trim();
      const vu = String(variedad || "").trim().toUpperCase();
      const match = S.ciclos.find(c =>
        String(c.fundo || "").trim().toUpperCase() === fu &&
        String(c.modulo || "").trim() === mu &&
        String(c.variedad || "").trim().toUpperCase() === vu
      );
      return match ? String(match.ciclo || "") : "";
    }

    // ---------------- AJUSTE (16 COLUMNAS) ----------------

    // ---------------- ENVÍO E HISTORIAL (30D) ----------------
    async function submitReport(tipo) {
      const u = S.user;
      if (!u) return;
      let rep = null;

      if (tipo === "tareo") {
        rep = {
          id: S.editingReportId || ("TAR_" + Date.now()),
          tipo: "tareo",
          fecha: S.tareoDraft.fecha,
          fundo: S.tareoDraft.fundo,
          labor: S.tareoDraft.labor,
          responsable: u.nombre,
          pin: u.pin,
          filas: S.tareoDraft.filas.filter(f => f.dni || f.nombre),
          savedAt: new Date().toISOString()
        };
      } else if (tipo === "asistencia") {
        rep = {
          id: S.editingReportId || ("ASI_" + Date.now()),
          tipo: "asistencia",
          fecha: S.asistenciaDraft.fecha,
          fundo: S.asistenciaDraft.fundo,
          responsable: u.nombre,
          pin: u.pin,
          filas: S.asistenciaDraft.filas.filter(f => f.modulo || f.variedad || f.jornales || f.avance),
          savedAt: new Date().toISOString()
        };
      } else if (tipo === "ajuste") {
        S.ajusteDraft.filas.forEach(recalcAjusteRow);
        rep = {
          id: S.editingReportId || ("AJU_" + Date.now()),
          tipo: "ajuste",
          fecha: S.ajusteDraft.fecha,
          fundo: S.ajusteDraft.fundoFiltro !== "ALL" ? S.ajusteDraft.fundoFiltro : (S.ajusteDraft.filas[0]?.fundo || ""),
          responsable: u.nombre,
          pin: u.pin,
          filas: S.ajusteDraft.filas.slice(),
          savedAt: new Date().toISOString()
        };
      } else if (tipo === "proyeccion") {
        S.proyeccionDraft.filas.forEach(recalcProyeccionRow);
        rep = {
          id: S.editingReportId || ("PRO_" + Date.now()),
          tipo: "proyeccion",
          fecha: S.proyeccionDraft.fecha,
          fundo: S.proyeccionDraft.fundoFiltro !== "ALL" ? S.proyeccionDraft.fundoFiltro : (S.proyeccionDraft.filas[0]?.fundo || ""),
          responsable: u.nombre,
          pin: u.pin,
          filas: S.proyeccionDraft.filas.slice(),
          savedAt: new Date().toISOString()
        };
      }

      if (!rep) return;
      const idxExisting = S.reportes.findIndex(r => r.id === rep.id);
      if (idxExisting >= 0) S.reportes[idxExisting] = rep;
      else S.reportes.unshift(rep);

      S.reportes = pruneOldReports(S.reportes);
      S.editingReportId = null;
      saveLocalCache();
      apiCall({ action: "guardarReporte", reporte: rep }, 4500);

      showToast("Reporte guardado y enviado.");
      if (tipo === "tareo") {
        S.tareoDraft.filas = [{ dni: "", nombre: "", horas: "8" }];
        renderTareo();
      } else if (tipo === "asistencia") {
        S.asistenciaDraft.filas = [{ fundo: S.asistenciaDraft.fundo, modulo: "", variedad: "", jornales: "", avance: "" }];
        renderAsistencia();
      } else if (tipo === "ajuste") {
        S.ajusteDraft.filas = [];
        renderAjuste();
      } else if (tipo === "proyeccion") {
        S.proyeccionDraft.filas = [];
        renderProyeccion();
      }
    }

    function renderHistorial() {
      const container = document.getElementById("viewHistorial");
      S.reportes = pruneOldReports(S.reportes);
      saveLocalCache();

      const mine = S.user?.perfil === "ADMI"

      container.innerHTML = `

    async function createUser() {
      const nombre = (document.getElementById("newUserName").value || "").trim().toUpperCase();
      const perfil = document.getElementById("newUserRole").value;
      const pin = (document.getElementById("newUserPin").value || "").replace(/\D/g, "").trim();

        ? []
        : Array.from(document.querySelectorAll("#newUserFundosBox .chip-toggle.selected")).map(b => b.dataset.newFundo);

      if (!nombre || pin.length < 4) {
        showToast("Completa nombre y PIN de al menos 4 dígitos.");
        return;
      }
      if (pin === MASTER_PIN || S.usuarios.some(u => String(u.pin) === pin)) {
        showToast("Ese PIN ya está en uso.");
        return;
      }

      const newUser = { nombre, perfil, zonas, fundos, pin };
      S.usuarios.push(newUser);
      saveLocalCache();
      renderAdminUsuarios();

      const res = await apiCall({ action: "crearUsuario", usuario: newUser }, 4500);
      if (res && Array.isArray(res.usuarios)) {
        S.usuarios = res.usuarios;

      showToast("Usuario guardado y sincronizado en Drive.");

      const perfil = document.getElementById("editURole").value;
      const pin = (document.getElementById("editUPin").value || "").replace(/\D/g, "").trim();

      if (!nombre || pin.length < 4) return;
      const updated = { nombre, perfil, zonas, fundos, pin };
      const idx = S.usuarios.findIndex(x => String(x.pin) === String(oldPin));
      if (idx >= 0) S.usuarios[idx] = updated;

      closeModal();
      saveLocalCache();
      renderAdminUsuarios();

      const res = await apiCall({ action: "editarUsuario", oldPin, usuario: updated }, 4500);
      if (res && Array.isArray(res.usuarios)) {
        S.usuarios = res.usuarios;
        saveLocalCache();
        renderAdminUsuarios();
      }
      showToast("Usuario actualizado.");

    document.getElementById("hiddenBgInput").addEventListener("change", function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file || S.user?.perfil !== "ADMI") return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const maxW = 1280;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          S.apariencia.wallImage = dataUrl;
          try { localStorage.setItem("tareos_wall_image", dataUrl); } catch (_) {}
          applyAppearance(!S.user);
          syncGlobalWallpaper();
          renderAdminApariencia();
          showToast("Fondo global guardado.");
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    // ---------------- EXCEL / PLANTILLAS / PNG ----------------
    let pendingUploadType = null;

    function triggerExcelUpload(type) {
      pendingUploadType = type;
      const inp = document.getElementById("hiddenExcelInput");
      inp.value = "";
      inp.click();
    }

    document.getElementById("hiddenExcelInput").addEventListener("change", function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file || !pendingUploadType || !window.XLSX) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        const wb = XLSX.read(ev.target.result, { type: "array" });
        const targetSheetName =
          pendingUploadType === "personal"
            ? (wb.SheetNames.find(n => String(n).trim().toLowerCase() === "trabajadores") || wb.SheetNames[0])
            : wb.SheetNames[0];
        const ws = wb.Sheets[targetSheetName];
        const rows =
          pendingUploadType === "personal"
            ? XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" })
            : XLSX.utils.sheet_to_json(ws, { defval: "" });
        processExcelRows(pendingUploadType, rows);
        pendingUploadType = null;
      };
      reader.readAsArrayBuffer(file);
    });

    function normalizeHeaderCell(val) {
      return String(val ?? "")
        .trim()
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ");
    }

    function parseTrabajadoresMatrix(matrixRows) {
      if (!Array.isArray(matrixRows) || !matrixRows.length) return [];

      let headerRowIdx = -1;
      let colMap = {};
      const scanLimit = Math.min(matrixRows.length, 15);

      for (let r = 0; r < scanLimit; r++) {
        const row = Array.isArray(matrixRows[r]) ? matrixRows[r] : [];
        const tempMap = {};
        row.forEach((cell, cIdx) => {
          const h = normalizeHeaderCell(cell);
          if (!h) return;
          if (h === "DNI" || h === "NRO DOCUMENTO" || h === "NUMERO DOCUMENTO") tempMap.dni = cIdx;
          else if (h === "TIPO DOCUMENTO" || h === "TIPO DOC") tempMap.tipoDoc = cIdx;
          else if (h === "APELLIDO PATERNO" || h === "A. PATERNO" || h === "AP PATERNO") tempMap.apPaterno = cIdx;
          else if (h === "APELLIDO MATERNO" || h === "A. MATERNO" || h === "AP MATERNO") tempMap.apMaterno = cIdx;
          else if (h === "NOMBRES" || h === "NOMBRE" || h === "TRABAJADOR" || h === "APELLIDOS Y NOMBRES") tempMap.nombres = cIdx;
          else if (h === "SEXO" || h === "GENERO") tempMap.sexo = cIdx;
          else if (h === "FECHA INGRESO" || h === "F. INGRESO") tempMap.fechaIngreso = cIdx;
          else if (h === "FECHA CESE" || h === "F. CESE") tempMap.fechaCese = cIdx;
          else if (h === "MOTIVO CESE") tempMap.motivoCese = cIdx;
          else if (h === "OBSERVACIONES" || h === "OBSERVACION") tempMap.observaciones = cIdx;
          else if (h === "ZONA PROCEDENCIA" || h === "ZONA DE PROCEDENCIA" || h === "PROCEDENCIA") tempMap.zonaProcedencia = cIdx;
          else if (h === "ESTADO") tempMap.estado = cIdx;
        });

        const hasDni = tempMap.dni !== undefined;
        const hasNamePart =
          tempMap.nombres !== undefined ||
          tempMap.apPaterno !== undefined ||
          tempMap.apMaterno !== undefined;

        if (hasDni && hasNamePart) {
          headerRowIdx = r;
          colMap = tempMap;
          break;
        }
      }

      if (headerRowIdx === -1) return [];

      const byDni = new Map();
      S.personal.forEach(p => {
        const key = String(p.dni || "").replace(/\D/g, "").trim();
        if (key) byDni.set(key, p);
      });

      let importedCount = 0;

      for (let r = headerRowIdx + 1; r < matrixRows.length; r++) {
        const row = Array.isArray(matrixRows[r]) ? matrixRows[r] : [];
        const rawDni = colMap.dni !== undefined ? String(row[colMap.dni] ?? "").trim() : "";
        const dni = rawDni.replace(/\D/g, "") || rawDni;

        const apPat = colMap.apPaterno !== undefined ? String(row[colMap.apPaterno] ?? "").trim() : "";
        const apMat = colMap.apMaterno !== undefined ? String(row[colMap.apMaterno] ?? "").trim() : "";
        const noms = colMap.nombres !== undefined ? String(row[colMap.nombres] ?? "").trim() : "";

        const fullName = [apPat, apMat, noms]
          .join(" ")
          .replace(/\s+/g, " ")
          .trim()
          .toUpperCase();

        if (!dni || !fullName) continue;

        const estadoRaw = colMap.estado !== undefined ? String(row[colMap.estado] ?? "").trim().toUpperCase() : "";
        const estadoFinal = estadoRaw || "ACTIVO";

        const record = {
          dni,
          nombre: fullName,
          tipoDoc: colMap.tipoDoc !== undefined ? String(row[colMap.tipoDoc] ?? "").trim() : "",
          apellidoPaterno: apPat.toUpperCase(),
          apellidoMaterno: apMat.toUpperCase(),
          nombres: noms.toUpperCase(),
          sexo: colMap.sexo !== undefined ? String(row[colMap.sexo] ?? "").trim().toUpperCase() : "",
          fechaIngreso: colMap.fechaIngreso !== undefined ? String(row[colMap.fechaIngreso] ?? "").trim() : "",
          fechaCese: colMap.fechaCese !== undefined ? String(row[colMap.fechaCese] ?? "").trim() : "",
          motivoCese: colMap.motivoCese !== undefined ? String(row[colMap.motivoCese] ?? "").trim() : "",
          observaciones: colMap.observaciones !== undefined ? String(row[colMap.observaciones] ?? "").trim() : "",
          zonaProcedencia: colMap.zonaProcedencia !== undefined ? String(row[colMap.zonaProcedencia] ?? "").trim().toUpperCase() : "",
          estado: estadoFinal
        };

        byDni.set(dni, record);
        importedCount++;
      }

      if (importedCount > 0) {
        S.personal = Array.from(byDni.values());
      }

      return { importedCount, total: S.personal.length };
    }

    function processExcelRows(type, rows) {
      if (!Array.isArray(rows) || !rows.length) return;
      if (type === "ciclos") {
        const parsed = rows.map(r => ({
          clave: String(r["&"] || r["Clave"] || "").trim(),
          zona: String(r["Zona"] || r["ZONA"] || "TRUJILLO").trim().toUpperCase(),
          fundo: String(r["Fundo"] || r["FUNDO"] || "").trim().toUpperCase(),
          variedad: String(r["Variedad"] || r["VARIEDAD"] || "").trim(),
          modulo: String(r["Módulo"] || r["Modulo"] || r["MODULO"] || "").trim(),
          area: parseFloat(r["Area"] || r["Área"] || 0) || 0,
          ciclo: String(r["Ciclo"] || r["CICLO"] || "").trim()
        })).filter(x => x.fundo && x.ciclo);
        if (parsed.length) {
          S.ciclos = parsed;
          syncZonesFromMasters();
          saveLocalCache();
          apiCall({ action: "guardarMaestros", maestros: exportMaestrosObj() }, 4500);
          renderAdminMaestros();
          showToast(`Se cargaron ${parsed.length} ciclos y se sincronizaron en Drive.`);
        }
      } else if (type === "labores") {
        const parsedLabores = rows.map(r => {
          const nombre = String(
            r["Nombre de labor"] || r["Nombre de Labor"] || r["NOMBRE DE LABOR"] ||
            r["Nombre"] || r["Labor"] || r["LABOR"] || ""
          ).trim().toUpperCase();
          const codigo = String(r["Labor"] || r["Codigo"] || r["Código"] || r["CODIGO"] || "").trim().toUpperCase();
          const finalNombre = nombre || codigo;
          const finalCodigo = (nombre && codigo && codigo !== nombre) ? codigo : "";
          return finalNombre ? { codigo: finalCodigo, nombre: finalNombre } : null;
        }).filter(Boolean);
        if (parsedLabores.length) {
          S.labores = parsedLabores;
          saveLocalCache();
          apiCall({ action: "guardarMaestros", maestros: exportMaestrosObj() }, 4500);
          renderAdminMaestros();
          showToast(`Se cargaron ${parsedLabores.length} labores en Drive.`);
        }
      } else if (type === "personal") {
        const result = parseTrabajadoresMatrix(rows);
        if (result && result.importedCount > 0) {
          saveLocalCache();
          apiCall({ action: "guardarMaestros", maestros: exportMaestrosObj() }, 4500);
          renderAdminMaestros();
          if (S.user) {
            document.getElementById("activeUserMeta").textContent =
              `${S.personal.length} pers. · ${S.labores.length} labores · ${S.ciclos.length} ciclos`;
          }
          showToast(`Se cargaron ${result.importedCount} trabajadores (${result.total} en total) y se guardaron en Drive.`);
        } else {
          showToast("No se encontraron filas válidas con DNI y nombres en la hoja Trabajadores.");
        }
      } else if (type === "tareo") {
        S.tareoDraft.filas = rows.map(r => ({
          dni: String(r["DNI"] || r["dni"] || "").trim(),
          nombre: String(r["Nombre"] || r["Nombres"] || r["Trabajador"] || "").trim(),
          horas: String(r["Horas"] || r["horas"] || "8")
        }));
        renderTareo();
      } else if (type === "asistencia") {
        S.asistenciaDraft.filas = rows.map(r => ({
          fundo: String(r["Fundo"] || S.asistenciaDraft.fundo || "").trim().toUpperCase(),
          modulo: String(r["Módulo"] || r["Modulo"] || "").trim(),
          variedad: String(r["Variedad"] || "").trim(),
          jornales: String(r["Jornales"] || ""),
          avance: String(r["Avance"] || "")
        }));
        renderAsistencia();
      } else if (type === "ajuste") {
        S.ajusteDraft.filas = rows.map(r => {
          const fecha = String(r["Fecha"] || S.ajusteDraft.fecha);
          const row = {
            semana: r["Semana"] || getISOWeek(fecha),
            fecha,
            tipo: "Cosecha",
            fundo: String(r["Fundo"] || "").trim().toUpperCase(),
            modulo: String(r["Módulo"] || r["Modulo"] || "").trim(),
            variedad: String(r["Variedad"] || "").trim(),
            ciclo: String(r["Ciclo"] || "").trim(),
            responsable: String(r["Responsable"] || S.user?.nombre || "").trim(),
            formato: String(r["Formato"] || "").trim(),
            destino: String(r["Destino"] || "").trim(),
            diasReingreso: r["Días de Reingreso"] ?? r["Dias de Reingreso"] ?? "",
            ha: r["Ha"] ?? "",
            kgHa: r["Kg/Ha"] ?? "",
            jornales: r["Jornales (Cosechador)"] ?? r["Jornales"] ?? "",
            kilos: 0,
            kgJornales: "0.0"
          };
          recalcAjusteRow(row);
          return row;
        });
        renderAjuste();
      } else if (type === "proyeccion") {
        S.proyeccionDraft.filas = rows.map(r => {
          const fecha = String(r["Fecha"] || S.proyeccionDraft.fecha);
          const row = {
            semana: r["Semana"] || getISOWeek(fecha),
            fecha,
            tipo: "Cosecha",
            fundo: String(r["Fundo"] || "").trim().toUpperCase(),
            modulo: String(r["Módulo"] || r["Modulo"] || "").trim(),
            variedad: String(r["Variedad"] || "").trim(),
            ciclo: String(r["Ciclo"] || "").trim(),
            formato: "",
            destino: "",
            diasReingreso: r["Días de Reingreso"] ?? r["Dias de Reingreso"] ?? "",
            ha: r["Ha"] ?? "",
            kgHa: r["Kg/Ha"] ?? "",
            jornales: r["Jornales (Cosechador)"] ?? r["Jornales"] ?? "",
            kilos: 0,
            kgJornales: "0.0"
          };
          recalcProyeccionRow(row);
          return row;
        });
        renderProyeccion();
      }
    }

        ]);
        const wbBanner = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wbBanner, wsBanner, "Trabajadores");
        XLSX.writeFile(wbBanner, "plantilla_personal.xlsx");
        return;
      } else {
        headers = ["DNI", "Nombre", "Horas"];
        sample = { DNI: "12345678", Nombre: "APELLIDO NOMBRE", Horas: 8 };
      }
      const ws = XLSX.utils.json_to_sheet([sample], { header: headers });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Plantilla");

    function renderPngPreview(title, subtitle, lines) {
      const scale = 3;
      const width = 760;
      const rowH = 34;
      const height = (130 + lines.length * rowH) * scale;
      const canvas = document.createElement("canvas");
      canvas.width = width * scale;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, width, height / scale);

      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText(title, 24, 38);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "13px sans-serif";
      ctx.fillText(subtitle, 24, 62);

      lines.forEach((line, idx) => {
        const y = 95 + idx * rowH;
        ctx.fillStyle = idx % 2 === 0 ? "rgba(255,255,255,0.04)" : "rgba(255,255,255,0.01)";
        ctx.fillRect(20, y - 20, width - 40, rowH - 4);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "13px sans-serif";
        ctx.fillText(line, 30, y);
      });

      const dataUrl = canvas.toDataURL("image/png");
      openModal(`
        <h3 class="section-title" style="margin-bottom:8px;">Vista previa PNG (3x)</h3>
        <img src="${dataUrl}" alt="Reporte PNG" style="width:100%; border-radius:12px; margin-bottom:12px; border:1px solid var(--glass-border);" />
        <div class="toolbar-actions">
          <a class="btn-sm accent" download="reporte_${todayISO()}.png" href="${dataUrl}">Descargar PNG</a>
          <button class="btn-sm" onclick="closeModal()">Cerrar</button>
        </div>`);
    }

    function exportAsistenciaPNG() {
      const lines = S.asistenciaDraft.filas.map((f, i) =>

      );
      renderPngPreview("Distribución Cosecha · Asistencia", `Fecha: ${S.asistenciaDraft.fecha} · Resp: ${S.user?.nombre || ""}`, lines);
    }

    function exportResumenPNG() {
      const reps = getFilteredReportsForUser();

        `${String(r.tipo || "").toUpperCase()} · ${r.fecha || ""} · ${r.fundo || ""} · ${(r.filas || []).length} filas · ${r.responsable || ""}`

    function openModal(html) {
      document.getElementById("modalCard").innerHTML = html;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function showToast(text) {
      const el = document.getElementById("loginMsg");
      if (el && !S.user) {
        el.style.color = "var(--ok)";
        el.textContent = text;
      }
      setCloudStatus(text, "ok");
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    (function initApp() {
      loadLocalCache();
      syncZonesFromMasters();
      applyAppearance(true);

      document.getElementById("btnModeDrive").classList.toggle("active", S.mode === "drive");
      document.getElementById("btnModeDemo").classList.toggle("active", S.mode === "demo");

      const pinEl = document.getElementById("loginPin");
      const handlePinChange = () => {
        const clean = (pinEl.value || "").replace(/\D/g, "");
        if (pinEl.value !== clean) pinEl.value = clean;
        if (clean.length === 4) {
          attemptLogin();
        }
      };
      pinEl.addEventListener("input", handlePinChange);
      pinEl.addEventListener("keyup", handlePinChange);
      pinEl.addEventListener("change", handlePinChange);

      const xlsxScript = document.createElement("script");
      xlsxScript.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
      xlsxScript.async = true;
      document.body.appendChild(xlsxScript);

      if (S.mode === "drive") {
        setTimeout(() => refreshFromCloud(false), 80);
      }
    })();
  </script>
