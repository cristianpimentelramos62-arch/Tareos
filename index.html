    function matrizDistAFilas(rows) {
      if (!Array.isArray(rows) || !rows.length) return [];
      let startRow = 0;
      let colMap = { fundo: 0, grupo: 1, supervisor: 2, cosecha: 3, supCiclo: 4, supCuadrilla: 5, jabero: 6, limpieza: 7, riego: 8, otros: 9 };

      for (let r = 0; r < Math.min(rows.length, 12); r++) {
        const normRow = (rows[r] || []).map(normHeader);
        const supIdx = normRow.findIndex(c => c.includes("SUPERVISOR") || c.includes("NOMBRE"));
        const cosIdx = normRow.findIndex(c => c.includes("COSECHA"));
        if (supIdx !== -1 || cosIdx !== -1) {
          const fIdx = normRow.findIndex(c => c.includes("FUNDO"));
          const gIdx = normRow.findIndex(c => c.includes("GRUPO"));
          const scIdx = normRow.findIndex(c => c.includes("CICLO"));
          const sqIdx = normRow.findIndex(c => c.includes("CUADRILLA"));
          const jIdx = normRow.findIndex(c => c.includes("JABERO"));
          const lIdx = normRow.findIndex(c => c.includes("LIMPIEZ"));
          const riIdx = normRow.findIndex(c => c.includes("RIEGO"));
          const oIdx = normRow.findIndex(c => c.includes("OTRO"));

          if (fIdx !== -1) colMap.fundo = fIdx;
          if (gIdx !== -1) colMap.grupo = gIdx;
          if (supIdx !== -1) colMap.supervisor = supIdx;
          if (cosIdx !== -1) colMap.cosecha = cosIdx;
          if (scIdx !== -1) colMap.supCiclo = scIdx;
          if (sqIdx !== -1) colMap.supCuadrilla = sqIdx;
          if (jIdx !== -1) colMap.jabero = jIdx;
          if (lIdx !== -1) colMap.limpieza = lIdx;
          if (riIdx !== -1) colMap.riego = riIdx;
          if (oIdx !== -1) colMap.otros = oIdx;
          startRow = r + 1;
          break;
        }
      }

      const numVal = v => {
        const n = Number(String(v ?? "").replace(",", ".").trim());
        return !isNaN(n) && n > 0 ? n : 0;
      };

      const out = [];
      for (let i = startRow; i < rows.length; i++) {
        const row = rows[i] || [];
        const sup = String(row[colMap.supervisor] ?? "").trim();
        const fundo = String(row[colMap.fundo] ?? "").trim() || S.fundo || "";
        const grupo = String(row[colMap.grupo] ?? "").trim();
        const vals = {
          cosecha: numVal(row[colMap.cosecha]),
          supCiclo: numVal(row[colMap.supCiclo]),
          supCuadrilla: numVal(row[colMap.supCuadrilla]),
          jabero: numVal(row[colMap.jabero]),
          limpieza: numVal(row[colMap.limpieza]),
          riego: numVal(row[colMap.riego]),
          otros: numVal(row[colMap.otros])
        };
        const suma = Object.values(vals).reduce((a, b) => a + b, 0);
        if (!sup && !grupo && suma === 0) continue;
        if (normHeader(sup) === "TOTAL" || normHeader(fundo) === "TOTAL") continue;

        out.push({
          fundo,
          grupo,
          supervisor: sup,
          ...vals
        });
      }
      return out;
    }

    function matrizPersonalATsv(rows) {
      if (!Array.isArray(rows) || !rows.length) return "";

      let headerIdx = -1;
      let colMap = { dni: 2, pat: 3, mat: 4, nom: 5, full: -1, zona: 6, est: 7 };

      for (let r = 0; r < Math.min(rows.length, 15); r++) {
        const normRow = (rows[r] || []).map(normHeader);
        const dniCol = normRow.findIndex(c => c === "DNI" || c === "NRO DOCUMENTO" || c === "NUMERO DOCUMENTO" || c === "DOCUMENTO");
        if (dniCol !== -1) {
          headerIdx = r;
          const patCol = normRow.findIndex(c => c.includes("PATERNO"));
          const matCol = normRow.findIndex(c => c.includes("MATERNO"));
          const nomCol = normRow.findIndex(c => c === "NOMBRES" || c === "NOMBRE");
          const fullCol = normRow.findIndex(c => c.includes("APELLIDOS Y NOMBRES") || c.includes("TRABAJADOR"));
          const zonaCol = normRow.findIndex(c => c.includes("ZONA") || c.includes("FUNDO") || c.includes("AREA") || c.includes("SEDE"));
          const estCol = normRow.findIndex(c => c.includes("ESTADO") || c.includes("SITUACION"));

          colMap = {
            dni: dniCol,
            pat: patCol,
            mat: matCol,
            nom: nomCol,
            full: fullCol,
            zona: zonaCol !== -1 ? zonaCol : dniCol + 4,
            est: estCol !== -1 ? estCol : dniCol + 5
          };
          break;
        }
      }

      const startRow = headerIdx !== -1 ? headerIdx + 1 : 0;
      const tsvLines = ["#\tTIPO DOCUMENTO\tDNI\tAPELLIDO PATERNO\tAPELLIDO MATERNO\tNOMBRES\tZONA\tESTADO"];
      let count = 0;

      for (let i = startRow; i < rows.length; i++) {
        const row = rows[i] || [];
        const rawDni = keyDni(row[colMap.dni]);
        if (!rawDni || rawDni.length < 6) continue;

        let pat = "", mat = "", nom = "";
        if (colMap.pat !== -1 || colMap.nom !== -1) {
          pat = colMap.pat !== -1 ? String(row[colMap.pat] || "").trim() : "";
          mat = colMap.mat !== -1 ? String(row[colMap.mat] || "").trim() : "";
          nom = colMap.nom !== -1 ? String(row[colMap.nom] || "").trim() : "";
        } else if (colMap.full !== -1) {
          nom = String(row[colMap.full] || "").trim();
        } else {
          pat = String(row[colMap.dni + 1] || "").trim();
          mat = String(row[colMap.dni + 2] || "").trim();
          nom = String(row[colMap.dni + 3] || "").trim();
        }

        const zona = String(row[colMap.zona] || "").trim();
        const est = String(row[colMap.est] || "ACTIVO").trim() || "ACTIVO";

        count++;
        tsvLines.push(`${count}\tDNI\t${padDni(rawDni)}\t${pat}\t${mat}\t${nom}\t${zona}\t${est}`);
      }

      return count > 0 ? tsvLines.join("\n") : "";
    }

    function matrizLaboresALista(rows) {
      if (!Array.isArray(rows) || !rows.length) return [];
      const out = [];
      let laborCol = 0;
      let codCol = 1;
      let startRow = 0;

      for (let r = 0; r < Math.min(rows.length, 10); r++) {
        const normRow = (rows[r] || []).map(normHeader);
        const lIdx = normRow.findIndex(c => c === "LABOR" || c === "DESCRIPCION" || c === "ACTIVIDAD");
        const cIdx = normRow.findIndex(c => c.includes("COD") || c === "C.LABOR");
        if (lIdx !== -1 && cIdx !== -1) {
          laborCol = lIdx;
          codCol = cIdx;
          startRow = r + 1;
          break;
        }
      }

      for (let i = startRow; i < rows.length; i++) {
        const row = rows[i] || [];
        const labor = String(row[laborCol] || "").trim().toUpperCase();
        const codRaw = String(row[codCol] || "").trim();
        if (!labor || !codRaw || normHeader(labor) === "LABOR") continue;
        out.push({ labor, codigo: Number(codRaw) || codRaw });
      }
      return out;
    }

    function parsePersonalTsv(txt) {
      const lines = String(txt || "").split(/\r?\n/).filter(l => l.trim());
      const out = [];
      lines.forEach((l, idx) => {
        const c = l.split("\t");
        if (c.length === 1 && l.includes("|")) {
          const p = l.split("|");
          if (keyDni(p[0])) {
            out.push(`${padDni(keyDni(p[0]))}|${(p[1] || "").trim()}|${(p[2] || "").trim()}|${(p[3] || "ACTIVO").trim()}`);
          }
          return;
        }
        if (idx === 0 && !keyDni(c[2])) return;
        const dni = keyDni(c[2]);
        if (!dni) return;
        const nombre = [c[3], c[4], c[5]].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
        const zona = String(c[6] || "").trim();
        const estado = String(c[7] || "ACTIVO").trim() || "ACTIVO";
        out.push(`${padDni(dni)}|${nombre}|${zona}|${estado}`);
      });
      return out;
    }

    function loadPersonalIntoMemory(txt) {
      S.P = new Map();
      const lines = (txt || "").split("\n");
      let dlCount = 0;
      let dlHtml = "";
      for (let i = 0; i < lines.length; i++) {
        const c = lines[i].split("|");
        if (!c[0]) continue;
        const k = keyDni(c[0]);
        if (!k) continue;
        const padded = padDni(k);
        S.P.set(k, { n: c[1] || "", z: c[2] || "", e: c[3] || "ACTIVO" });
        if (dlCount < 1500) {
          dlHtml += `<option value="${padded}">${esc(c[1] || "")}</option>`;
          dlCount++;
        }
      }
      const dl = $("dl-dni");
      if (dl) dl.innerHTML = dlHtml;
    }

    function hydrateFromCache() {
      store.purgeOlderThan30Days();
      const pTxt = store.getRaw(CACHE.PERSONAL, "");
      const lArr = store.get(CACHE.LABORES, null);
      const uArr = store.get(CACHE.USERS, []);
      if (pTxt) loadPersonalIntoMemory(pTxt);
      S.L = (Array.isArray(lArr) && lArr.length) ? lArr : DEFAULT_LABORES.slice();
      if (Array.isArray(uArr)) S.users = uArr;
    }

    // Sincronización en segundo plano protegida: nunca pisa la pestaña ni lo que el usuario esté editando
    function syncMaestrosBackground(forceToast = false) {
      if (S.demo) {
        setSyncText(`Modo Demo (${S.P.size} pers.)`, true);
        if (forceToast) toast("Modo Demo activo");
        return;
      }
      store.purgeOlderThan30Days();
      setSyncText("Sincronizando Drive...", false);
      const pinSnapshot = S.pin;

      Promise.all([
        api({ accion: "getPersonal" }),
        api({ accion: "getLabores" }),
        api({ accion: "getConfig" })
      ]).then(([pRes, lRes, cfgRes]) => {
        if (S.pin !== pinSnapshot) return;
        let updated = false;

        if (pRes && pRes.ok && typeof pRes.data === "string" && pRes.data.length > 0) {
          if (pRes.data !== store.getRaw(CACHE.PERSONAL, "")) {
            store.setRaw(CACHE.PERSONAL, pRes.data);
            loadPersonalIntoMemory(pRes.data);
            updated = true;
          }
        }

        if (lRes && lRes.ok && Array.isArray(lRes.data) && lRes.data.length > 0) {
          if (JSON.stringify(lRes.data) !== JSON.stringify(S.L)) {
            S.L = lRes.data;
            store.set(CACHE.LABORES, S.L);
            updated = true;
          }
        } else if (lRes && lRes.ok && Array.isArray(lRes.data) && lRes.data.length === 0 && S.rol === "admin") {
          api({ accion: "cargarLabores", labores: DEFAULT_LABORES });
          store.set(CACHE.LABORES, DEFAULT_LABORES);
        }

        if (cfgRes && cfgRes.ok && cfgRes.data && typeof cfgRes.data.bgImage === "string") {
          if (cfgRes.data.bgImage !== store.getRaw(CACHE.BG, "")) {
            store.setRaw(CACHE.BG, cfgRes.data.bgImage);
            applyBg(cfgRes.data.bgImage);
          }
        }

        if ((pRes && pRes.ok) || (lRes && lRes.ok)) {
          setSyncText(`Drive OK (${S.P.size} pers.)`, false);
          if (forceToast) toast("Sincronizado con Drive");
        } else {
          setSyncText("Caché Local (30d)", true);
        }

        if (updated && S.pin) {
          const sub = document.querySelector(".user-sub");
          if (sub) sub.textContent = `${S.P.size} pers. · ${S.L.length} labores · 30d`;
          if (S.activeTab === "tareo" && $("t-list") && !S.editandoEnviado) {
            pintarTarjetasTareo(S.estado === "ENVIADO");
          }
        }
      });
    }

    // =========================================================================
    // LOGIN PRIVADO EXCLUSIVAMENTE POR PIN
    // =========================================================================
    function renderLogin() {
      $("app").innerHTML = `
        <div class="login-wrap">
          <div class="card login-card">
            <div style="font-size:17px;font-weight:800;margin-bottom:4px;letter-spacing:-0.01em">Sistema de Tareos</div>
            <div class="m" style="margin-bottom:16px">Ingresa tu PIN</div>
            <div class="login-row">
              <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••" />
              <button id="go" type="button" class="btn">Entrar</button>
            </div>
          </div>
        </div>
      `;

      const abrirSesion = (rol, nombre, fundo) => {
        S.rol = rol;
        S.nombre = nombre || (rol === "admin" ? "Maestro" : "Responsable");
        S.fundo = rol === "admin" ? MASTER_FUNDO : (fundo || "");
        S.activeTab = S.rol === "admin" ? "resumen" : "tareo";
        if (S.activeTab === "tareo") cargarTareoDesdeCache();
        renderShell();
        syncMaestrosBackground(false);
      };

      const entrar = async () => {
        const pin = $("pin").value.trim();
        if (!pin) return toast("Ingresa tu PIN");
        S.pin = pin;

        if (S.demo) {
          const rDemo = demoApi({ accion: "login", pin });
          if (!rDemo.ok) {
            limpiarSesionMemoria();
            $("pin").value = "";
            $("pin").focus();
            return toast(rDemo.error || "PIN incorrecto");
          }
          abrirSesion(rDemo.rol, rDemo.nombre, rDemo.fundo);
          return;
        }

        hydrateFromCache();
        if (pin === MASTER_PIN) {
          abrirSesion("admin", "Maestro", MASTER_FUNDO);
          api({ accion: "login" });
          return;
        }

        const cachedUser = S.users.find(u => String(u.pin) === pin);
        if (cachedUser) {
          abrirSesion("user", cachedUser.nombre, cachedUser.fundo);
          api({ accion: "login" }).then(r => {
            if (r && r.ok) {
              S.nombre = r.nombre || S.nombre;
              S.fundo = r.fundo || S.fundo;
            }
          });
          return;
        }

        $("go").disabled = true;
        $("go").textContent = "...";
        const r = await api({ accion: "login" });
        $("go").disabled = false;
        $("go").textContent = "Entrar";

        if (!r.ok) {
          setSyncText(r.error || "Error Drive", true);
          limpiarSesionMemoria();
          $("pin").value = "";
          $("pin").focus();
          return toast(r.error || "PIN incorrecto");
        }

        if (r.rol === "user" && !S.users.some(u => String(u.pin) === pin)) {
          S.users.push({ nombre: r.nombre || "Responsable", fundo: r.fundo, pin });
          store.set(CACHE.USERS, S.users);
        }

        abrirSesion(r.rol, r.nombre, r.fundo);
      };

      $("go").onclick = entrar;
      $("pin").onkeydown = e => { if (e.key === "Enter") entrar(); };
      $("pin").focus();
    }

    // =========================================================================
    // AISLAMIENTO ESTRICTO POR PIN + FUNDO + FECHA (TAREO Y ASISTENCIA)
    // =========================================================================
    function tareoCacheKey(fecha = S.fecha, fundo = S.fundo, pin = S.pin) {
      return `${CACHE.TAREO_PREFIX}${S.demo ? "demo" : "live"}_${fecha}_${fundo}_${pin}`;
    }

    function asisCacheKey(fecha = S.fecha, fundo = S.fundo, pin = S.pin) {
      return `${CACHE.ASIS_PREFIX}${S.demo ? "demo" : "live"}_${fecha}_${fundo}_${pin}`;
    }

    function cargarTareoDesdeCache() {
      store.purgeOlderThan30Days();
      const c = store.get(tareoCacheKey(), null);
      if (c && Array.isArray(c.filas) && c.filas.length) {
        S.filas = c.filas.map(x => ({ ...x }));
        S.estado = c.estado || "NUEVO";
      } else {
        S.filas = [{ dni: "", labor: "", horas: 8 }];
        S.estado = "NUEVO";
      }
      S.editandoEnviado = false;
    }

    async function cargarTareo(token = S.renderToken) {
      const fechaSolicitada = S.fecha;
      const pinSolicitado = S.pin;
      const r = await api({ accion: "getTareo", fecha: fechaSolicitada });
      if (
        S.renderToken !== token ||
        S.activeTab !== "tareo" ||
        S.pin !== pinSolicitado ||
        S.fecha !== fechaSolicitada ||
        S.editandoEnviado
      ) {
        return false;
      }
      if (r && r.ok && r.data) {
        S.filas = (r.data.filas && r.data.filas.length) ? r.data.filas : [{ dni: "", labor: "", horas: 8 }];
        S.estado = r.data.estado || "NUEVO";
        S.editandoEnviado = false;
        store.set(tareoCacheKey(fechaSolicitada, S.fundo, pinSolicitado), {
          filas: S.filas,
          estado: S.estado,
          enviado: r.data.enviado || ""
        });
        return true;
      }
      return false;
    }

    function cargarAsisDesdeCache() {
      store.purgeOlderThan30Days();
      const c = store.get(asisCacheKey(), null);
      if (c && Array.isArray(c.filas) && c.filas.length) {
        S.asisFilas = c.filas.map(x => ({ ...x }));
        S.asisResponsable = c.responsable || S.nombre || S.fundo;
        S.asisEstado = c.estado || "NUEVO";
      } else {
        S.asisFilas = [crearFilaDistVacia(S.fundo)];
        S.asisResponsable = S.nombre || S.fundo;
        S.asisEstado = "NUEVO";
      }
      S.asisEditandoEnviado = false;
    }

    async function cargarAsistencia(token = S.renderToken) {
      const fechaSolicitada = S.fecha;
      const pinSolicitado = S.pin;
      const r = await api({ accion: "getAsistencia", fecha: fechaSolicitada });
      if (
        S.renderToken !== token ||
        S.activeTab !== "asistencia" ||
        S.pin !== pinSolicitado ||
        S.fecha !== fechaSolicitada ||
        S.asisEditandoEnviado
      ) {
        return false;
      }
      if (r && r.ok && r.data) {
        S.asisFilas = (r.data.filas && r.data.filas.length) ? r.data.filas : [crearFilaDistVacia(S.fundo)];
        S.asisResponsable = r.data.responsable || S.nombre || S.fundo;
        S.asisEstado = r.data.estado || "NUEVO";
        S.asisEditandoEnviado = false;
        store.set(asisCacheKey(fechaSolicitada, S.fundo, pinSolicitado), {
          responsable: S.asisResponsable,
          filas: S.asisFilas,
          estado: S.asisEstado
        });
        return true;
      }
      return false;
    }

    // =========================================================================
    // CONTENEDORES DOM AISLADOS POR PESTAÑA (CERO SUPERPOSICIONES)
    // =========================================================================
    function activatePane(tabName) {
      S.renderToken++;
      S.activeTab = tabName;

      document.querySelectorAll("[data-t]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.t === tabName);
      });

      document.querySelectorAll(".tab-pane").forEach(pane => {
        const isTarget = pane.id === `pane-${tabName}`;
        pane.classList.toggle("active-pane", isTarget);
        if (!isTarget) {
          pane.innerHTML = "";
        }
      });

      return S.renderToken;
    }

    function renderShell() {
      const adm = S.rol === "admin";
      const tituloPequeno = adm
        ? `Tareos · Maestro (${MASTER_FUNDO})`
        : `Tareos · ${esc(S.nombre)} (${esc(S.fundo)})`;

      const tabs = adm
        ? [
            ["resumen", "Resumen"],
            ["tareo", `Tareo (${MASTER_FUNDO})`],
            ["asistencia", "Asistencia"],
            ["historial", "Historial (30d)"],
            ["users", "Usuarios"],
            ["datos", "Datos"]
          ]
        : [
            ["tareo", "Tareo"],
            ["asistencia", "Asistencia"],
            ["historial", "Historial (30d)"]
          ];

      $("app").innerHTML = `
        <div class="wrap">
          <div class="card user-bar">
            <div class="user-info">
              <div class="user-title">${tituloPequeno}</div>
              <div class="user-sub">${S.P.size} pers. · ${S.L.length} labores · 30d</div>
            </div>
            <div class="row" style="flex-wrap:nowrap;flex-shrink:0">
              <button id="btn-sync" type="button" class="btn btn-s btn-xs">↻ Sync</button>
              <button id="out" type="button" class="btn btn-s btn-xs">Salir</button>
            </div>
          </div>

          <div class="tabs">
            ${tabs.map(t => `<button type="button" data-t="${t[0]}" class="${S.activeTab === t[0] ? "active" : ""}">${t[1]}</button>`).join("")}
          </div>

          ${tabs.map(t => `<div id="pane-${t[0]}" class="tab-pane ${S.activeTab === t[0] ? "active-pane" : ""}"></div>`).join("")}
        </div>
      `;

      $("btn-sync").onclick = () => syncMaestrosBackground(true);
      $("out").onclick = () => {
        limpiarSesionMemoria();
        renderLogin();
      };

      document.querySelectorAll("[data-t]").forEach(b => {
        b.onclick = () => switchToTab(b.dataset.t);
      });

      switchToTab(S.activeTab);
    }

    async function switchToTab(tabName) {
      const token = activatePane(tabName);

      if (tabName === "tareo") {
        cargarTareoDesdeCache();
        renderTareo();
        const ok = await cargarTareo(token);
        if (ok && S.renderToken === token && S.activeTab === "tareo" && !S.editandoEnviado) {
          renderTareo();
        }
        return;
      }

      if (tabName === "asistencia") {
        cargarAsisDesdeCache();
        renderAsistencia();
        const ok = await cargarAsistencia(token);
        if (ok && S.renderToken === token && S.activeTab === "asistencia" && !S.asisEditandoEnviado) {
          renderAsistencia();
        }
        return;
      }

      if (tabName === "historial") {
        renderHistorial(token);
        return;
      }

      if (tabName === "resumen") {
        renderResumen(token);
        return;
      }

      if (tabName === "users") {
        renderUsers(token);
        return;
      }

      if (tabName === "datos") {
        renderDatos();
        return;
      }
    }

    // =========================================================================
    // BORRAR TAREO / ASISTENCIA ENVIADOS PARA VOLVER A SUBIR INMEDIATAMENTE
    // =========================================================================
    async function borrarTareoEnviadoAccion(fecha, fundo, targetPin = "") {
      const ok = await confirmar(
        "¿Borrar tareo enviado?",
        `Se eliminará el tareo enviado de ${fundo} (${fecha}) para que puedan volver a enviarlo.`,
        "Borrar enviado",
        true
      );
      if (!ok) return false;

      const pinEfectivo = targetPin || S.pin;
      store.remove(tareoCacheKey(fecha, fundo, pinEfectivo));
      const rKey = `${CACHE.RESUMEN_PREFIX}${S.demo ? "demo" : "live"}_${fecha}`;
      const cur = store.get(rKey, null);
      if (cur && Array.isArray(cur.data)) {
        cur.data = cur.data.filter(x => !(x.fundo === fundo && (!targetPin || String(x.pin || targetPin) === String(targetPin))));
        store.set(rKey, cur);
      }

      if (fecha === S.fecha && fundo === S.fundo && (!targetPin || String(targetPin) === String(S.pin))) {
        S.filas = [{ dni: "", labor: "", horas: 8 }];
        S.estado = "NUEVO";
        S.editandoEnviado = false;
      }

      const r = await api({ accion: "borrarTareo", fecha, fundo, targetPin: pinEfectivo });
      if (r && !r.ok && r.error && !r.error.includes("Maestro")) {
        toast(r.error);
      } else {
        toast("Tareo borrado. Ya puedes volver a subir tu Excel.");
      }
      return true;
    }

    async function borrarAsisEnviadoAccion(fecha, fundo, targetPin = "") {
      const ok = await confirmar(
        "¿Borrar asistencia enviada?",
        `Se eliminará la distribución enviada de ${fundo} (${fecha}) para volver a enviarla.`,
        "Borrar enviado",
        true
      );
      if (!ok) return false;

      const pinEfectivo = targetPin || S.pin;
      store.remove(asisCacheKey(fecha, fundo, pinEfectivo));
      const rKey = `${CACHE.RESUMEN_PREFIX}${S.demo ? "demo" : "live"}_${fecha}`;
      const cur = store.get(rKey, null);
      if (cur && Array.isArray(cur.asistencia)) {
        cur.asistencia = cur.asistencia.filter(x => !(x.fundo === fundo && (!targetPin || String(x.pin || targetPin) === String(targetPin))));
        store.set(rKey, cur);
      }

      if (fecha === S.fecha && fundo === S.fundo && (!targetPin || String(targetPin) === String(S.pin))) {
        S.asisFilas = [crearFilaDistVacia(S.fundo)];
        S.asisEstado = "NUEVO";
        S.asisEditandoEnviado = false;
      }

      const r = await api({ accion: "borrarAsistencia", fecha, fundo, targetPin: pinEfectivo });
      if (r && !r.ok && r.error && !r.error.includes("Maestro")) {
        toast(r.error);
      } else {
        toast("Asistencia borrada. Ya puedes volver a subirla.");
      }
      return true;
    }

    // =========================================================================
    // VISTA TAREO (MASIVO DIRECTO AL SELECTOR + BORRADOR + ENVÍO + EDITAR + BORRAR)
    // =========================================================================
    function renderTareo() {
      const pane = $("pane-tareo");
      if (!pane || S.activeTab !== "tareo") return;

      const esEnviado = S.estado === "ENVIADO";
      const soloLectura = esEnviado && !S.editandoEnviado;

      let badge = `<span class="badge b-new">NUEVO</span>`;
      if (S.estado === "BORRADOR") badge = `<span class="badge b-bor">BORRADOR</span>`;
      else if (esEnviado && !S.editandoEnviado) badge = `<span class="badge b-env">ENVIADO</span>`;
      else if (esEnviado && S.editandoEnviado) badge = `<span class="badge b-bor">EDITANDO</span>`;

      pane.innerHTML = `
        <div class="card">
          <div class="row sp">
            <div class="row">
              <input type="date" id="f-tareo" value="${S.fecha}" />
              ${badge}
            </div>
            <span id="tot-tareo" class="m" style="font-weight:700;color:var(--text)"></span>
          </div>
        </div>

        ${soloLectura ? "" : `
          <div class="masivo-banner">
            <div class="row sp" style="flex-wrap:nowrap">
              <div style="min-width:0;flex:1">
                <div style="font-weight:800;font-size:12px;color:#6ee7b7">Carga masiva de Excel</div>
                <div class="m" style="font-size:10.5px">Plantilla con C.LABOR, DNI, NOMBRES y HORAS</div>
              </div>
              <label for="masivo-file-direct" class="btn" style="flex-shrink:0">📥 Masivo</label>
              <input type="file" id="masivo-file-direct" accept=".xlsx,.xls,.csv" style="display:none" />
            </div>
            <details style="margin-top:6px">
              <summary class="m" style="cursor:pointer;font-size:10.5px;font-weight:700">Pegado rápido desde Excel / vaciar lista</summary>
              <textarea id="masivo-paste-box" rows="3" placeholder="Pega aquí: C.LABOR [Tab] DNI [Tab] NOMBRES [Tab] HORAS" style="font-family:monospace;font-size:11px;margin-top:5px"></textarea>
              <div class="row" style="margin-top:5px">
                <button id="masivo-paste-btn" type="button" class="btn btn-s btn-xs" style="flex:1">Importar pegado</button>
                <button id="masivo-clear-btn" type="button" class="btn btn-d btn-xs">Vaciar lista</button>
              </div>
            </details>
          </div>
        `}

        <div id="t-list"></div>

        <div class="card">
          ${soloLectura ? `
            <div class="row sp" style="gap:6px">
              <span class="m">Tareo enviado al Maestro.</span>
              <div class="row">
                <button id="btn-edit-sent" type="button" class="btn btn-w btn-xs">Editar tareo</button>
                <button id="btn-del-sent" type="button" class="btn btn-d btn-xs">Borrar enviado</button>
              </div>
            </div>
          ` : `
            <div class="row sp" style="gap:6px">
              <button id="btn-add" type="button" class="btn btn-s" style="flex:1">+ Agregar fila</button>
              ${esEnviado && S.editandoEnviado ? `<button id="btn-cancel-edit" type="button" class="btn btn-s">Cancelar</button>` : ""}
            </div>
            <div class="row" style="margin-top:6px;gap:6px">
              ${!esEnviado ? `<button id="btn-bor" type="button" class="btn btn-w" style="flex:1">Guardar borrador</button>` : ""}
              <button id="btn-env" type="button" class="btn" style="flex:1">${esEnviado ? "Actualizar envío" : "Enviar al Maestro"}</button>
              ${esEnviado ? `<button id="btn-del-sent-edit" type="button" class="btn btn-d">Borrar enviado</button>` : ""}
            </div>
          `}
        </div>
      `;

      $("f-tareo").onchange = async e => {
        const token = ++S.renderToken;
        S.fecha = e.target.value;
        cargarTareoDesdeCache();
        renderTareo();
        const ok = await cargarTareo(token);
        if (ok && S.renderToken === token && S.activeTab === "tareo" && !S.editandoEnviado) {
          renderTareo();
        }
      };

      if (soloLectura) {
        $("btn-edit-sent").onclick = () => {
          S.renderToken++;
          S.editandoEnviado = true;
          renderTareo();
        };
        $("btn-del-sent").onclick = async () => {
          const borrado = await borrarTareoEnviadoAccion(S.fecha, S.fundo, S.pin);
          if (borrado && S.activeTab === "tareo") renderTareo();
        };
      } else {
        const incorporarFilasMasivas = nuevas => {
          if (!nuevas.length) return toast("No se detectaron filas con DNI válido");
          const actualesValidas = S.filas.filter(x => keyDni(x.dni));
          S.filas = actualesValidas.concat(nuevas);
          pintarTarjetasTareo(false);
          toast(`✓ ${nuevas.length} filas cargadas desde masivo`);
        };

        if ($("masivo-file-direct")) {
          $("masivo-file-direct").onchange = async e => {
            const f = e.target.files[0];
            if (!f) return;
            try {
              toast(`Leyendo ${f.name}...`, 1500);
              const matriz = await leerArchivoComoMatriz(f);
              incorporarFilasMasivas(matrizTareoMasivoAFilas(matriz));
            } catch (err) {
              toast(err.message || "Error al leer el Excel");
            }
            e.target.value = "";
          };
        }

        if ($("masivo-paste-btn")) {
          $("masivo-paste-btn").onclick = () => {
            const raw = $("masivo-paste-box").value.trim();
            if (!raw) return toast("Pega las filas desde Excel primero");
            const sep = raw.includes("\t") ? "\t" : (raw.includes(";") ? ";" : ",");
            const matriz = raw.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep));
            $("masivo-paste-box").value = "";
            incorporarFilasMasivas(matrizTareoMasivoAFilas(matriz));
          };
        }

        if ($("masivo-clear-btn")) {
          $("masivo-clear-btn").onclick = async () => {
            const ok = await confirmar("¿Vaciar lista actual?", "Se limpiarán las filas en pantalla.", "Sí, vaciar", true);
            if (!ok) return;
            S.filas = [{ dni: "", labor: "", horas: 8 }];
            pintarTarjetasTareo(false);
            toast("Lista vaciada");
          };
        }

        if ($("btn-del-sent-edit")) {
          $("btn-del-sent-edit").onclick = async () => {
            const borrado = await borrarTareoEnviadoAccion(S.fecha, S.fundo, S.pin);
            if (borrado && S.activeTab === "tareo") renderTareo();
          };
        }

        $("btn-add").onclick = () => {
          const lastLabor = S.filas.length ? S.filas[S.filas.length - 1].labor : "";
          S.filas.push({ dni: "", labor: lastLabor, horas: 8 });
          pintarTarjetasTareo(false);
          focoUltimoDni();
        };

        if ($("btn-cancel-edit")) {
          $("btn-cancel-edit").onclick = () => {
            S.renderToken++;
            S.editandoEnviado = false;
            cargarTareoDesdeCache();
            renderTareo();
          };
        }

        const armarFilas = () => S.filas
          .filter(x => keyDni(x.dni))
          .map(x => {
            const k = keyDni(x.dni);
            const p = S.P.get(k);
            const l = S.L.find(y => y.labor === x.labor);
            const codFinal = l ? l.codigo : (x.codigoManual || "");
            const laborFinal = l ? l.labor : (x.codigoManual ? `LABOR ${x.codigoManual}` : "");
            return {
              dni: padDni(k),
              nombres: p ? p.n : "NO TIENE CONTRATO",
              labor: laborFinal,
              codigo: codFinal,
              horas: Number(x.horas) || 0
            };
          });

        if ($("btn-bor")) {
          $("btn-bor").onclick = async () => {
            const filas = armarFilas();
            store.set(tareoCacheKey(), { filas: S.filas, estado: "BORRADOR" });
            S.estado = "BORRADOR";
            renderTareo();
            const r = await api({ accion: "guardarBorrador", fecha: S.fecha, filas });
            if (!r.ok) return toast(r.error);
            toast(`Borrador guardado (${filas.length} pers.)`);
          };
        }

        $("btn-env").onclick = async () => {
          const filas = armarFilas();
          if (!filas.length) return toast("Ingresa al menos un DNI antes de enviar");
          if (filas.some(f => !f.codigo)) return toast("Asigna una labor o código en todas las filas");

          const sinContrato = filas.filter(f => f.nombres === "NO TIENE CONTRATO").length;
          const avisoExtra = sinContrato > 0 ? ` (Incluye ${sinContrato} sin contrato).` : ".";

          const ok = await confirmar(
            esEnviado ? "¿Actualizar tareo enviado?" : "¿Enviar tareo al Maestro?",
            `Se enviarán ${filas.length} personas (${filas.reduce((a, b) => a + b.horas, 0)} h) del ${S.fecha}${avisoExtra}`,
            esEnviado ? "Sí, actualizar" : "Sí, enviar"
          );
          if (!ok) return;

          $("btn-env").disabled = true;
          const r = await api({ accion: "enviarTareo", fecha: S.fecha, filas });
          if ($("btn-env")) $("btn-env").disabled = false;
          if (!r.ok) return toast(r.error);

          S.estado = "ENVIADO";
          S.editandoEnviado = false;
          store.set(tareoCacheKey(), {
            filas,
            estado: "ENVIADO",
            enviado: new Date().toISOString()
          });
          toast(esEnviado ? "Tareo actualizado" : "¡Tareo enviado al Maestro!");
          if (S.activeTab === "tareo") renderTareo();
        };
      }

      pintarTarjetasTareo(soloLectura);
    }

    function focoUltimoDni() {
      const inputs = document.querySelectorAll(".dni-in");
      if (inputs.length) inputs[inputs.length - 1].focus();
    }

    function pintarTarjetasTareo(soloLectura = false) {
      if (!$("t-list") || S.activeTab !== "tareo") return;

      const seen = {};
      S.filas.forEach(x => {
        const k = keyDni(x.dni);
        if (k) seen[k] = (seen[k] || 0) + 1;
      });

      const dis = soloLectura ? "disabled" : "";
      $("t-list").innerHTML = S.filas.map((x, i) => {
        const k = keyDni(x.dni);
        const p = k ? S.P.get(k) : null;
        const l = S.L.find(y => y.labor === x.labor);
        const codMostrar = l ? l.codigo : (x.codigoManual || "C.LAB");

        let nomHtml = `<span class="m" style="font-size:10px">Escribe el DNI para autocompletar</span>`;
        if (k) {
          if (p) {
            nomHtml = `<span>${esc(p.n)}</span>`
              + (p.e && p.e !== "ACTIVO" ? `<span class="bad">${esc(p.e)}</span>` : "")
              + (seen[k] > 1 ? `<span class="warn-txt">REPETIDO</span>` : "");
          } else {
            nomHtml = `<span class="bad">NO TIENE CONTRATO</span>`
              + (seen[k] > 1 ? `<span class="warn-txt">REPETIDO</span>` : "");
          }
        }

        return `
          <div class="t-item">
            <div class="t-top">
              <span class="t-num">${i + 1}</span>
              <input ${dis} list="dl-dni" class="dni-in" data-i="${i}" inputmode="numeric" maxlength="8" placeholder="DNI (8 dígitos)" value="${esc(x.dni)}" />
              ${soloLectura ? "" : `<button type="button" class="btn btn-d btn-xs" data-x="${i}" title="Eliminar">✕</button>`}
            </div>

            <div class="t-name">${nomHtml}</div>

            <div class="t-bot">
              <div class="code-pill" title="C.LABOR">${esc(codMostrar)}</div>
              <select ${dis} data-l="${i}" style="flex:1">
                <option value="">${x.codigoManual ? `— Código ${esc(x.codigoManual)} —` : "— Elegir Labor —"}</option>
                ${S.L.map(y => `<option value="${esc(y.labor)}" ${y.labor === x.labor ? "selected" : ""}>${esc(y.labor)}</option>`).join("")}
              </select>
              <div class="hrs-box">
                ${soloLectura ? "" : `<button type="button" data-hm="${i}">−</button>`}
                <input ${dis} type="number" step="0.5" min="0" max="24" data-h="${i}" value="${x.horas}" />
                ${soloLectura ? "" : `<button type="button" data-hp="${i}">+</button>`}
              </div>
            </div>
          </div>
        `;
      }).join("");

      const totPers = S.filas.filter(x => keyDni(x.dni)).length;
      const totHrs = S.filas.reduce((a, x) => a + (keyDni(x.dni) ? Number(x.horas) || 0 : 0), 0);
      if ($("tot-tareo")) $("tot-tareo").textContent = `${totPers} pers. · ${totHrs} h`;

      if (soloLectura) return;

      document.querySelectorAll(".dni-in").forEach(inp => {
        inp.oninput = () => {
          const i = Number(inp.dataset.i);
          S.filas[i].dni = inp.value;
          const k = keyDni(inp.value);
          if (k && inp.value.replace(/\D/g, "").length === 8) {
            S.filas[i].dni = padDni(k);
            pintarTarjetasTareo(false);
          }
        };
        inp.onchange = () => {
          const i = Number(inp.dataset.i);
          const k = keyDni(inp.value);
          if (k) S.filas[i].dni = padDni(k);
          pintarTarjetasTareo(false);
        };
      });

      document.querySelectorAll("[data-l]").forEach(sel => {
        sel.onchange = () => {
          S.filas[sel.dataset.l].labor = sel.value;
          if (sel.value) S.filas[sel.dataset.l].codigoManual = "";
          pintarTarjetasTareo(false);
        };
      });

      document.querySelectorAll("[data-h]").forEach(inp => {
        inp.onchange = () => {
          S.filas[inp.dataset.h].horas = Number(inp.value) || 0;
          pintarTarjetasTareo(false);
        };
      });

      document.querySelectorAll("[data-hm]").forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.dataset.hm);
          S.filas[i].horas = Math.max(0, (Number(S.filas[i].horas) || 0) - 1);
          pintarTarjetasTareo(false);
        };
      });

      document.querySelectorAll("[data-hp]").forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.dataset.hp);
          S.filas[i].horas = Math.min(24, (Number(S.filas[i].horas) || 0) + 1);
          pintarTarjetasTareo(false);
        };
      });

      document.querySelectorAll("[data-x]").forEach(btn => {
        btn.onclick = () => {
          S.filas.splice(btn.dataset.x, 1);
          if (!S.filas.length) S.filas = [{ dni: "", labor: "", horas: 8 }];
          pintarTarjetasTareo(false);
        };
      });
    }

    // =========================================================================
    // HISTORIAL DE TAREOS DE LOS ÚLTIMOS 30 DÍAS
    // =========================================================================
    function obtenerHistorialLocal30Dias() {
      store.purgeOlderThan30Days();
      const cutoff = getCutoffIso(RETENTION_DAYS);
      const modePrefix = `${CACHE.TAREO_PREFIX}${S.demo ? "demo" : "live"}_`;
      const suffix = `_${S.fundo}_${S.pin}`;
      const items = [];

      if (S.demo) {
        Object.keys(DEMO.enviados).forEach(k => {
          if (k.endsWith(suffix)) {
            const d = DEMO.enviados[k];
            if (d && d.fecha >= cutoff && Array.isArray(d.filas) && d.filas.length) {
              items.push({
                fecha: d.fecha,
                fundo: d.fundo,
                filas: d.filas,
                enviado: d.enviado || ""
              });
            }
          }
        });
      } else {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith(modePrefix) || !k.endsWith(suffix)) continue;
          const m = k.match(/(\d{4}-\d{2}-\d{2})/);
          if (!m || m[1] < cutoff) continue;
          const data = store.get(k, null);
          if (data && data.estado === "ENVIADO" && Array.isArray(data.filas) && data.filas.length) {
            items.push({
              fecha: m[1],
              fundo: S.fundo,
              filas: data.filas,
              enviado: data.enviado || ""
            });
          }
        }
      }

      return items.sort((a, b) => b.fecha.localeCompare(a.fecha));
    }

    function renderHistorial(token = S.renderToken) {
      const pane = $("pane-historial");
      if (!pane || S.activeTab !== "historial" || S.renderToken !== token) return;

      const pintarListaHistorial = items => {
        if (S.activeTab !== "historial" || S.renderToken !== token) return;
        const totDias = items.length;
        const totPersAcum = items.reduce((a, d) => a + d.filas.length, 0);

        pane.innerHTML = `
          <div class="card">
            <div class="row sp">
              <div>
                <div style="font-weight:800;font-size:12.5px">Historial de Tareos (Últimos 30 días)</div>
                <div class="m" style="font-size:10.5px">${totDias} días enviados · ${totPersAcum} registros · Auto-limpieza 30d</div>
              </div>
              <button id="hist-rf" type="button" class="btn btn-s btn-xs">Actualizar</button>
            </div>
          </div>
          <div id="hist-list">
            ${items.length
              ? items.map((day, idx) => {
                  const totHrs = day.filas.reduce((s, x) => s + (Number(x.horas) || 0), 0);
                  return `
                    <div class="card">
                      <details ${idx === 0 ? "open" : ""}>
                        <summary style="cursor:pointer;list-style:none">
                          <div class="row sp" style="flex-wrap:nowrap">
                            <div>
                              <b style="font-size:12.5px;color:#6ee7b7">📅 ${esc(day.fecha)}</b>
                              <span class="badge b-env" style="margin-left:4px">${esc(day.fundo)}</span>
                            </div>
                            <span class="m" style="font-weight:700;color:var(--text)">${day.filas.length} pers. · ${totHrs} h ▾</span>
                          </div>
                        </summary>
                        <div class="table-wrap" style="margin-top:8px">
                          <table class="res-tbl" style="min-width:420px">
                            <thead>
                              <tr>
                                <th>#</th>
                                <th>DNI</th>
                                <th>NOMBRES</th>
                                <th>LABOR</th>
                                <th style="text-align:right">HRS</th>
                              </tr>
                            </thead>
                            <tbody>
                              ${day.filas.map((x, rIdx) => {
                                const k = keyDni(x.dni);
                                const p = k ? S.P.get(k) : null;
                                const nombreMostrar = x.nombres || (p ? p.n : "NO TIENE CONTRATO");
                                const sinC = String(nombreMostrar).toUpperCase().includes("NO TIENE CONTRATO");
                                const lObj = S.L.find(y => y.labor === x.labor);
                                const cod = x.codigo || (lObj ? lObj.codigo : (x.codigoManual || ""));
                                const lab = x.labor || (cod ? `C.LAB ${cod}` : "—");
                                return `
                                  <tr>
                                    <td class="m">${rIdx + 1}</td>
                                    <td style="font-family:monospace;font-weight:700">${esc(padDni(k || x.dni))}</td>
                                    <td style="font-weight:600;${sinC ? "color:#f87171" : ""}">${esc(nombreMostrar)}</td>
                                    <td><span style="font-family:monospace;color:#6ee7b7;font-weight:700">${esc(cod)}</span> ${esc(lab)}</td>
                                    <td style="text-align:right;font-weight:700">${Number(x.horas) || 0}</td>
                                  </tr>
                                `;
                              }).join("")}
                            </tbody>
                          </table>
                        </div>
                      </details>
                    </div>
                  `;
                }).join("")
              : `<div class="card m">Aún no tienes tareos enviados en los últimos 30 días. Apenas envíes un tareo aparecerá aquí automáticamente.</div>`
            }
          </div>
        `;

        if ($("hist-rf")) {
          $("hist-rf").onclick = async () => {
            toast("Sincronizando historial...");
            await sincronizarHistorialDesdeDrive();
          };
        }
      };

      const sincronizarHistorialDesdeDrive = async () => {
        const iniciales = obtenerHistorialLocal30Dias();
        pintarListaHistorial(iniciales);

        if (S.demo) return;
        const pinSnap = S.pin;
        const rHist = await api({ accion: "historialUsuario" });
        if (S.pin !== pinSnap || S.activeTab !== "historial" || S.renderToken !== token) return;

        if (rHist && rHist.ok && Array.isArray(rHist.data)) {
          const cutoff = getCutoffIso(RETENTION_DAYS);
          rHist.data.forEach(item => {
            if (item && item.fecha && item.fecha >= cutoff && Array.isArray(item.filas) && item.filas.length) {
              store.set(tareoCacheKey(item.fecha, item.fundo || S.fundo, S.pin), {
                filas: item.filas,
                estado: "ENVIADO",
                enviado: item.enviado || ""
              });
            }
          });
          pintarListaHistorial(obtenerHistorialLocal30Dias());
        } else {
          const fechaSnap = S.fecha;
          const rToday = await api({ accion: "getTareo", fecha: fechaSnap });
          if (S.pin !== pinSnap || S.activeTab !== "historial" || S.renderToken !== token) return;
          if (rToday && rToday.ok && rToday.data && rToday.data.estado === "ENVIADO" && Array.isArray(rToday.data.filas) && rToday.data.filas.length) {
            store.set(tareoCacheKey(fechaSnap, S.fundo, pinSnap), {
              filas: rToday.data.filas,
              estado: "ENVIADO",
              enviado: rToday.data.enviado || ""
            });
            pintarListaHistorial(obtenerHistorialLocal30Dias());
          }
        }
      };

      sincronizarHistorialDesdeDrive();
    }

    // =========================================================================
    // EXPORTAR DISTRIBUCIÓN COSECHA A IMAGEN PNG EN ALTA RESOLUCIÓN (2X)
    // =========================================================================
    function exportarDistribucionImagen(fecha, responsable, fundoDefault, filas) {
      const headers = [
        "Fundo", "N° Grupo", "Supervisor", "Cosecha",
        "Sup. Ciclo", "Sup. Cuadrilla", "Jabero", "Limpieza",
        "Riego", "Otros", "Total"
      ];

      const colTotals = {};
      DIST_FIELDS.forEach(df => { colTotals[df.key] = 0; });
      let grandTotal = 0;

      const bodyRows = filas.map(f => {
        const fnd = f.fundo || fundoDefault || "";
        const grp = f.grupo || "";
        const sup = f.supervisor || "";
        const vals = DIST_FIELDS.map(df => {
          const v = Number(f[df.key]) || 0;
          colTotals[df.key] += v;
          return v || "";
        });
        const rowSum = totalFilaDist(f);
        grandTotal += rowSum;
        return [fnd, grp, sup, ...vals, rowSum];
      });

      const totalRow = [
        "TOTAL", "", "",
        ...DIST_FIELDS.map(df => colTotals[df.key]),
        grandTotal
      ];

      const allRows = [...bodyRows, totalRow];
      const colWidths = [110, 74, 132, 76, 76, 92, 68, 76, 68, 68, 78];
      const padX = 20;
      const padY = 18;
      const titleH = 60;
      const headH = 34;
      const rowH = 30;
      const width = padX * 2 + colWidths.reduce((a, b) => a + b, 0);
      const height = titleH + headH + allRows.length * rowH + padY * 2;

      const canvas = document.createElement("canvas");
      canvas.width = width * 2;
      canvas.height = height * 2;
      const ctx = canvas.getContext("2d");
      ctx.scale(2, 2);

      ctx.fillStyle = "#0a110d";
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "#10b981";
      ctx.fillRect(padX, padY, width - padX * 2, 34);

      ctx.fillStyle = "#031a0f";
      ctx.font = "800 14px Inter, -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(`AgroBerries  ·  Distribución Cosecha  ·  ${fecha}`, padX + 12, padY + 22);

      ctx.fillStyle = "#a7f3d0";
      ctx.font = "700 11.5px Inter, -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(
        `Responsable: ${responsable || fundoDefault}    |    Fundo: ${fundoDefault || "—"}    |    Total General: ${grandTotal}`,
        padX,
        padY + 52
      );

      const yHead = padY + titleH;
      ctx.fillStyle = "#15231b";
      ctx.fillRect(padX, yHead, width - padX * 2, headH);

      let xCursor = padX;
      ctx.fillStyle = "#6ee7b7";
      ctx.font = "700 10.5px Inter, -apple-system, BlinkMacSystemFont, sans-serif";
      headers.forEach((h, idx) => {
        ctx.fillText(h, xCursor + 6, yHead + 21);
        xCursor += colWidths[idx];
      });

      allRows.forEach((r, rIdx) => {
        const yRow = yHead + headH + rIdx * rowH;
        const isTot = rIdx === allRows.length - 1;
        ctx.fillStyle = isTot ? "#064e3b" : (rIdx % 2 === 0 ? "#101914" : "#142019");
        ctx.fillRect(padX, yRow, width - padX * 2, rowH);

        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.moveTo(padX, yRow + rowH);
        ctx.lineTo(width - padX, yRow + rowH);
        ctx.stroke();

        let cx = padX;
        r.forEach((val, cIdx) => {
          const isLastCol = cIdx === r.length - 1;
          ctx.fillStyle = isTot ? "#a7f3d0" : (isLastCol ? "#34d399" : "#ecf5ef");
          ctx.font = (isTot || isLastCol || cIdx === 2)
            ? "700 11px Inter, -apple-system, BlinkMacSystemFont, sans-serif"
            : "500 11px Inter, -apple-system, BlinkMacSystemFont, sans-serif";
          const txt = String(val ?? "");
          ctx.fillText(txt.slice(0, 18), cx + 6, yRow + 19);
          cx += colWidths[cIdx];
        });
      });

      const link = document.createElement("a");
      link.download = `Distribucion_Cosecha_${fundoDefault || "FUNDO"}_${fecha}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
      toast("Imagen PNG descargada");
    }

    // =========================================================================
    // VISTA ASISTENCIA / DISTRIBUCIÓN COSECHA
    // =========================================================================
    function renderAsistencia() {
      const pane = $("pane-asistencia");
      if (!pane || S.activeTab !== "asistencia") return;

      const esEnviado = S.asisEstado === "ENVIADO";
      const soloLectura = esEnviado && !S.asisEditandoEnviado;

      let badge = `<span class="badge b-new">NUEVO</span>`;
      if (S.asisEstado === "BORRADOR") badge = `<span class="badge b-bor">BORRADOR</span>`;
      else if (esEnviado && !S.asisEditandoEnviado) badge = `<span class="badge b-env">ENVIADO</span>`;
      else if (esEnviado && S.asisEditandoEnviado) badge = `<span class="badge b-bor">EDITANDO</span>`;

      pane.innerHTML = `
        <div class="card">
          <div class="row sp" style="margin-bottom:6px">
            <div class="row">
              <input type="date" id="f-asis" value="${S.fecha}" />
              ${badge}
            </div>
            <button id="btn-img-asis" type="button" class="btn btn-info btn-xs">🖼 Exportar imagen</button>
          </div>
          <div class="row" style="flex-wrap:nowrap">
            <input id="asis-resp" ${soloLectura ? "disabled" : ""} placeholder="Responsable" value="${esc(S.asisResponsable || S.nombre)}" style="flex:1" />
            <span class="badge b-env" style="flex-shrink:0">${esc(S.fundo)}</span>
          </div>
        </div>

        ${soloLectura ? "" : `
          <div class="masivo-banner">
            <div class="row sp" style="flex-wrap:nowrap">
              <div style="min-width:0;flex:1">
                <div style="font-weight:800;font-size:12px;color:#6ee7b7">Carga masiva de Distribución</div>
                <div class="m" style="font-size:10.5px">Sube Excel/CSV con Fundo, Grupo, Supervisor y rubros</div>
              </div>
              <label for="asis-masivo-file" class="btn" style="flex-shrink:0">📥 Masivo</label>
              <input type="file" id="asis-masivo-file" accept=".xlsx,.xls,.csv,.tsv" style="display:none" />
            </div>
          </div>
        `}

        <div id="asis-list"></div>
        <div class="card" id="asis-totales-card"></div>

        <div class="card">
          ${soloLectura ? `
            <div class="row sp" style="gap:6px">
              <span class="m">Distribución enviada al Maestro.</span>
              <div class="row">
                <button id="btn-asis-edit" type="button" class="btn btn-w btn-xs">Editar</button>
                <button id="btn-asis-del" type="button" class="btn btn-d btn-xs">Borrar enviado</button>
              </div>
            </div>
          ` : `
            <div class="row sp" style="gap:6px">
              <button id="btn-asis-add" type="button" class="btn btn-s" style="flex:1">+ Agregar supervisor</button>
              ${esEnviado && S.asisEditandoEnviado ? `<button id="btn-asis-cancel" type="button" class="btn btn-s">Cancelar</button>` : ""}
            </div>
            <div class="row" style="margin-top:6px;gap:6px">
              ${!esEnviado ? `<button id="btn-asis-bor" type="button" class="btn btn-w" style="flex:1">Guardar borrador</button>` : ""}
              <button id="btn-asis-env" type="button" class="btn" style="flex:1">${esEnviado ? "Actualizar envío" : "Enviar al Maestro"}</button>
              ${esEnviado ? `<button id="btn-asis-del-edit" type="button" class="btn btn-d">Borrar enviado</button>` : ""}
            </div>
          `}
        </div>
      `;

      $("f-asis").onchange = async e => {
        const token = ++S.renderToken;
        S.fecha = e.target.value;
        cargarAsisDesdeCache();
        renderAsistencia();
        const ok = await cargarAsistencia(token);
        if (ok && S.renderToken === token && S.activeTab === "asistencia" && !S.asisEditandoEnviado) {
          renderAsistencia();
        }
      };

      if ($("asis-resp")) {
        $("asis-resp").oninput = e => { S.asisResponsable = e.target.value; };
      }

      $("btn-img-asis").onclick = () => {
        const resp = ($("asis-resp") ? $("asis-resp").value.trim() : "") || S.asisResponsable || S.nombre;
        exportarDistribucionImagen(S.fecha, resp, S.fundo, S.asisFilas);
      };

      if (soloLectura) {
        $("btn-asis-edit").onclick = () => {
          S.renderToken++;
          S.asisEditandoEnviado = true;
          renderAsistencia();
        };
        $("btn-asis-del").onclick = async () => {
          if (await borrarAsisEnviadoAccion(S.fecha, S.fundo, S.pin) && S.activeTab === "asistencia") renderAsistencia();
        };
      } else {
        if ($("asis-masivo-file")) {
          $("asis-masivo-file").onchange = async e => {
            const f = e.target.files[0];
            if (!f) return;
            try {
              const matriz = await leerArchivoComoMatriz(f);
              const nuevas = matrizDistAFilas(matriz);
              if (!nuevas.length) return toast("No se detectaron filas de distribución");
              const actuales = S.asisFilas.filter(x => String(x.supervisor || "").trim() || totalFilaDist(x) > 0);
              S.asisFilas = actuales.concat(nuevas);
              pintarFilasAsistencia(false);
              toast(`✓ ${nuevas.length} filas de distribución cargadas`);
            } catch (err) {
              toast(err.message || "Error al leer el archivo");
            }
            e.target.value = "";
          };
        }

        if ($("btn-asis-del-edit")) {
          $("btn-asis-del-edit").onclick = async () => {
            if (await borrarAsisEnviadoAccion(S.fecha, S.fundo, S.pin) && S.activeTab === "asistencia") renderAsistencia();
          };
        }

        $("btn-asis-add").onclick = () => {
          S.asisFilas.push(crearFilaDistVacia(S.fundo));
          pintarFilasAsistencia(false);
        };

        if ($("btn-asis-cancel")) {
          $("btn-asis-cancel").onclick = () => {
            S.renderToken++;
            S.asisEditandoEnviado = false;
            cargarAsisDesdeCache();
            renderAsistencia();
          };
        }

        const armarAsis = () => {
          const resp = ($("asis-resp") ? $("asis-resp").value.trim() : "") || S.asisResponsable || S.nombre;
          S.asisResponsable = resp;
          const filasLimpias = S.asisFilas
            .filter(x => String(x.supervisor || "").trim() || totalFilaDist(x) > 0)
            .map(x => ({
              fundo: String(x.fundo || S.fundo || "").trim(),
              grupo: String(x.grupo || "").trim(),
              supervisor: String(x.supervisor || "").trim(),
              cosecha: Number(x.cosecha) || 0,
              supCiclo: Number(x.supCiclo) || 0,
              supCuadrilla: Number(x.supCuadrilla) || 0,
              jabero: Number(x.jabero) || 0,
              limpieza: Number(x.limpieza) || 0,
              riego: Number(x.riego) || 0,
              otros: Number(x.otros) || 0
            }));
          return { resp, filasLimpias };
        };

        if ($("btn-asis-bor")) {
          $("btn-asis-bor").onclick = async () => {
            const { resp, filasLimpias } = armarAsis();
            store.set(asisCacheKey(), { responsable: resp, filas: S.asisFilas, estado: "BORRADOR" });
            S.asisEstado = "BORRADOR";
            renderAsistencia();
            const r = await api({ accion: "guardarAsistenciaBorrador", fecha: S.fecha, responsable: resp, filas: filasLimpias });
            if (!r.ok) return toast(r.error);
            toast("Borrador de asistencia guardado");
          };
        }

        $("btn-asis-env").onclick = async () => {
          const { resp, filasLimpias } = armarAsis();
          if (!filasLimpias.length) return toast("Agrega al menos un registro antes de enviar");
          const totalGral = filasLimpias.reduce((a, b) => a + totalFilaDist(b), 0);

          const ok = await confirmar(
            esEnviado ? "¿Actualizar asistencia?" : "¿Enviar asistencia al Maestro?",
            `Se enviarán ${filasLimpias.length} filas (Total: ${totalGral}) del ${S.fecha}.`,
            esEnviado ? "Actualizar" : "Enviar"
          );
          if (!ok) return;

          $("btn-asis-env").disabled = true;
          const r = await api({ accion: "enviarAsistencia", fecha: S.fecha, responsable: resp, filas: filasLimpias });
          if ($("btn-asis-env")) $("btn-asis-env").disabled = false;
          if (!r.ok) return toast(r.error);

          S.asisEstado = "ENVIADO";
          S.asisEditandoEnviado = false;
          store.set(asisCacheKey(), { responsable: resp, filas: S.asisFilas, estado: "ENVIADO" });
          toast(esEnviado ? "Asistencia actualizada" : "¡Asistencia enviada al Maestro!");
          if (S.activeTab === "asistencia") renderAsistencia();
        };
      }

      pintarFilasAsistencia(soloLectura);
    }

    function actualizarTotalesAsistencia() {
      if (!$("asis-totales-card") || S.activeTab !== "asistencia") return;
      const colTot = {};
      DIST_FIELDS.forEach(df => { colTot[df.key] = 0; });
      let grand = 0;

      S.asisFilas.forEach((f, idx) => {
        const sum = totalFilaDist(f);
        grand += sum;
        DIST_FIELDS.forEach(df => { colTot[df.key] += Number(f[df.key]) || 0; });
        const cell = document.querySelector(`[data-rtot="${idx}"]`);
        if (cell) cell.textContent = sum;
      });

      $("asis-totales-card").innerHTML = `
        <div class="row sp" style="margin-bottom:5px">
          <span class="m" style="font-weight:700">Totales por rubro (${S.asisFilas.length} filas)</span>
          <span style="font-weight:800;color:#6ee7b7;font-size:13px">TOTAL: ${grand}</span>
        </div>
        <div class="row" style="gap:5px">
          ${DIST_FIELDS.map(df => `<span class="badge b-new">${df.label}: <b>${colTot[df.key]}</b></span>`).join("")}
        </div>
      `;
    }

    function pintarFilasAsistencia(soloLectura = false) {
      if (!$("asis-list") || S.activeTab !== "asistencia") return;
      const dis = soloLectura ? "disabled" : "";
      $("asis-list").innerHTML = S.asisFilas.map((f, i) => `
        <div class="dist-card">
          <div class="row" style="flex-wrap:nowrap;gap:5px">
            <span class="t-num">${i + 1}</span>
            <input ${dis} data-df="${i}" placeholder="Fundo" value="${esc(f.fundo)}" style="width:90px;font-size:11px;padding:4px 6px" />
            <input ${dis} data-dg="${i}" placeholder="N° Grupo" value="${esc(f.grupo)}" style="width:68px;font-size:11px;padding:4px 6px" />
            <input ${dis} data-ds="${i}" placeholder="Supervisor Nombre" value="${esc(f.supervisor)}" style="flex:1;font-size:11px;padding:4px 6px" />
            ${soloLectura ? "" : `<button type="button" class="btn btn-d btn-xs" data-dx="${i}">✕</button>`}
          </div>
          <div class="dist-grid">
            ${DIST_FIELDS.map(df => `
              <div class="dist-cell">
                <label>${df.label}</label>
                <input ${dis} type="number" min="0" step="1" data-dk="${i}" data-field="${df.key}" value="${Number(f[df.key]) || 0}" />
              </div>
            `).join("")}
            <div class="dist-cell">
              <label>Total</label>
              <div class="dist-total-box" data-rtot="${i}">${totalFilaDist(f)}</div>
            </div>
          </div>
        </div>
      `).join("");

      actualizarTotalesAsistencia();
      if (soloLectura) return;

      document.querySelectorAll("[data-df]").forEach(inp => {
        inp.oninput = () => { S.asisFilas[inp.dataset.df].fundo = inp.value; };
      });
      document.querySelectorAll("[data-dg]").forEach(inp => {
        inp.oninput = () => { S.asisFilas[inp.dataset.dg].grupo = inp.value; };
      });
      document.querySelectorAll("[data-ds]").forEach(inp => {
        inp.oninput = () => { S.asisFilas[inp.dataset.ds].supervisor = inp.value; };
      });
      document.querySelectorAll("[data-dk]").forEach(inp => {
        inp.oninput = () => {
          const i = Number(inp.dataset.dk);
          const field = inp.dataset.field;
          S.asisFilas[i][field] = Number(inp.value) || 0;
          actualizarTotalesAsistencia();
        };
      });
      document.querySelectorAll("[data-dx]").forEach(btn => {
        btn.onclick = () => {
          S.asisFilas.splice(btn.dataset.dx, 1);
          if (!S.asisFilas.length) S.asisFilas = [crearFilaDistVacia(S.fundo)];
          pintarFilasAsistencia(false);
        };
      });
    }
