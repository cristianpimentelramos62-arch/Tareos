        return `
          <div class="dist-card">
            <div class="row sp" style="margin-bottom:5px">
              <div class="row" style="gap:5px"><span class="t-num">${visIdx + 1}</span><span class="badge b-auto">Sem. ${c.semana}</span><span class="m">${formatFechaSlash(c.fecha)}</span></div>
              ${soloLectura ? "" : `<button type="button" class="btn btn-d btn-xs" data-ajx="${i}">✕</button>`}
            </div>
            <div class="aj-grid">
              <div class="dist-cell"><label>Fundo</label><select ${lockFundo ? "disabled" : ""} data-ajf="${i}">${rowFundos.map(fn => `<option value="${esc(fn)}" ${normFundoKey(fn) === normFundoKey(c.fundo) ? "selected" : ""}>${esc(fn)}</option>`).join("")}</select></div>
              <div class="dist-cell"><label>Módulo</label><select ${dis} data-ajm="${i}">${modOptions.map(md => `<option value="${esc(md)}" ${String(md) === String(c.modulo) ? "selected" : ""}>${esc(md)}</option>`).join("")}</select></div>
              <div class="dist-cell"><label>Variedad</label><select ${dis} data-ajv="${i}">${varOptions.map(vr => `<option value="${esc(vr)}" ${normText(vr) === normText(c.variedad) ? "selected" : ""}>${esc(vr)}</option>`).join("")}</select></div>
              <div class="dist-cell"><label>Ciclo (Auto)</label><div class="auto-pill" data-aj-ciclo="${i}">${c.ciclo}</div></div>
              <div class="dist-cell"><label>Formato</label><select ${dis} data-ajfmt="${i}">${fmtOptions.map(fm => `<option value="${esc(fm)}" ${normText(fm) === normText(c.formato) ? "selected" : ""}>${esc(fm)}</option>`).join("")}</select></div>
              <div class="dist-cell"><label>Destino</label><select ${dis} data-ajdst="${i}">${dstOptions.map(ds => `<option value="${esc(ds)}" ${normText(ds) === normText(c.destino) ? "selected" : ""}>${esc(ds)}</option>`).join("")}</select></div>
              <div class="dist-cell"><label>Días Reingreso</label><input ${dis} type="number" min="0" value="${c.diasReingreso}" placeholder="0" data-ajnum="diasReingreso" data-ajidx="${i}" /></div>
              <div class="dist-cell"><label>Ha</label><input ${dis} type="number" step="0.01" min="0" value="${c.ha || ""}" placeholder="0.00" data-ajnum="ha" data-ajidx="${i}" /></div>
              <div class="dist-cell"><label>Kg/Ha</label><input ${dis} type="number" step="1" min="0" value="${c.kgHa || ""}" placeholder="0" data-ajnum="kgHa" data-ajidx="${i}" /></div>
              <div class="dist-cell"><label>Jornales (Cos.)</label><input ${dis} type="number" min="0" value="${c.jornales || ""}" placeholder="0" data-ajnum="jornales" data-ajidx="${i}" /></div>
              <div class="dist-cell"><label>Kilos (Auto)</label><div class="auto-pill" data-aj-kilos="${i}">${c.kilos.toLocaleString("en-US")}</div></div>
              <div class="dist-cell"><label>Kg/Jornales</label><div class="auto-pill" data-aj-kgjor="${i}">${c.kgJornales.toFixed(1)}</div></div>
            </div>
          </div>
        `;
      }).join("");

      if (!soloLectura) {
        $("aj-list").querySelectorAll("[data-ajx]").forEach(b => {
          b.onclick = () => {
            S.ajusteFilas.splice(Number(b.dataset.ajx), 1);
            if (!S.ajusteFilas.length) S.ajusteFilas.push(crearFilaAjusteVacia(fundoFiltrado));
            pintarFilasAjuste(false);
          };
        });
        $("aj-list").querySelectorAll("[data-ajf]").forEach(s => {
          s.onchange = e => {
            const idx = Number(e.target.dataset.ajf), nf = e.target.value;
            const mod = obtenerModulosPorFundo(nf)[0] || "";
            const vr = obtenerVariedadesPorFundoYModulo(nf, mod)[0] || "";
            S.ajusteFilas[idx].fundo = nf; S.ajusteFilas[idx].modulo = mod; S.ajusteFilas[idx].variedad = vr;
            S.ajusteFilas[idx].ciclo = buscarCiclo(nf, mod, vr);
            pintarFilasAjuste(false);
          };
        });
        $("aj-list").querySelectorAll("[data-ajm]").forEach(s => {
          s.onchange = e => {
            const idx = Number(e.target.dataset.ajm), nm = e.target.value;
            const vars = obtenerVariedadesPorFundoYModulo(S.ajusteFilas[idx].fundo, nm);
            S.ajusteFilas[idx].modulo = nm;
            if (!vars.some(v => normText(v) === normText(S.ajusteFilas[idx].variedad))) S.ajusteFilas[idx].variedad = vars[0] || "";
            S.ajusteFilas[idx].ciclo = buscarCiclo(S.ajusteFilas[idx].fundo, nm, S.ajusteFilas[idx].variedad);
            pintarFilasAjuste(false);
          };
        });
        $("aj-list").querySelectorAll("[data-ajv]").forEach(s => {
          s.onchange = e => {
            const idx = Number(e.target.dataset.ajv);
            S.ajusteFilas[idx].variedad = e.target.value;
            S.ajusteFilas[idx].ciclo = buscarCiclo(S.ajusteFilas[idx].fundo, S.ajusteFilas[idx].modulo, e.target.value);
            actualizarTotalesAjuste();
          };
        });
        $("aj-list").querySelectorAll("[data-ajfmt]").forEach(s => { s.onchange = e => { S.ajusteFilas[Number(e.target.dataset.ajfmt)].formato = e.target.value; }; });
        $("aj-list").querySelectorAll("[data-ajdst]").forEach(s => { s.onchange = e => { S.ajusteFilas[Number(e.target.dataset.ajdst)].destino = e.target.value; }; });
        $("aj-list").querySelectorAll("[data-ajnum]").forEach(inp => {
          inp.oninput = e => {
            const idx = Number(e.target.dataset.ajidx), campo = e.target.dataset.ajnum;
            S.ajusteFilas[idx][campo] = (campo === "diasReingreso" && e.target.value === "") ? "" : Math.max(0, Number(e.target.value) || 0);
            actualizarTotalesAjuste();
          };
        });
      }
      actualizarTotalesAjuste();
    }

    // =========================================================================
    // VISTA 4: PROYECCIÓN (15 COLUMNAS + PLANTILLA MASIVA)
    // =========================================================================
    function matrizProyeccionMasivoAFilas(matriz) {
      const out = [];
      matriz.forEach((row, idx) => {
        const c = row.map(v => String(v ?? "").trim());
        if (!c.some(Boolean)) return;
        const joined = normText(c.join(" "));
        if (idx === 0 && (joined.includes("VARIEDAD") || joined.includes("JORNALES") || joined.includes("MODULO"))) return;

        let fecha = S.fechaProy, fundo = "", modulo = "", variedad = "", ciclo = 0, dias = "", ha = 0, kgHa = 0, jornales = 0;
        if (c.length >= 13) {
          const fRaw = c[1];
          const mSlash = fRaw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          if (mSlash) fecha = `${mSlash[3]}-${mSlash[2].padStart(2, "0")}-${mSlash[1].padStart(2, "0")}`;
          else if (/^\d{4}-\d{2}-\d{2}$/.test(fRaw)) fecha = fRaw;
          fundo = c[3] || ""; modulo = c[4] || ""; variedad = c[5] || ""; ciclo = Number(c[6]) || 0;
          dias = c[9] === "" ? "" : Number(c[9]); ha = Number(c[10]) || 0; kgHa = Number(c[11]) || 0; jornales = Number(c[12]) || 0;
        } else {
          fundo = c[0] || ""; modulo = c[1] || ""; variedad = c[2] || "";
          dias = c[3] === "" ? "" : Number(c[3]); ha = Number(c[4]) || 0; kgHa = Number(c[5]) || 0; jornales = Number(c[6]) || 0;
        }
        if (!fundo && !variedad && ha === 0 && kgHa === 0) return;
        out.push(recalcularFilaProyeccion({ fecha, fundo, modulo, variedad, ciclo, formato: "", destino: "", diasReingreso: dias, ha, kgHa, jornales }, fecha));
      });
      return out;
    }

    function renderProyeccion() {
      const pane = $("pane-proyeccion");
      if (!pane || S.activeView !== "proyeccion") return;

      const esEnviado = S.proyEstado === "ENVIADO";
      const soloLectura = esEnviado && !S.proyEditandoEnviado;
      const semanaProy = calcularSemanaISO(S.fechaProy);

      S.proyFiltroFundo = obtenerFiltroFundoPersistente(CACHE.PROY_LAST_FUNDO);
      const fundosPermitidos = obtenerFundosPermitidosUsuario();
      const filtroFundoActivo = S.proyFiltroFundo || "TODOS";

      let badge = `<span class="badge b-new">NUEVO</span>`;
      if (S.proyEstado === "BORRADOR") badge = `<span class="badge b-bor">BORRADOR</span>`;
      else if (esEnviado && !S.proyEditandoEnviado) badge = `<span class="badge b-env">ENVIADO</span>`;
      else if (esEnviado && S.proyEditandoEnviado) badge = `<span class="badge b-bor">EDITANDO</span>`;

      pane.innerHTML = `
        <div class="card">
          <div class="row sp" style="margin-bottom:6px">
            <div class="row"><input type="date" id="f-proy" value="${S.fechaProy}" />${badge}</div>
            <div class="row" style="gap:4px">
              <span class="badge b-auto">Sem. ${semanaProy}</span>
              <span class="badge b-env">+1 día pred.</span>
            </div>
          </div>

          <div class="row" style="margin-bottom:6px;gap:6px;flex-wrap:nowrap">
            <select id="pr-top-fundo-filter" style="flex:1;font-weight:700;font-size:11.5px;border-color:var(--accent-border)">
              ${fundosPermitidos.length > 1 || S.perfil !== "supervisor" ? `<option value="TODOS" ${filtroFundoActivo === "TODOS" ? "selected" : ""}>🌾 Todos los fundos (${fundosPermitidos.length})</option>` : ""}
              ${fundosPermitidos.map(fn => `<option value="${esc(fn)}" ${normFundoKey(filtroFundoActivo) === normFundoKey(fn) ? "selected" : ""}>Fundo: ${esc(fn)}</option>`).join("")}
            </select>
            <span class="m" style="font-size:10px;white-space:nowrap">💾 Guardado</span>
          </div>

          <div class="row sp" style="gap:5px">
            <span class="m" style="font-size:10.5px">Proyección · Tipo: Cosecha · Formato/Destino vacíos</span>
            <div class="row" style="gap:4px">
              <button id="btn-pr-img" type="button" class="btn btn-info btn-xs">🖼 Foto</button>
              <button id="btn-pr-xls" type="button" class="btn btn-s btn-xs">📊 Excel 15 col.</button>
            </div>
          </div>
        </div>

        ${soloLectura ? "" : `
          <div class="masivo-banner">
            <div class="row sp" style="flex-wrap:nowrap">
              <div style="min-width:0;flex:1">
                <div style="font-weight:800;font-size:12px">Carga masiva de Proyección (Excel)</div>
                <div class="m" style="font-size:10.5px">Descarga el formato Plantilla con los 15 encabezados</div>
              </div>
              <div class="row" style="flex-shrink:0;gap:5px">
                <button id="pr-tpl-btn" type="button" class="btn btn-s btn-xs">Plantilla</button>
                <label for="pr-masivo-file" class="btn">📥 Masivo</label>
              </div>
              <input type="file" id="pr-masivo-file" accept=".xlsx,.xls,.csv,.tsv" style="display:none" />
            </div>
          </div>
        `}

        <div id="pr-list"></div>
        <div class="card" id="pr-totales-card"></div>

        <div class="card">
          ${soloLectura ? `
            <div class="row sp" style="gap:6px">
              <span class="m">Reporte de Proyección enviado.</span>
              <div class="row">
                <button id="btn-pr-edit" type="button" class="btn btn-w btn-xs">Editar</button>
                <button id="btn-pr-del" type="button" class="btn btn-d btn-xs">Borrar enviado</button>
              </div>
            </div>
          ` : `
            <div class="row sp" style="gap:6px">
              <button id="btn-pr-add" type="button" class="btn btn-s" style="flex:1">+ Agregar fila</button>
              ${esEnviado && S.proyEditandoEnviado ? `<button id="btn-pr-cancel" type="button" class="btn btn-s">Cancelar</button>` : ""}
            </div>
            <div class="row" style="margin-top:6px;gap:6px">
              ${!esEnviado ? `<button id="btn-pr-bor" type="button" class="btn btn-w" style="flex:1">Guardar borrador</button>` : ""}
              <button id="btn-pr-env" type="button" class="btn" style="flex:1">${esEnviado ? "Actualizar envío" : "Enviar proyección"}</button>
              ${esEnviado ? `<button id="btn-pr-del-edit" type="button" class="btn btn-d">Borrar enviado</button>` : ""}
            </div>
          `}
        </div>
      `;

      $("pr-top-fundo-filter").onchange = e => {
        S.proyFiltroFundo = guardarFiltroFundoPersistente(CACHE.PROY_LAST_FUNDO, e.target.value);
        if (S.proyFiltroFundo !== "TODOS" && !soloLectura) {
          const vis = S.proyFilas.filter(r => normFundoKey(r.fundo) === normFundoKey(S.proyFiltroFundo));
          if (!vis.length) S.proyFilas.push(crearFilaProyeccionVacia(S.proyFiltroFundo));
        }
        renderProyeccion();
      };

      $("f-proy").onchange = async e => {
        const token = ++S.renderToken;
        S.fechaProy = e.target.value;
        cargarProyeccionDesdeCache(); renderProyeccion();
        const ok = await cargarProyeccion(token);
        if (ok && S.renderToken === token && S.activeView === "proyeccion" && !S.proyEditandoEnviado) renderProyeccion();
      };

      const visiblesPr = () => (!S.proyFiltroFundo || S.proyFiltroFundo === "TODOS")
        ? S.proyFilas
        : S.proyFilas.filter(r => normFundoKey(r.fundo) === normFundoKey(S.proyFiltroFundo));

      $("btn-pr-img").onclick = () => exportarProyeccionImagen(S.fechaProy, S.proyFiltroFundo === "TODOS" ? S.zona : S.proyFiltroFundo, visiblesPr());
      $("btn-pr-xls").onclick = () => exportarProyeccionExcel(visiblesPr(), `Proyeccion_${S.fechaProy}`);

      const borrarProy = async () => {
        const ok = await confirmar("¿Borrar Proyección enviada?", `Se eliminará la Proyección del ${S.fechaProy}.`, "Borrar", true);
        if (!ok) return;
        await api({ accion: "borrarProyeccion", fecha: S.fechaProy, fundo: S.fundo, targetPin: S.pin });
        store.del(proyCacheKey());
        S.proyFilas = [crearFilaProyeccionVacia(S.proyFiltroFundo !== "TODOS" ? S.proyFiltroFundo : "")];
        S.proyEstado = "NUEVO"; S.proyEditandoEnviado = false;
        toast("Proyección eliminada");
        if (S.activeView === "proyeccion") renderProyeccion();
      };

      if (soloLectura) {
        $("btn-pr-edit").onclick = () => { S.renderToken++; S.proyEditandoEnviado = true; renderProyeccion(); };
        $("btn-pr-del").onclick = borrarProy;
      } else {
        if ($("pr-tpl-btn")) $("pr-tpl-btn").onclick = descargarPlantillaProyeccionExcel;
        if ($("pr-masivo-file")) {
          $("pr-masivo-file").onchange = async e => {
            const f = e.target.files[0];
            if (!f) return;
            try {
              const matriz = await leerArchivoComoMatriz(f);
              const nuevas = matrizProyeccionMasivoAFilas(matriz);
              if (!nuevas.length) return toast("No se detectaron filas válidas de Proyección");
              S.proyFilas = S.proyFilas.filter(x => (Number(x.ha) || 0) > 0 || (Number(x.kgHa) || 0) > 0).concat(nuevas);
              pintarFilasProyeccion(false);
              toast(`✓ ${nuevas.length} filas de Proyección cargadas`);
            } catch (err) { toast(err.message || "Error al leer Excel"); }
            e.target.value = "";
          };
        }
        if ($("btn-pr-del-edit")) $("btn-pr-del-edit").onclick = borrarProy;
        $("btn-pr-add").onclick = () => {
          const base = S.proyFiltroFundo !== "TODOS" ? S.proyFiltroFundo : "";
          S.proyFilas.push(crearFilaProyeccionVacia(base));
          pintarFilasProyeccion(false);
        };
        if ($("btn-pr-cancel")) $("btn-pr-cancel").onclick = () => { S.renderToken++; S.proyEditandoEnviado = false; cargarProyeccionDesdeCache(); renderProyeccion(); };

        const armarPr = () => S.proyFilas
          .filter(x => (Number(x.ha) || 0) > 0 || (Number(x.kgHa) || 0) > 0 || (Number(x.jornales) || 0) > 0)
          .map(x => recalcularFilaProyeccion({ ...x, fecha: S.fechaProy, formato: "", destino: "" }, S.fechaProy));

        if ($("btn-pr-bor")) {
          $("btn-pr-bor").onclick = async () => {
            const limpias = armarPr();
            store.set(proyCacheKey(), { filas: S.proyFilas, estado: "BORRADOR" });
            S.proyEstado = "BORRADOR"; renderProyeccion();
            await api({ accion: "guardarProyeccionBorrador", fecha: S.fechaProy, responsable: S.nombre, filas: limpias });
            toast("Borrador de Proyección guardado");
          };
        }

        $("btn-pr-env").onclick = async () => {
          const limpias = armarPr();
          if (!limpias.length) return toast("Ingresa al menos una fila válida");
          const totKg = limpias.reduce((a, b) => a + (Number(b.kilos) || 0), 0);
          const ok = await confirmar(esEnviado ? "¿Actualizar Proyección?" : "¿Enviar Proyección?", `Se enviarán ${limpias.length} filas (${totKg.toLocaleString("en-US")} kg) para el ${S.fechaProy}.`, esEnviado ? "Actualizar" : "Enviar");
          if (!ok) return;
          $("btn-pr-env").disabled = true;
          const r = await api({ accion: "enviarProyeccion", fecha: S.fechaProy, fundo: limpias[0].fundo || S.fundo, responsable: S.nombre, filas: limpias });
          if ($("btn-pr-env")) $("btn-pr-env").disabled = false;
          if (!r.ok) return toast(r.error);
          S.proyEstado = "ENVIADO"; S.proyEditandoEnviado = false;
          store.set(proyCacheKey(), { filas: limpias, estado: "ENVIADO", enviado: new Date().toISOString() });
          toast(esEnviado ? "Proyección actualizada" : "¡Proyección enviada!");
          if (S.activeView === "proyeccion") renderProyeccion();
        };
      }
      pintarFilasProyeccion(soloLectura);
    }

    function actualizarTotalesProyeccion() {
      if (!$("pr-totales-card") || S.activeView !== "proyeccion") return;
      let totHa = 0, totJor = 0, totKilos = 0, count = 0;
      S.proyFilas.forEach((raw, idx) => {
        const c = recalcularFilaProyeccion(raw, S.fechaProy);
        S.proyFilas[idx] = c;
        const ok = !S.proyFiltroFundo || S.proyFiltroFundo === "TODOS" || normFundoKey(c.fundo) === normFundoKey(S.proyFiltroFundo);
        if (ok) { count++; totHa += c.ha; totJor += c.jornales; totKilos += c.kilos; }
        const elC = document.querySelector(`[data-pr-ciclo="${idx}"]`);
        const elK = document.querySelector(`[data-pr-kilos="${idx}"]`);
        const elJ = document.querySelector(`[data-pr-kgjor="${idx}"]`);
        if (elC) elC.textContent = c.ciclo;
        if (elK) elK.textContent = c.kilos.toLocaleString("en-US");
        if (elJ) elJ.textContent = c.kgJornales.toFixed(1);
      });
      const prom = totJor > 0 ? (totKilos / totJor).toFixed(1) : "0.0";
      $("pr-totales-card").innerHTML = `
        <div class="row sp" style="margin-bottom:5px">
          <span class="m" style="font-weight:700">Total Proyección (${count} filas)</span>
          <span style="font-weight:800;color:var(--accent);font-size:13.5px">${totKilos.toLocaleString("en-US")} kg</span>
        </div>
        <div class="row" style="gap:5px">
          <span class="badge b-new">Ha: <b>${totHa.toFixed(2)}</b></span>
          <span class="badge b-new">Jornales: <b>${totJor}</b></span>
          <span class="badge b-auto">Kg/Jornal prom: <b>${prom}</b></span>
        </div>
      `;
    }

    function pintarFilasProyeccion(soloLectura = false) {
      if (!$("pr-list") || S.activeView !== "proyeccion") return;
      const dis = soloLectura ? "disabled" : "";
      const fundosList = obtenerFundosPermitidosUsuario();
      const fundoFiltrado = S.proyFiltroFundo && S.proyFiltroFundo !== "TODOS" ? S.proyFiltroFundo : "";

      const indices = [];
      S.proyFilas.forEach((raw, i) => {
        const c = recalcularFilaProyeccion(raw, S.fechaProy);
        S.proyFilas[i] = c;
        if (!fundoFiltrado || normFundoKey(c.fundo) === normFundoKey(fundoFiltrado)) indices.push(i);
      });

      if (!indices.length) {
        $("pr-list").innerHTML = `<div class="card m" style="text-align:center">Sin filas de Proyección para <b>${esc(fundoFiltrado)}</b>.</div>`;
        actualizarTotalesProyeccion();
        return;
      }

      $("pr-list").innerHTML = indices.map((i, visIdx) => {
        const c = S.proyFilas[i];
        const modOptions = Array.from(new Set([...obtenerModulosPorFundo(c.fundo), ...(c.modulo ? [c.modulo] : [])]));
        const varOptions = Array.from(new Set([...obtenerVariedadesPorFundoYModulo(c.fundo, c.modulo), ...(c.variedad ? [c.variedad] : [])]));
        const rowFundos = Array.from(new Set([...fundosList, ...(c.fundo ? [c.fundo] : [])]));
        const lockFundo = soloLectura || Boolean(fundoFiltrado);

        return `
          <div class="dist-card">
            <div class="row sp" style="margin-bottom:5px">
              <div class="row" style="gap:5px"><span class="t-num">${visIdx + 1}</span><span class="badge b-auto">Sem. ${c.semana}</span><span class="m">${formatFechaSlash(c.fecha)}</span></div>
              ${soloLectura ? "" : `<button type="button" class="btn btn-d btn-xs" data-prx="${i}">✕</button>`}
            </div>
            <div class="aj-grid">
              <div class="dist-cell"><label>Fundo</label><select ${lockFundo ? "disabled" : ""} data-prf="${i}">${rowFundos.map(fn => `<option value="${esc(fn)}" ${normFundoKey(fn) === normFundoKey(c.fundo) ? "selected" : ""}>${esc(fn)}</option>`).join("")}</select></div>
              <div class="dist-cell"><label>Módulo</label><select ${dis} data-prm="${i}">${modOptions.map(md => `<option value="${esc(md)}" ${String(md) === String(c.modulo) ? "selected" : ""}>${esc(md)}</option>`).join("")}</select></div>
              <div class="dist-cell"><label>Variedad</label><select ${dis} data-prv="${i}">${varOptions.map(vr => `<option value="${esc(vr)}" ${normText(vr) === normText(c.variedad) ? "selected" : ""}>${esc(vr)}</option>`).join("")}</select></div>
              <div class="dist-cell"><label>Ciclo (Auto)</label><div class="auto-pill" data-pr-ciclo="${i}">${c.ciclo}</div></div>
              <div class="dist-cell"><label>Días Reingreso</label><input ${dis} type="number" min="0" value="${c.diasReingreso}" placeholder="0" data-prnum="diasReingreso" data-pridx="${i}" /></div>
              <div class="dist-cell"><label>Ha</label><input ${dis} type="number" step="0.01" min="0" value="${c.ha || ""}" placeholder="0.00" data-prnum="ha" data-pridx="${i}" /></div>
              <div class="dist-cell"><label>Kg/Ha</label><input ${dis} type="number" step="1" min="0" value="${c.kgHa || ""}" placeholder="0" data-prnum="kgHa" data-pridx="${i}" /></div>
              <div class="dist-cell"><label>Jornales (Cos.)</label><input ${dis} type="number" min="0" value="${c.jornales || ""}" placeholder="0" data-prnum="jornales" data-pridx="${i}" /></div>
              <div class="dist-cell"><label>Kilos (Auto)</label><div class="auto-pill" data-pr-kilos="${i}">${c.kilos.toLocaleString("en-US")}</div></div>
              <div class="dist-cell"><label>Kg/Jornales</label><div class="auto-pill" data-pr-kgjor="${i}">${c.kgJornales.toFixed(1)}</div></div>
            </div>
          </div>
        `;
      }).join("");

      if (!soloLectura) {
        $("pr-list").querySelectorAll("[data-prx]").forEach(b => {
          b.onclick = () => {
            S.proyFilas.splice(Number(b.dataset.prx), 1);
            if (!S.proyFilas.length) S.proyFilas.push(crearFilaProyeccionVacia(fundoFiltrado));
            pintarFilasProyeccion(false);
          };
        });
        $("pr-list").querySelectorAll("[data-prf]").forEach(s => {
          s.onchange = e => {
            const idx = Number(e.target.dataset.prf), nf = e.target.value;
            const mod = obtenerModulosPorFundo(nf)[0] || "";
            const vr = obtenerVariedadesPorFundoYModulo(nf, mod)[0] || "";
            S.proyFilas[idx].fundo = nf; S.proyFilas[idx].modulo = mod; S.proyFilas[idx].variedad = vr;
            S.proyFilas[idx].ciclo = buscarCiclo(nf, mod, vr);
            pintarFilasProyeccion(false);
          };
        });
        $("pr-list").querySelectorAll("[data-prm]").forEach(s => {
          s.onchange = e => {
            const idx = Number(e.target.dataset.prm), nm = e.target.value;
            const vars = obtenerVariedadesPorFundoYModulo(S.proyFilas[idx].fundo, nm);
            S.proyFilas[idx].modulo = nm;
            if (!vars.some(v => normText(v) === normText(S.proyFilas[idx].variedad))) S.proyFilas[idx].variedad = vars[0] || "";
            S.proyFilas[idx].ciclo = buscarCiclo(S.proyFilas[idx].fundo, nm, S.proyFilas[idx].variedad);
            pintarFilasProyeccion(false);
          };
        });
        $("pr-list").querySelectorAll("[data-prv]").forEach(s => {
          s.onchange = e => {
            const idx = Number(e.target.dataset.prv);
            S.proyFilas[idx].variedad = e.target.value;
            S.proyFilas[idx].ciclo = buscarCiclo(S.proyFilas[idx].fundo, S.proyFilas[idx].modulo, e.target.value);
            actualizarTotalesProyeccion();
          };
        });
        $("pr-list").querySelectorAll("[data-prnum]").forEach(inp => {
          inp.oninput = e => {
            const idx = Number(e.target.dataset.pridx), campo = e.target.dataset.prnum;
            S.proyFilas[idx][campo] = (campo === "diasReingreso" && e.target.value === "") ? "" : Math.max(0, Number(e.target.value) || 0);
            actualizarTotalesProyeccion();
          };
        });
      }
      actualizarTotalesProyeccion();
    }

    // =========================================================================
    // VISTA 5: HISTORIAL (30 DÍAS)
    // =========================================================================
    function renderHistorial() {
      const pane = $("pane-historial");
      if (!pane || S.activeView !== "historial") return;
      store.purgeOlderThan30Days();

      const dias = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith(CACHE.TAREO_PREFIX)) continue;
          const rest = k.slice(CACHE.TAREO_PREFIX.length);
          const m = rest.match(/^(\d{4}-\d{2}-\d{2})_(.+)_([^_]+)$/);
          if (!m) continue;
          const [, fecha, fundo, pin] = m;
          if (S.perfil !== "admi" && pin !== S.pin) continue;
          const data = store.get(k, null);
          if (data && data.estado === "ENVIADO" && Array.isArray(data.filas) && data.filas.length) dias.push({ fecha, fundo, pin, filas: data.filas });
        }
      } catch (e) {}

      dias.sort((a, b) => b.fecha.localeCompare(a.fecha));
      const totalReg = dias.reduce((acc, d) => acc + d.filas.length, 0);

      pane.innerHTML = `
        <div class="card">
          <div class="row sp">
            <div>
              <div style="font-weight:800;font-size:13.5px">Historial de Tareos (Últimos 30 días)</div>
              <div class="m">${dias.length} días enviados · ${totalReg} registros · Auto-limpieza 30d</div>
            </div>
            <button id="btn-hist-ref" type="button" class="btn btn-s btn-xs">Actualizar</button>
          </div>
        </div>
        ${dias.length ? dias.map((d, idx) => {
          const totH = d.filas.reduce((a, b) => a + (Number(b.horas) || 0), 0);
          return `
            <div class="card">
              <div class="row sp" style="cursor:pointer" data-htoggle="${idx}">
                <div class="row"><b>📅 ${esc(d.fecha)}</b><span class="badge b-env">${esc(d.fundo)}</span></div>
                <span class="m" style="font-weight:700">${d.filas.length} pers. · ${totH} h ▾</span>
              </div>
              <div id="hbody-${idx}" style="margin-top:8px;overflow-x:auto">
                <table class="clean-tbl">
                  <thead><tr><th>#</th><th>DNI</th><th>Nombres</th><th>Labor</th><th>Hrs</th></tr></thead>
                  <tbody>
                    ${d.filas.map((f, fi) => {
                      const labObj = S.L.find(x => String(x.codigo) === String(f.labor));
                      return `<tr><td>${fi + 1}</td><td style="font-family:monospace">${esc(f.dni)}</td><td>${esc(f.nombre || S.P.get(f.dni)?.nombre || "—")}</td><td style="color:var(--accent)">${esc(labObj ? `${f.labor} ${labObj.nombre}` : f.labor)}</td><td><b>${Number(f.horas) || 8}</b></td></tr>`;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }).join("") : `<div class="card m" style="text-align:center">Aún no tienes tareos enviados en los últimos 30 días.</div>`}
      `;

      $("btn-hist-ref").onclick = () => renderHistorial();
      pane.querySelectorAll("[data-htoggle]").forEach(el => {
        el.onclick = () => {
          const body = $(`hbody-${el.dataset.htoggle}`);
          if (body) body.style.display = body.style.display === "none" ? "block" : "none";
        };
      });
    }

    // =========================================================================
    // VISTA 6: RESUMEN CONSOLIDADO (CON TOTALES EN AJUSTE Y PROYECCIÓN)
    // =========================================================================
    async function renderResumen(token = S.renderToken) {
      const pane = $("pane-resumen");
      if (!pane || S.activeView !== "resumen" || S.renderToken !== token) return;

      const esAdmi = S.perfil === "admi";
      const zonasDisponibles = esAdmi
        ? Array.from(new Set(["TODAS", ...S.zonas.map(normText)]))
        : Array.from(new Set(["TODAS", ...parseUserZonas(S.zonasUsuario.length ? S.zonasUsuario : S.zona).map(normText)]));
      const fundosPermitidosRes = obtenerFundosPermitidosUsuario();
      const fundosDisponibles = Array.from(new Set(["TODOS", ...fundosPermitidosRes]));
      const fechaActivaRes = S.resumenSubTab === "proyeccion" ? S.fechaProy : S.fecha;

      pane.innerHTML = `
        <div class="card">
          <div class="row sp" style="margin-bottom:6px">
            <div class="row">
              <input type="date" id="f-res" value="${fechaActivaRes}" />
              <button id="btn-rf" type="button" class="btn btn-s btn-xs">Actualizar</button>
            </div>
            <div class="row">
              <button id="btn-img-res" type="button" class="btn btn-info btn-xs">🖼 Foto</button>
              <button id="btn-csv" type="button" class="btn btn-xs">📊 Excel</button>
            </div>
          </div>

          <div class="row sp" style="margin-bottom:6px;gap:5px">
            ${(esAdmi || zonasDisponibles.length > 2)
              ? `<select id="res-zona-sel" style="flex:1;padding:5px 8px;font-size:11px;font-weight:700">
                  ${zonasDisponibles.map(z => `<option value="${esc(z)}" ${S.resumenFiltroZona === z ? "selected" : ""}>${z === "TODAS" ? (esAdmi ? "Zona: Todas" : `Mis Zonas (${S.zona})`) : `Zona: ${esc(z)}`}</option>`).join("")}
                </select>`
              : `<span class="badge b-env">ZONA ${esc(S.zona)}</span>`
            }
            <select id="res-fundo-sel" style="flex:1;padding:5px 8px;font-size:11px;font-weight:700">
              ${fundosDisponibles.map(f => `<option value="${esc(f)}" ${normFundoKey(S.resumenFiltroFundo) === normFundoKey(f) ? "selected" : ""}>${f === "TODOS" ? "Fundo: Todos" : esc(f)}</option>`).join("")}
            </select>
          </div>

          <div class="row" style="gap:4px">
            <button type="button" class="btn btn-xs ${S.resumenSubTab === "tareos" ? "" : "btn-s"}" data-rsub="tareos" style="flex:1">Tareos</button>
            <button type="button" class="btn btn-xs ${S.resumenSubTab === "asistencia" ? "" : "btn-s"}" data-rsub="asistencia" style="flex:1">Asistencia</button>
            <button type="button" class="btn btn-xs ${S.resumenSubTab === "ajuste" ? "" : "btn-s"}" data-rsub="ajuste" style="flex:1">Ajuste</button>
            <button type="button" class="btn btn-xs ${S.resumenSubTab === "proyeccion" ? "" : "btn-s"}" data-rsub="proyeccion" style="flex:1">Proyección</button>
          </div>
        </div>
        <div id="res-body"><div class="card m">Cargando consolidado...</div></div>
      `;

      $("f-res").onchange = e => {
        if (S.resumenSubTab === "proyeccion") S.fechaProy = e.target.value;
        else S.fecha = e.target.value;
        renderResumen(token);
      };
      $("btn-rf").onclick = () => renderResumen(token);

      if ($("res-zona-sel")) $("res-zona-sel").onchange = e => { S.resumenFiltroZona = e.target.value; pintarContenidoResumen(); };
      $("res-fundo-sel").onchange = e => { S.resumenFiltroFundo = e.target.value; pintarContenidoResumen(); };

      pane.querySelectorAll("[data-rsub]").forEach(btn => {
        btn.onclick = () => {
          const prev = S.resumenSubTab;
          S.resumenSubTab = btn.dataset.rsub;
          if ((prev === "proyeccion") !== (S.resumenSubTab === "proyeccion")) { renderResumen(token); return; }
          pane.querySelectorAll("[data-rsub]").forEach(b => b.className = `btn btn-xs ${b.dataset.rsub === S.resumenSubTab ? "" : "btn-s"}`);
          pintarContenidoResumen();
        };
      });

      const r = await api({ accion: "resumen", fecha: fechaActivaRes });
      if (S.renderToken !== token || S.activeView !== "resumen") return;

      S.resumenTareos = (r && r.ok && Array.isArray(r.data)) ? r.data : [];
      S.resumenAsis = (r && r.ok && Array.isArray(r.asistencia)) ? r.asistencia : [];
      S.resumenAjuste = (r && r.ok && Array.isArray(r.ajuste)) ? r.ajuste : [];
      S.resumenProy = (r && r.ok && Array.isArray(r.proyeccion)) ? r.proyeccion : [];

      $("btn-csv").onclick = () => {
        if (S.resumenSubTab === "tareos") {
          const fil = filtrarRegistrosPorZonaYFundo(S.resumenTareos);
          const rows = [["Fecha", "Zona", "Fundo", "Responsable", "DNI", "Trabajador", "Cod. Labor", "Labor", "Horas"]];
          fil.forEach(t => (t.filas || []).forEach(f => {
            const labObj = S.L.find(x => String(x.codigo) === String(f.labor));
            rows.push([t.fecha, resolverZonaRegistro(t), t.fundo, t.usuario, f.dni, f.nombre || "", f.labor, labObj ? labObj.nombre : "", Number(f.horas) || 8]);
          }));
          descargarExcelDesdeMatriz(rows, `Consolidado_Tareos_${fechaActivaRes}.xlsx`, "Tareos");
        } else if (S.resumenSubTab === "asistencia") {
          const allRows = [];
          filtrarRegistrosPorZonaYFundo(S.resumenAsis).forEach(a => (a.filas || []).forEach(x => allRows.push({ ...x, fundo: x.fundo || a.fundo || "" })));
          exportarAsistenciaExcel(allRows, `Consolidado_Distribucion_${fechaActivaRes}`);
        } else if (S.resumenSubTab === "ajuste") {
          const allRows = [];
          filtrarRegistrosPorZonaYFundo(S.resumenAjuste).forEach(a => (a.filas || []).forEach(x => allRows.push(recalcularFilaAjuste(x, a.fecha))));
          exportarAjusteExcel(allRows, `Consolidado_Ajuste_${fechaActivaRes}`);
        } else {
          const allRows = [];
          filtrarRegistrosPorZonaYFundo(S.resumenProy).forEach(a => (a.filas || []).forEach(x => allRows.push(recalcularFilaProyeccion(x, a.fecha))));
          exportarProyeccionExcel(allRows, `Consolidado_Proyeccion_${fechaActivaRes}`);
        }
      };

      $("btn-img-res").onclick = () => {
        const tag = S.resumenFiltroFundo !== "TODOS" ? S.resumenFiltroFundo : (S.resumenFiltroZona !== "TODAS" ? S.resumenFiltroZona : S.zona);
        if (S.resumenSubTab === "asistencia") {
          const allRows = [];
          filtrarRegistrosPorZonaYFundo(S.resumenAsis).forEach(a => (a.filas || []).forEach(x => allRows.push({ ...x, fundo: x.fundo || a.fundo || "" })));
          exportarAsistenciaImagen(fechaActivaRes, `Consolidado (${tag})`, allRows);
        } else if (S.resumenSubTab === "ajuste") {
          const allRows = [];
          filtrarRegistrosPorZonaYFundo(S.resumenAjuste).forEach(a => (a.filas || []).forEach(x => allRows.push(recalcularFilaAjuste(x, a.fecha))));
          exportarAjusteImagen(fechaActivaRes, `Consolidado (${tag})`, allRows);
        } else if (S.resumenSubTab === "proyeccion") {
          const allRows = [];
          filtrarRegistrosPorZonaYFundo(S.resumenProy).forEach(a => (a.filas || []).forEach(x => allRows.push(recalcularFilaProyeccion(x, a.fecha))));
          exportarProyeccionImagen(fechaActivaRes, `Consolidado (${tag})`, allRows);
        } else {
          const rows = filtrarRegistrosPorZonaYFundo(S.resumenTareos).map(t => {
            const totH = (t.filas || []).reduce((a, b) => a + (Number(b.horas) || 0), 0);
            return [t.fundo, resolverZonaRegistro(t), t.usuario, (t.filas || []).length, totH];
          });
          exportarTablaGenImagen(`Resumen Tareos · ${fechaActivaRes}`, `Filtro: ${tag}`, ["Fundo", "Zona", "Responsable", "Pers.", "Horas"], rows, `Resumen_Tareos_${fechaActivaRes}.png`);
        }
      };

      pintarContenidoResumen();
    }

    function pintarContenidoResumen() {
      const body = $("res-body");
      if (!body || S.activeView !== "resumen") return;

      if (S.resumenSubTab === "tareos") {
        const fil = filtrarRegistrosPorZonaYFundo(S.resumenTareos);
        const totP = fil.reduce((a, b) => a + (b.filas?.length || 0), 0);
        const totH = fil.reduce((a, b) => a + (b.filas || []).reduce((s, r) => s + (Number(r.horas) || 0), 0), 0);
        body.innerHTML = `
          <div class="card"><div class="row sp"><b>${fil.length} envíos registrados</b><span class="badge b-env">${totP} pers. · ${totH} h</span></div></div>
          ${fil.length ? fil.map(t => {
            const h = (t.filas || []).reduce((a, b) => a + (Number(b.horas) || 0), 0);
            return `<div class="card"><div class="row sp"><div><b>${esc(t.fundo)}</b> <span class="badge b-auto">${esc(resolverZonaRegistro(t) || "—")}</span><div class="m">Resp: ${esc(t.usuario)}</div></div><span class="badge b-env">${(t.filas || []).length} pers. · ${h} h</span></div></div>`;
          }).join("") : `<div class="card m" style="text-align:center">Sin tareos enviados para este filtro y fecha.</div>`}
        `;
      } else if (S.resumenSubTab === "asistencia") {
        const fil = filtrarRegistrosPorZonaYFundo(S.resumenAsis);
        const allRows = [];
        fil.forEach(a => (a.filas || []).forEach(x => allRows.push({ ...x, fundo: x.fundo || a.fundo || "" })));
        const totPers = allRows.reduce((a, b) => a + totalFilaAsis(b), 0);
        body.innerHTML = `
          <div class="card"><div class="row sp"><b>${fil.length} reportes de Distribución</b><span class="badge b-env">${totPers} personas</span></div></div>
          ${fil.length ? fil.map(a => {
            const tp = (a.filas || []).reduce((s, r) => s + totalFilaAsis(r), 0);
            return `<div class="card"><div class="row sp"><div><b>${esc(a.fundo)}</b> <span class="badge b-auto">${esc(resolverZonaRegistro(a) || "—")}</span><div class="m">Resp: ${esc(a.responsable || a.usuario)}</div></div><span class="badge b-env">${tp} pers.</span></div></div>`;
          }).join("") : `<div class="card m" style="text-align:center">Sin reportes de asistencia para este filtro y fecha.</div>`}
        `;
      } else if (S.resumenSubTab === "ajuste") {
        const fil = filtrarRegistrosPorZonaYFundo(S.resumenAjuste);
        const allRows = [];
        fil.forEach(a => (a.filas || []).forEach(x => allRows.push(recalcularFilaAjuste(x, a.fecha))));
        const totHa = allRows.reduce((a, b) => a + b.ha, 0);
        const totJor = allRows.reduce((a, b) => a + b.jornales, 0);
        const totKg = allRows.reduce((a, b) => a + b.kilos, 0);
        const promKgHa = totHa > 0 ? Math.round(totKg / totHa) : 0;
        const promKgJor = totJor > 0 ? (totKg / totJor).toFixed(1) : "0.0";

        body.innerHTML = `
          <div class="card">
            <div class="row sp" style="margin-bottom:5px"><b>Consolidado Ajuste (${allRows.length} filas)</b><span class="badge b-env">${totKg.toLocaleString("en-US")} kg</span></div>
            <div class="row" style="gap:5px">
              <span class="badge b-new">Ha: <b>${totHa.toFixed(2)}</b></span>
              <span class="badge b-new">Kg/Ha prom: <b>${promKgHa}</b></span>
              <span class="badge b-new">Jornales: <b>${totJor}</b></span>
              <span class="badge b-auto">Kg/Jor: <b>${promKgJor}</b></span>
            </div>
          </div>
          ${allRows.length ? `
            <div class="card" style="overflow-x:auto">
              <table class="clean-tbl">
                <thead><tr><th>Fundo</th><th>Mód</th><th>Variedad</th><th>Ciclo</th><th>Ha</th><th>Kg/Ha</th><th>Jor.</th><th>Kilos</th><th>Kg/Jor</th></tr></thead>
                <tbody>
                  ${allRows.map(r => `<tr><td><b>${esc(r.fundo)}</b></td><td>${esc(r.modulo)}</td><td>${esc(r.variedad)}</td><td>${r.ciclo}</td><td>${r.ha.toFixed(2)}</td><td>${r.kgHa}</td><td>${r.jornales}</td><td style="color:var(--accent);font-weight:800">${r.kilos.toLocaleString("en-US")}</td><td>${r.kgJornales.toFixed(1)}</td></tr>`).join("")}
                </tbody>
                <tfoot>
                  <tr><td colspan="4">TOTAL AJUSTE</td><td>${totHa.toFixed(2)}</td><td>${promKgHa}</td><td>${totJor}</td><td>${totKg.toLocaleString("en-US")}</td><td>${promKgJor}</td></tr>
                </tfoot>
              </table>
            </div>
          ` : `<div class="card m" style="text-align:center">Sin reportes de Ajuste para este filtro y fecha.</div>`}
        `;
      } else {
        const fil = filtrarRegistrosPorZonaYFundo(S.resumenProy);
        const allRows = [];
        fil.forEach(a => (a.filas || []).forEach(x => allRows.push(recalcularFilaProyeccion(x, a.fecha))));
        const totHa = allRows.reduce((a, b) => a + b.ha, 0);
        const totJor = allRows.reduce((a, b) => a + b.jornales, 0);
        const totKg = allRows.reduce((a, b) => a + b.kilos, 0);
        const promKgHa = totHa > 0 ? Math.round(totKg / totHa) : 0;
        const promKgJor = totJor > 0 ? (totKg / totJor).toFixed(1) : "0.0";

        body.innerHTML = `
          <div class="card">
            <div class="row sp" style="margin-bottom:5px"><b>Consolidado Proyección (${allRows.length} filas)</b><span class="badge b-env">${totKg.toLocaleString("en-US")} kg</span></div>
            <div class="row" style="gap:5px">
              <span class="badge b-new">Ha: <b>${totHa.toFixed(2)}</b></span>
              <span class="badge b-new">Kg/Ha prom: <b>${promKgHa}</b></span>
              <span class="badge b-new">Jornales: <b>${totJor}</b></span>
              <span class="badge b-auto">Kg/Jor: <b>${promKgJor}</b></span>
            </div>
          </div>
          ${allRows.length ? `
            <div class="card" style="overflow-x:auto">
              <table class="clean-tbl">
                <thead><tr><th>Sem</th><th>Fundo</th><th>Mód</th><th>Variedad</th><th>Ciclo</th><th>Ha</th><th>Kg/Ha</th><th>Jor.</th><th>Kilos</th><th>Kg/Jor</th></tr></thead>
                <tbody>
                  ${allRows.map(r => `<tr><td>${r.semana}</td><td><b>${esc(r.fundo)}</b></td><td>${esc(r.modulo)}</td><td>${esc(r.variedad)}</td><td>${r.ciclo}</td><td>${r.ha.toFixed(2)}</td><td>${r.kgHa}</td><td>${r.jornales}</td><td style="color:var(--accent);font-weight:800">${r.kilos.toLocaleString("en-US")}</td><td>${r.kgJornales.toFixed(1)}</td></tr>`).join("")}
                </tbody>
                <tfoot>
                  <tr><td colspan="5">TOTAL PROYECCIÓN</td><td>${totHa.toFixed(2)}</td><td>${promKgHa}</td><td>${totJor}</td><td>${totKg.toLocaleString("en-US")}</td><td>${promKgJor}</td></tr>
                </tfoot>
              </table>
            </div>
          ` : `<div class="card m" style="text-align:center">Sin reportes de Proyección para este filtro y fecha.</div>`}
        `;
      }
    }

    // =========================================================================
    // VISTA 7: USUARIOS · MULTI-ZONA Y MULTI-FUNDO (SOLO ADMI)
    // =========================================================================
    function renderUsers(token = S.renderToken) {
      const pane = $("pane-users");
      if (!pane || S.activeView !== "users" || S.renderToken !== token) return;

      sincronizarZonasDesdeMaestros();
      let editingPin = null;
      let createSelectedZonas = [normText(S.zonas[0] || "TRUJILLO")];
      let createSelectedFundos = [obtenerFundosDisponibles()[0] || "LA QUEBRADA"];
      let editSelectedZonas = [];
      let editSelectedFundos = [];

      const renderMultiPicker = (containerId, allItems, selectedList, minOne, emptyMsg, onChangeCb) => {
        const el = $(containerId);
        if (!el) return;
        const merged = Array.from(new Set([...allItems, ...selectedList]));
        el.innerHTML = merged.map(val => {
          const isChecked = selectedList.includes(val);
          return `<button type="button" class="zone-pill-btn ${isChecked ? "checked" : ""}" data-mpick="${esc(val)}"><span>${isChecked ? "☑" : "☐"}</span><span>${esc(val)}</span></button>`;
        }).join("");

        el.querySelectorAll("[data-mpick]").forEach(btn => {
          btn.onclick = () => {
            const v = btn.dataset.mpick;
            const idx = selectedList.indexOf(v);
            if (idx !== -1) {
              if (minOne && selectedList.length === 1) return toast(emptyMsg);
              selectedList.splice(idx, 1);
            } else selectedList.push(v);
            renderMultiPicker(containerId, allItems, selectedList, minOne, emptyMsg, onChangeCb);
            if (onChangeCb) onChangeCb();
          };
        });
      };

      pane.innerHTML = `
        <div class="card">
          <div style="font-weight:800;font-size:13.5px;margin-bottom:4px">Zonas de operación</div>
          <div id="zonas-chips" class="row" style="margin-bottom:8px;gap:5px"></div>
          <div class="row" style="flex-wrap:nowrap">
            <input id="new-zona-in" placeholder="Nueva zona (ej. VIRÚ, PIURA...)" style="flex:1;text-transform:uppercase" />
            <button id="add-zona-btn" type="button" class="btn btn-s">+ Zona</button>
          </div>
        </div>

        <div class="card">
          <div style="font-weight:800;font-size:13.5px;margin-bottom:4px">Crear usuario (Multi-Zona y Multi-Fundo)</div>
          <div class="row" style="margin-bottom:6px">
            <input id="u-nom" placeholder="Nombre completo" style="flex:1;min-width:140px" />
            <select id="u-perf" style="width:125px">
              <option value="supervisor">Supervisor</option>
              <option value="auxiliar">Auxiliar</option>
              <option value="admi">Admi</option>
            </select>
          </div>
          <div id="u-zonas-box">
            <div class="m" style="font-size:10px;font-weight:700">Selecciona una o más zonas:</div>
            <div id="create-zonas-picker" class="zone-check-group"></div>
          </div>
          <div id="u-fundos-box">
            <div class="m" style="font-size:10px;font-weight:700">Selecciona uno o más fundos (aparecerán en su Asistencia):</div>
            <div id="create-fundos-picker" class="zone-check-group"></div>
            <div class="row" style="margin-bottom:6px;flex-wrap:nowrap">
              <input id="u-fun-extra" placeholder="Agregar otro fundo nuevo..." style="flex:1;text-transform:uppercase;font-size:11.5px" />
              <button id="u-fun-addbtn" type="button" class="btn btn-s btn-xs">+ Fundo</button>
            </div>
          </div>
          <div id="u-fun-hint" class="m" style="display:none;font-size:10.5px;margin-bottom:6px;color:var(--accent)"></div>
          <div class="row" style="flex-wrap:nowrap">
            <input id="u-pin" inputmode="numeric" maxlength="8" placeholder="PIN (4-8 dígitos)" style="flex:1" />
            <button id="u-add" type="button" class="btn">Crear usuario</button>
          </div>
        </div>

        <div id="ul"></div>
      `;

      const pintarZonasChips = () => {
        if (!$("zonas-chips")) return;
        $("zonas-chips").innerHTML = S.zonas.map((z, idx) => `
          <span class="badge b-env" style="display:inline-flex;align-items:center;gap:5px;padding:4px 8px">
            <b>${esc(normText(z))}</b>
            ${S.zonas.length > 1 ? `<button type="button" data-delzona="${idx}" style="border:0;background:transparent;color:var(--danger);font-weight:800;cursor:pointer;padding:0 2px">✕</button>` : ""}
          </span>
        `).join("");
        document.querySelectorAll("[data-delzona]").forEach(btn => {
          btn.onclick = async () => {
            const idx = Number(btn.dataset.delzona);
            const zElim = S.zonas[idx];
            S.zonas.splice(idx, 1);
            store.set(CACHE.ZONAS, S.zonas);
            await api({ accion: "guardarConfig", zonas: S.zonas });
            toast(`Zona ${zElim} eliminada`);
            renderUsers(token);
          };
        });
      };
      pintarZonasChips();

      $("add-zona-btn").onclick = async () => {
        const nueva = normText($("new-zona-in").value);
        if (!nueva) return toast("Escribe el nombre de la zona");
        if (S.zonas.some(z => normText(z) === nueva)) return toast("Esa zona ya existe");
        S.zonas.push(nueva); store.set(CACHE.ZONAS, S.zonas); $("new-zona-in").value = "";
        await api({ accion: "guardarConfig", zonas: S.zonas });
        toast(`Zona ${nueva} agregada`); renderUsers(token);
      };

      const syncCrearPerfilCampos = () => {
        const perf = $("u-perf").value;
        const zTexto = formatZonasLabel(createSelectedZonas);
        $("u-zonas-box").style.display = perf === "admi" ? "none" : "block";
        $("u-fundos-box").style.display = perf === "supervisor" ? "block" : "none";
        $("u-fun-hint").style.display = perf === "supervisor" ? "none" : "block";
        if (perf === "auxiliar") $("u-fun-hint").textContent = `✓ El Auxiliar verá únicamente Resumen consolidado de: ${zTexto}.`;
        else if (perf === "admi") $("u-fun-hint").textContent = "✓ El perfil Admi tiene acceso global a todas las zonas y fundos.";
      };

      const renderCreatePickers = () => {
        renderMultiPicker("create-zonas-picker", S.zonas.map(normText), createSelectedZonas, true, "Debe haber al menos 1 zona", syncCrearPerfilCampos);
        renderMultiPicker("create-fundos-picker", obtenerFundosDisponibles(), createSelectedFundos, true, "Selecciona al menos 1 fundo", null);
      };
      renderCreatePickers();
      $("u-perf").onchange = syncCrearPerfilCampos;
      syncCrearPerfilCampos();

      $("u-fun-addbtn").onclick = () => {
        const nuevo = $("u-fun-extra").value.trim().toUpperCase();
        if (!nuevo) return toast("Escribe el nombre del fundo");
        if (!createSelectedFundos.some(x => normFundoKey(x) === normFundoKey(nuevo))) createSelectedFundos.push(nuevo);
        $("u-fun-extra").value = "";
        renderCreatePickers();
      };

      const pintarUsuarios = () => {
        if (!$("ul") || S.activeView !== "users" || S.renderToken !== token) return;
        $("ul").innerHTML = S.users.length
          ? S.users.map(u => {
              const pNorm = normalizePerfil(u.perfil);
              const uPin = String(u.pin);
              const uZonas = parseUserZonas(u);
              const uFundos = parseUserFundos(u);
              if (editingPin === uPin) {
                return `
                  <div class="card" style="border-color:var(--accent)">
                    <div class="row sp" style="margin-bottom:6px"><span class="badge b-bor">EDITANDO USUARIO</span><button type="button" class="btn btn-s btn-xs" data-ucancel>Cancelar</button></div>
                    <div class="row" style="margin-bottom:6px">
                      <input id="ed-u-nom" value="${esc(u.nombre)}" placeholder="Nombre" style="flex:1;min-width:130px" />
                      <select id="ed-u-perf" style="width:120px">
                        <option value="supervisor" ${pNorm === "supervisor" ? "selected" : ""}>Supervisor</option>
                        <option value="auxiliar" ${pNorm === "auxiliar" ? "selected" : ""}>Auxiliar</option>
                        <option value="admi" ${pNorm === "admi" ? "selected" : ""}>Admi</option>
                      </select>
                    </div>
                    <div id="ed-u-zonas-box" style="${pNorm === "admi" ? "display:none" : ""}">
                      <div class="m" style="font-size:10px;font-weight:700">Zonas asignadas:</div>
                      <div id="edit-zonas-picker" class="zone-check-group"></div>
                    </div>
                    <div id="ed-u-fundos-box" style="${pNorm !== "supervisor" ? "display:none" : ""}">
                      <div class="m" style="font-size:10px;font-weight:700">Fundos asignados (multi-selección):</div>
                      <div id="edit-fundos-picker" class="zone-check-group"></div>
                      <div class="row" style="margin-bottom:6px;flex-wrap:nowrap">
                        <input id="ed-u-fun-extra" placeholder="Agregar otro fundo..." style="flex:1;text-transform:uppercase;font-size:11.5px" />
                        <button id="ed-u-fun-addbtn" type="button" class="btn btn-s btn-xs">+ Fundo</button>
                      </div>
                    </div>
                    <div id="ed-u-hint" class="m" style="font-size:10px;margin-bottom:6px;color:var(--accent);${pNorm === "supervisor" ? "display:none" : ""}">
                      ${pNorm === "auxiliar" ? `✓ Resumen consolidado de: ${esc(formatZonasLabel(editSelectedZonas))}` : "✓ Acceso global Admi"}
                    </div>
                    <div class="row" style="flex-wrap:nowrap">
                      <input id="ed-u-pin" inputmode="numeric" maxlength="8" value="${esc(uPin)}" placeholder="PIN" style="flex:1;font-family:monospace;font-weight:800" />
                      <button type="button" class="btn" data-usave="${esc(uPin)}">Guardar</button>
                    </div>
                  </div>
                `;
              }
              const detalleFundo = pNorm === "auxiliar" ? "Resumen consolidado de sus zonas" : (pNorm === "admi" ? "Acceso Global" : `Fundos: <b>${esc(formatFundosLabel(uFundos))}</b>`);
              return `
                <div class="card">
                  <div class="row sp" style="flex-wrap:nowrap;gap:6px">
                    <div style="min-width:0;flex:1">
                      <div class="row" style="gap:5px"><b style="font-size:13px">${esc(u.nombre)}</b><span class="role-chip">${perfilLabel(pNorm)}</span></div>
                      <div class="row" style="gap:4px;margin-top:4px">${pNorm === "admi" ? `<span class="badge b-auto">TODAS LAS ZONAS</span>` : uZonas.map(z => `<span class="badge b-env">${esc(z)}</span>`).join("")}</div>
                      <div class="m" style="margin-top:4px">${detalleFundo} · PIN: <b style="color:var(--text)">${esc(u.pin)}</b></div>
                    </div>
                    <div class="row" style="flex-shrink:0">
                      <button type="button" class="btn btn-s btn-xs" data-uedit="${esc(u.pin)}">Editar</button>
                      <button type="button" class="btn btn-d btn-xs" data-udel="${esc(u.pin)}">Eliminar</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")
          : `<div class="card m">Aún no hay usuarios creados.</div>`;

        document.querySelectorAll("[data-uedit]").forEach(b => {
          b.onclick = () => {
            editingPin = b.dataset.uedit;
            const target = S.users.find(x => String(x.pin) === editingPin);
            editSelectedZonas = parseUserZonas(target);
            editSelectedFundos = parseUserFundos(target);
            if (!editSelectedFundos.length) editSelectedFundos = [obtenerFundosDisponibles()[0] || "LA QUEBRADA"];
            pintarUsuarios();
          };
        });
        document.querySelectorAll("[data-ucancel]").forEach(b => { b.onclick = () => { editingPin = null; pintarUsuarios(); }; });

        if ($("ed-u-perf")) {
          const syncEditFields = () => {
            const p = $("ed-u-perf").value;
            const zTxt = formatZonasLabel(editSelectedZonas);
            $("ed-u-zonas-box").style.display = p === "admi" ? "none" : "block";
            $("ed-u-fundos-box").style.display = p === "supervisor" ? "block" : "none";
            $("ed-u-hint").style.display = p === "supervisor" ? "none" : "block";
            if (p === "auxiliar") $("ed-u-hint").textContent = `✓ Resumen consolidado de: ${zTxt}`;
            else if (p === "admi") $("ed-u-hint").textContent = "✓ Acceso global Admi";
          };
          const renderEditPickers = () => {
            renderMultiPicker("edit-zonas-picker", S.zonas.map(normText), editSelectedZonas, true, "Debe haber al menos 1 zona", syncEditFields);
            renderMultiPicker("edit-fundos-picker", obtenerFundosDisponibles(), editSelectedFundos, true, "Selecciona al menos 1 fundo", null);
          };
          renderEditPickers();
          $("ed-u-perf").onchange = syncEditFields;
          if ($("ed-u-fun-addbtn")) {
            $("ed-u-fun-addbtn").onclick = () => {
              const nv = $("ed-u-fun-extra").value.trim().toUpperCase();
              if (!nv) return toast("Escribe el fundo");
              if (!editSelectedFundos.some(x => normFundoKey(x) === normFundoKey(nv))) editSelectedFundos.push(nv);
              $("ed-u-fun-extra").value = "";
              renderEditPickers();
            };
          }
        }

        document.querySelectorAll("[data-usave]").forEach(b => {
          b.onclick = async () => {
            const pinOriginal = b.dataset.usave;
            const nombre = $("ed-u-nom").value.trim();
            const perfil = $("ed-u-perf").value;
            const zonasArr = perfil === "admi" ? ["TODAS"] : parseUserZonas(editSelectedZonas);
            const zona = formatZonasLabel(zonasArr);
            const fundosArr = perfil === "supervisor" ? parseUserFundos(editSelectedFundos) : (perfil === "auxiliar" ? ["TODOS"] : [MASTER_FUNDO]);
            const fundo = perfil === "supervisor" ? formatFundosLabel(fundosArr) : (perfil === "auxiliar" ? "TODOS" : MASTER_FUNDO);
            const nuevoPin = $("ed-u-pin").value.trim();
            if (!nombre || !nuevoPin) return toast("Completa nombre y PIN");
            if (perfil === "supervisor" && !fundosArr.length) return toast("Selecciona al menos 1 fundo");
            if (nuevoPin === MASTER_PIN || S.users.some(x => String(x.pin) === nuevoPin && String(x.pin) !== pinOriginal)) return toast("PIN duplicado o inválido");
            const idx = S.users.findIndex(x => String(x.pin) === pinOriginal);
            if (idx !== -1) {
              S.users[idx] = { nombre, perfil, zona, zonas: zonasArr, fundo, fundos: fundosArr, pin: nuevoPin };
              sincronizarZonasDesdeMaestros(); store.set(CACHE.USERS, S.users);
            }
            editingPin = null; renderUsers(token);
            await api({ accion: "editarUsuario", pinOriginal, pinAnterior: pinOriginal, nombre, perfil, zona, zonas: zonasArr, fundo, fundos: fundosArr, nuevoPin });
            toast("Usuario actualizado");
          };
        });

        document.querySelectorAll("[data-udel]").forEach(b => {
          b.onclick = async () => {
            const ok = await confirmar("¿Eliminar usuario?", `Se revocará el acceso al PIN ${b.dataset.udel}.`, "Eliminar", true);
            if (!ok) return;
            await api({ accion: "eliminarUsuario", pinEliminar: b.dataset.udel });
            S.users = S.users.filter(x => String(x.pin) !== String(b.dataset.udel));
            store.set(CACHE.USERS, S.users);
            toast("Usuario eliminado"); pintarUsuarios();
          };
        });
      };

      $("u-add").onclick = async () => {
        const nombre = $("u-nom").value.trim();
        const perfil = $("u-perf").value;
        const zonasArr = perfil === "admi" ? ["TODAS"] : parseUserZonas(createSelectedZonas);
        const zona = formatZonasLabel(zonasArr);
        const fundosArr = perfil === "supervisor" ? parseUserFundos(createSelectedFundos) : (perfil === "auxiliar" ? ["TODOS"] : [MASTER_FUNDO]);
        const fundo = perfil === "supervisor" ? formatFundosLabel(fundosArr) : (perfil === "auxiliar" ? "TODOS" : MASTER_FUNDO);
        const nuevoPin = $("u-pin").value.trim();
        if (!nombre || !nuevoPin) return toast("Completa nombre y PIN");
        if (perfil === "supervisor" && !fundosArr.length) return toast("Selecciona al menos 1 fundo");
        if (nuevoPin === MASTER_PIN || S.users.some(x => String(x.pin) === nuevoPin)) return toast("PIN ya registrado");
        await api({ accion: "crearUsuario", nombre, perfil, zona, zonas: zonasArr, fundo, fundos: fundosArr, nuevoPin });
        S.users.push({ nombre, perfil, zona, zonas: zonasArr, fundo, fundos: fundosArr, pin: nuevoPin });
        sincronizarZonasDesdeMaestros(); store.set(CACHE.USERS, S.users);
        $("u-nom").value = ""; $("u-pin").value = "";
        toast("Usuario creado"); renderUsers(token);
      };

      pintarUsuarios();
    }

    // =========================================================================
    // VISTA 8: MAESTROS (LABORES, CICLOS HOJA 2, FORMATOS, DESTINOS, PERSONAL)
    // =========================================================================
    function renderDatos() {
      const pane = $("pane-datos");
      if (!pane || S.activeView !== "datos") return;

      const tabs = [
        { id: "labores", label: "Labores" },
        { id: "ciclos", label: "Ciclos (Hoja 2)" },
        { id: "formatos", label: "Formatos" },
        { id: "destinos", label: "Destinos" },
        { id: "personal", label: "Personal" }
      ];

      pane.innerHTML = `
        <div class="card">
          <div class="row" style="gap:5px">
            ${tabs.map(t => `<button type="button" class="btn btn-xs ${S.maestroSubTab === t.id ? "" : "btn-s"}" data-msub="${t.id}">${t.label}</button>`).join("")}
          </div>
        </div>
        <div id="maestro-body"></div>
      `;

      pane.querySelectorAll("[data-msub]").forEach(b => { b.onclick = () => { S.maestroSubTab = b.dataset.msub; renderDatos(); }; });
      const body = $("maestro-body");

      if (S.maestroSubTab === "labores") {
        body.innerHTML = `
          <div class="card">
            <div class="row sp" style="margin-bottom:8px"><b>Maestro de Labores</b><button id="btn-save-labs" type="button" class="btn btn-xs">Guardar</button></div>
            <div class="row" style="margin-bottom:8px;flex-wrap:nowrap">
              <input id="new-lab-cod" placeholder="Código" style="width:90px" />
              <input id="new-lab-nom" placeholder="Nombre de labor" style="flex:1" />
              <button id="btn-add-lab" type="button" class="btn btn-s">+ Añadir</button>
            </div>
            <div id="labs-list"></div>
          </div>
        `;
        const pintarLabs = () => {
          $("labs-list").innerHTML = S.L.map((l, idx) => `
            <div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--row-border);flex-wrap:nowrap;gap:5px">
              <input value="${esc(l.codigo)}" data-lcod="${idx}" style="width:74px;padding:5px 7px;font-size:12px;font-weight:700" />
              <input value="${esc(l.nombre)}" data-lnom="${idx}" style="flex:1;padding:5px 7px;font-size:12px" />
              <button type="button" class="btn btn-s btn-xs" data-lup="${idx}" ${idx === 0 ? "disabled" : ""}>↑</button>
              <button type="button" class="btn btn-s btn-xs" data-ldn="${idx}" ${idx === S.L.length - 1 ? "disabled" : ""}>↓</button>
              <button type="button" class="btn btn-d btn-xs" data-ldel="${idx}">✕</button>
            </div>
          `).join("");
          $("labs-list").querySelectorAll("[data-lcod]").forEach(i => { i.oninput = e => { S.L[Number(e.target.dataset.lcod)].codigo = e.target.value.trim(); }; });
          $("labs-list").querySelectorAll("[data-lnom]").forEach(i => { i.oninput = e => { S.L[Number(e.target.dataset.lnom)].nombre = e.target.value.trim().toUpperCase(); }; });
          $("labs-list").querySelectorAll("[data-lup]").forEach(b => { b.onclick = () => { const i = Number(b.dataset.lup); if (i > 0) { [S.L[i - 1], S.L[i]] = [S.L[i], S.L[i - 1]]; pintarLabs(); } }; });
          $("labs-list").querySelectorAll("[data-ldn]").forEach(b => { b.onclick = () => { const i = Number(b.dataset.ldn); if (i < S.L.length - 1) { [S.L[i], S.L[i + 1]] = [S.L[i + 1], S.L[i]]; pintarLabs(); } }; });
          $("labs-list").querySelectorAll("[data-ldel]").forEach(b => { b.onclick = () => { S.L.splice(Number(b.dataset.ldel), 1); pintarLabs(); }; });
        };
        pintarLabs();
        $("btn-add-lab").onclick = () => {
          const cod = $("new-lab-cod").value.trim(), nom = $("new-lab-nom").value.trim().toUpperCase();
          if (!cod || !nom) return toast("Ingresa código y nombre");
          S.L.push({ codigo: cod, nombre: nom }); $("new-lab-cod").value = ""; $("new-lab-nom").value = ""; pintarLabs();
        };
        $("btn-save-labs").onclick = async () => { store.set(CACHE.LABORES, S.L); await api({ accion: "cargarLabores", labores: S.L }); toast("Labores guardadas"); };
      } else if (S.maestroSubTab === "ciclos") {
        body.innerHTML = `
          <div class="card">
            <div class="row sp" style="margin-bottom:6px">
              <div><b>Maestro de Ciclos (${S.ciclos.length})</b><div class="m" style="font-size:10.5px">Define los Fundos, Zonas, Módulos y Variedades reales</div></div>
              <div class="row" style="gap:5px">
                <label for="cic-file" class="btn btn-s btn-xs">📥 Subir Excel</label>
                <input type="file" id="cic-file" accept=".xlsx,.xls,.csv" style="display:none" />
                <button id="btn-save-cic" type="button" class="btn btn-xs">Guardar</button>
              </div>
            </div>
            <div class="row" style="margin-bottom:8px;gap:5px">
              <input id="nc-zona" placeholder="Zona" style="width:82px;text-transform:uppercase" />
              <input id="nc-fundo" placeholder="Fundo" style="flex:1;min-width:90px;text-transform:uppercase" />
              <input id="nc-mod" placeholder="Mód" style="width:52px" />
              <input id="nc-var" placeholder="Variedad" style="width:90px" />
              <input id="nc-cic" type="number" step="0.1" placeholder="Ciclo" style="width:62px" />
              <button id="btn-add-cic" type="button" class="btn btn-s btn-xs">+</button>
            </div>
            <div style="max-height:340px;overflow-y:auto">
              <table class="clean-tbl">

                <tbody id="cic-tbody"></tbody>
              </table>
            </div>
          </div>

        const pintarCiclos = () => {
          $("cic-tbody").innerHTML = S.ciclos.map((c, idx) => `
            <tr><td>${esc(c.zona)}</td><td><b>${esc(c.fundo)}</b></td><td>${esc(c.modulo)}</td><td>${esc(c.variedad)}</td><td style="color:var(--accent);font-weight:800">${c.ciclo}</td><td><button type="button" class="btn btn-d btn-xs" data-cdel="${idx}">✕</button></td></tr>
          `).join("");
          $("cic-tbody").querySelectorAll("[data-cdel]").forEach(b => { b.onclick = () => { S.ciclos.splice(Number(b.dataset.cdel), 1); pintarCiclos(); }; });
        };
        pintarCiclos();
        $("btn-add-cic").onclick = () => {
          const z = normText($("nc-zona").value || S.zonas[0] || "TRUJILLO");
          const f = $("nc-fundo").value.trim().toUpperCase();
          const m = $("nc-mod").value.trim();
          const v = $("nc-var").value.trim();
          const c = $("nc-cic").value.trim() || "0";
          if (!f || !m || !v) return toast("Completa fundo, módulo y variedad");
          S.ciclos.unshift({ clave: `${f}${m}${v}`, zona: z, fundo: f, variedad: v, modulo: m, area: 0, ciclo: c });
          sincronizarZonasDesdeMaestros();
          $("nc-fundo").value = ""; $("nc-mod").value = ""; $("nc-var").value = ""; $("nc-cic").value = "";
          pintarCiclos();
        };
        $("cic-file").onchange = async e => {
          const f = e.target.files[0];
          if (!f) return;
          try {
            const matriz = await leerArchivoComoMatriz(f);
            const nuevos = [];
            let idxZona = -1, idxFundo = -1, idxVar = -1, idxMod = -1, idxArea = -1, idxCiclo = -1, idxClave = -1;
            matriz.forEach((row, idx) => {
              const c = row.map(v => String(v ?? "").trim());
              if (!c.some(Boolean)) return;
              const normCols = c.map(normText);
              if (idx === 0 && (normCols.some(x => x.includes("FUNDO")) || normCols.some(x => x.includes("VARIEDAD")) || normCols.some(x => x.includes("CICLO")))) {
                idxClave = normCols.findIndex(x => x.includes("CLAVE"));
                idxZona = normCols.findIndex(x => x.includes("ZONA"));
                idxFundo = normCols.findIndex(x => x.includes("FUNDO"));
                idxVar = normCols.findIndex(x => x.includes("VARIEDAD"));
                idxMod = normCols.findIndex(x => x.includes("MODULO"));
                idxArea = normCols.findIndex(x => x.includes("AREA"));
                idxCiclo = normCols.findIndex(x => x.includes("CICLO"));
                return;
              }
              if (idxFundo !== -1 && idxVar !== -1) {
                const fundoVal = String(c[idxFundo] || "").trim().toUpperCase();
                const varVal = String(c[idxVar] || "").trim();
                const modVal = idxMod !== -1 ? String(c[idxMod] || "").trim() : "1";
                const zonaVal = idxZona !== -1 ? normText(c[idxZona] || "TRUJILLO") : "TRUJILLO";
                const areaVal = idxArea !== -1 ? (Number(c[idxArea]) || 0) : 0;
                const cicloVal = idxCiclo !== -1 ? String(c[idxCiclo] || "0").trim() : "0";
                const claveVal = idxClave !== -1 ? String(c[idxClave] || "") : `${fundoVal}${modVal}${varVal}`;
                if (fundoVal && varVal) nuevos.push({ clave: claveVal, zona: zonaVal, fundo: fundoVal, variedad: varVal, modulo: modVal, area: areaVal, ciclo: cicloVal });
              } else if (c.length >= 7) {
                const fundoVal = String(c[2] || "").trim().toUpperCase();
                const varVal = String(c[3] || "").trim();
                if (fundoVal && varVal) nuevos.push({ clave: c[0], zona: normText(c[1] || "TRUJILLO"), fundo: fundoVal, variedad: varVal, modulo: String(c[4] || "1").trim(), area: Number(c[5]) || 0, ciclo: String(c[6] || "0").trim() });
              } else if (c.length >= 4) {
                const fundoVal = String(c[0] || "").trim().toUpperCase();
                if (fundoVal) nuevos.push({ clave: `${fundoVal}${c[1]}${c[2]}`, zona: "TRUJILLO", fundo: fundoVal, modulo: String(c[1] || "1").trim(), variedad: String(c[2] || "").trim(), area: 0, ciclo: String(c[3] || "0").trim() });
              }
            });
            if (!nuevos.length) return toast("No se detectaron ciclos válidos");
            S.ciclos = nuevos; sincronizarZonasDesdeMaestros();
            store.set(CACHE.CICLOS, S.ciclos); store.set(CACHE.ZONAS, S.zonas);
            pintarCiclos();
            await api({ accion: "guardarConfig", ciclos: S.ciclos, zonas: S.zonas });
            toast(`✓ ${nuevos.length} ciclos y ${obtenerFundosDisponibles().length} fundos actualizados`);
          } catch (err) { toast(err.message || "Error al leer Excel"); }
          e.target.value = "";
        };
        $("btn-save-cic").onclick = async () => {
          sincronizarZonasDesdeMaestros(); store.set(CACHE.CICLOS, S.ciclos); store.set(CACHE.ZONAS, S.zonas);

        body.innerHTML = `

    function descargarExcelDesdeMatriz(matriz, fileName, sheetName = "Reporte") {
      if (window.XLSX) {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(matriz);
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
        XLSX.writeFile(wb, fileName);
        toast("Excel descargado");
      } else {
        const csv = "\uFEFF" + matriz.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName.replace(/\.xlsx$/i, ".csv");
        a.click();
        toast("Archivo CSV descargado");
      }
    }

    function exportarAsistenciaExcel(filas, baseName) {
      const rows = [["Fundo", "Grupo", "Supervisor", "Cosecha", "Sup. Ciclo", "Sup. Cuadrilla", "Jabero", "Limpieza", "Riego", "Otros", "Total"]];
      let sc = 0, ssc = 0, ssq = 0, sj = 0, sl = 0, sr = 0, so = 0, st = 0;
      (filas || []).forEach(r => {
        const tf = totalFilaAsis(r);
        sc += Number(r.cosecha) || 0; ssc += Number(r.supCiclo) || 0; ssq += Number(r.supCuadrilla) || 0;
        sj += Number(r.jabero) || 0; sl += Number(r.limpieza) || 0; sr += Number(r.riego) || 0; so += Number(r.otros) || 0; st += tf;
        rows.push([r.fundo || "", r.grupo || "", r.supervisor || "", Number(r.cosecha) || 0, Number(r.supCiclo) || 0, Number(r.supCuadrilla) || 0, Number(r.jabero) || 0, Number(r.limpieza) || 0, Number(r.riego) || 0, Number(r.otros) || 0, tf]);
      });
      rows.push(["TOTAL", "", "", sc, ssc, ssq, sj, sl, sr, so, st]);
      descargarExcelDesdeMatriz(rows, `${baseName}.xlsx`, "Distribucion");
    }

    function exportarAjusteExcel(filas, baseName) {
      const rows = [["Semana", "Fecha", "Tipo", "Fundo", "Módulo", "Variedad", "Ciclo", "Responsable", "Formato", "Destino", "Días de Reingreso", "Ha", "Kg/Ha", "Jornales", "Kilos", "Kg/Jornales"]];
      let totHa = 0, totJor = 0, totKg = 0;
