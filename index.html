        totHa += c.ha; totJor += c.jornales; totKg += c.kilos;
        rows.push([c.semana, formatFechaSlash(c.fecha), "Cosecha", c.fundo, c.modulo, c.variedad, c.ciclo, "", "", c.diasReingreso, c.ha, c.kgHa, c.jornales, c.kilos, c.kgJornales]);
      });
      const promKgHa = totHa > 0 ? Math.round(totKg / totHa) : 0;
      const promKgJor = totJor > 0 ? Number((totKg / totJor).toFixed(1)) : 0;
      rows.push(["TOTAL", "", "", "", "", "", "", "", "", "", Number(totHa.toFixed(2)), promKgHa, totJor, totKg, promKgJor]);
      descargarExcelDesdeMatriz(rows, `${baseName}.xlsx`, "Proyeccion");
    }

    function exportarTablaGenImagen(titulo, subtitulo, headers, bodyRows, fileName, totalRow = null) {
      const scale = 3;
      const colWidths = headers.map((h, ci) => {
        let maxLen = String(h).length;
        bodyRows.forEach(r => { maxLen = Math.max(maxLen, String(r[ci] ?? "").length); });
        if (totalRow) maxLen = Math.max(maxLen, String(totalRow[ci] ?? "").length);
        return Math.max(58, Math.min(200, maxLen * 9 + 22));
      });
      const pad = 22;
      const w = Math.max(560, colWidths.reduce((a, b) => a + b, 0) + pad * 2);
      const rowH = 30, headH = 34, topH = 66, footH = totalRow ? 34 : 0;
      const h = topH + headH + Math.max(1, bodyRows.length) * rowH + footH + pad;

      const c = document.createElement("canvas");
      c.width = w * scale; c.height = h * scale;
      const ctx = c.getContext("2d");
      ctx.scale(scale, scale);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, w, topH - 6);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 17px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(titulo, pad, 27);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "12px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(subtitulo, pad, 47);

      let x = pad, y = topH;
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(pad, y, w - pad * 2, headH);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px -apple-system, BlinkMacSystemFont, sans-serif";
      headers.forEach((hd, ci) => {
        ctx.fillText(String(hd), x + 8, y + 21);
        x += colWidths[ci];
      });

      y += headH;
      ctx.font = "11.5px -apple-system, BlinkMacSystemFont, sans-serif";
      bodyRows.forEach((r, ri) => {
        ctx.fillStyle = ri % 2 === 0 ? "#f8fafc" : "#ffffff";
        ctx.fillRect(pad, y, w - pad * 2, rowH);
        ctx.strokeStyle = "#e2e8f0";
        ctx.strokeRect(pad, y, w - pad * 2, rowH);
        let cx = pad;
        r.forEach((cell, ci) => {
          ctx.fillStyle = "#0f172a";
          ctx.fillText(String(cell ?? ""), cx + 8, y + 19);
          cx += colWidths[ci];
        });
        y += rowH;
      });

      if (totalRow) {
        ctx.fillStyle = "#dbeafe";
        ctx.fillRect(pad, y, w - pad * 2, footH);
        ctx.strokeStyle = "#2563eb";
        ctx.strokeRect(pad, y, w - pad * 2, footH);
        let cx = pad;
        ctx.font = "bold 11.5px -apple-system, BlinkMacSystemFont, sans-serif";
        totalRow.forEach((cell, ci) => {
          ctx.fillStyle = "#1e3a8a";
          ctx.fillText(String(cell ?? ""), cx + 8, y + 21);
          cx += colWidths[ci];
        });
      }

      abrirModalImagen(titulo, c.toDataURL("image/png"), fileName);
    }

    function exportarAsistenciaImagen(fecha, subtitulo, filas) {
      const headers = ["Fundo", "Grp", "Supervisor", "Cos.", "S.Cic", "S.Cua", "Jab.", "Lim.", "Rie.", "Otr.", "Total"];
      let sc = 0, ssc = 0, ssq = 0, sj = 0, sl = 0, sr = 0, so = 0, st = 0;
      const bodyRows = (filas || []).map(r => {
        const tf = totalFilaAsis(r);
        sc += Number(r.cosecha) || 0; ssc += Number(r.supCiclo) || 0; ssq += Number(r.supCuadrilla) || 0;
        sj += Number(r.jabero) || 0; sl += Number(r.limpieza) || 0; sr += Number(r.riego) || 0; so += Number(r.otros) || 0; st += tf;
        return [r.fundo || "", r.grupo || "", r.supervisor || "", Number(r.cosecha) || 0, Number(r.supCiclo) || 0, Number(r.supCuadrilla) || 0, Number(r.jabero) || 0, Number(r.limpieza) || 0, Number(r.riego) || 0, Number(r.otros) || 0, tf];
      });
      const totalRow = ["TOTAL", "", "", sc, ssc, ssq, sj, sl, sr, so, st];
      exportarTablaGenImagen(`Distribución Cosecha · ${fecha}`, subtitulo, headers, bodyRows, `Distribucion_${fecha}.png`, totalRow);
    }

    function exportarAjusteImagen(fecha, subtitulo, filas) {
      const headers = ["Sem", "Fundo", "Mód", "Variedad", "Ciclo", "Fmt", "Dst", "Ha", "Kg/Ha", "Jor.", "Kilos", "Kg/J"];
      let totHa = 0, totJor = 0, totKg = 0;
      const bodyRows = (filas || []).map(raw => {
        const c = recalcularFilaAjuste(raw, fecha);
        totHa += c.ha; totJor += c.jornales; totKg += c.kilos;
        return [c.semana, c.fundo, c.modulo, c.variedad, c.ciclo, c.formato, c.destino, c.ha.toFixed(2), c.kgHa, c.jornales, c.kilos.toLocaleString("en-US"), c.kgJornales.toFixed(1)];
      });
      const promKgHa = totHa > 0 ? Math.round(totKg / totHa) : 0;
      const promKgJor = totJor > 0 ? (totKg / totJor).toFixed(1) : "0.0";
      const totalRow = ["TOT", "", "", "", "", "", "", totHa.toFixed(2), promKgHa, totJor, totKg.toLocaleString("en-US"), promKgJor];
      exportarTablaGenImagen(`Reporte de Ajuste · ${fecha}`, subtitulo, headers, bodyRows, `Ajuste_${fecha}.png`, totalRow);
    }

    function exportarProyeccionImagen(fecha, subtitulo, filas) {
      const headers = ["Sem", "Fundo", "Mód", "Variedad", "Ciclo", "D.Reing", "Ha", "Kg/Ha", "Jor.", "Kilos", "Kg/J"];
      let totHa = 0, totJor = 0, totKg = 0;
      const bodyRows = (filas || []).map(raw => {
        const c = recalcularFilaProyeccion(raw, fecha);
        totHa += c.ha; totJor += c.jornales; totKg += c.kilos;
        return [c.semana, c.fundo, c.modulo, c.variedad, c.ciclo, c.diasReingreso, c.ha.toFixed(2), c.kgHa, c.jornales, c.kilos.toLocaleString("en-US"), c.kgJornales.toFixed(1)];
      });
      const promKgHa = totHa > 0 ? Math.round(totKg / totHa) : 0;
      const promKgJor = totJor > 0 ? (totKg / totJor).toFixed(1) : "0.0";
      const totalRow = ["TOT", "", "", "", "", "", totHa.toFixed(2), promKgHa, totJor, totKg.toLocaleString("en-US"), promKgJor];
      exportarTablaGenImagen(`Reporte de Proyección · ${fecha}`, subtitulo, headers, bodyRows, `Proyeccion_${fecha}.png`, totalRow);
    }

    // =========================================================================
    // ARRANQUE INMEDIATO EN 0 MS + CARGA DIFERIDA DE SHEETJS

    actualizarBotonesModo();
    bindLoginEvents();

    $("mode-demo").onclick = () => { S.demo = true; store.setRaw(CACHE.DEMO, "1"); actualizarBotonesModo(); toast("Modo Demo Local activado"); };

    programarCargaFondo();

    window.addEventListener("load", () => {
      setTimeout(() => {
        if (!window.XLSX) {
          const s = document.createElement("script");
          s.src = "https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js";
          s.async = true;
          document.head.appendChild(s);
        }
      }, 220);
    });
  </script>
