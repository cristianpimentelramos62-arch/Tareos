                        </thead>
                        <tbody>
                          ${t.filas.map(x => {
                            const sinC = String(x.nombres || "").toUpperCase().includes("NO TIENE CONTRATO");
                            return `
                              <tr>
                                <td style="font-family:monospace;font-weight:700;color:#6ee7b7">${esc(x.codigo)}</td>
                                <td style="font-family:monospace">${esc(x.dni)}</td>
                                <td style="font-weight:600;${sinC ? "color:#f87171" : ""}">${esc(x.nombres)}</td>
                                <td>${esc(x.labor)}</td>
                                <td style="font-weight:700">${esc(fundoRow)}</td>
                                <td style="text-align:right;font-weight:700">${x.horas}</td>
                              </tr>
                            `;
                          }).join("")}
                        </tbody>
                      </table>
                    </div>
                  </details>
                </div>
              `;
            }).join("")
          : `<div class="card m">Ningún fundo ha enviado tareo en esta fecha.</div>`;

        $("rs").innerHTML = kpiHtml + borHtml + listHtml;

        document.querySelectorAll("[data-re]").forEach(b => {
          b.onclick = async () => {
            const ok = await confirmar("¿Reabrir tareo?", `El tareo de ${b.dataset.re} volverá a estado borrador.`);
            if (!ok) return;
            await api({ accion: "reabrirTareo", fecha: S.fecha, fundo: b.dataset.re, targetPin: b.dataset.p });
            toast("Devuelto a borrador");
            fetchResumen(true);
          };
        });

        document.querySelectorAll("[data-delenv]").forEach(b => {
          b.onclick = async () => {
            const borrado = await borrarTareoEnviadoAccion(S.fecha, b.dataset.delenv, b.dataset.p);
            if (borrado) fetchResumen(true);
          };
        });
      };

      const fetchResumen = async (showSpinnerIfEmpty = false) => {
        const fechaSel = $("f-res").value;
        S.fecha = fechaSel;
        const k = `${CACHE.RESUMEN_PREFIX}${S.demo ? "demo" : "live"}_${S.fecha}`;
        const c = store.get(k, null);
        if (c) {
          S.resumen = c.data || [];
          S.borradores = c.borradores || [];
          S.asisResumen = c.asistencia || [];
          S.asisBorradoresList = c.asistenciaBorradores || [];
          pintarResumen();
        } else if (showSpinnerIfEmpty && $("rs")) {
          $("rs").innerHTML = `<div class="card m">Cargando resumen...</div>`;
        }

        const r = await api({ accion: "resumen", fecha: S.fecha });
        if (S.fecha !== fechaSel || S.activeTab !== "resumen" || S.renderToken !== token) return;
        if (r && r.ok) {
          S.resumen = r.data || [];
          S.borradores = r.borradores || [];
          S.asisResumen = r.asistencia || (c ? c.asistencia : []) || [];
          S.asisBorradoresList = r.asistenciaBorradores || (c ? c.asistenciaBorradores : []) || [];
          store.set(k, {
            data: S.resumen,
            borradores: S.borradores,
            asistencia: S.asisResumen,
            asistenciaBorradores: S.asisBorradoresList
          });
          pintarResumen();
        }
      };

      $("sub-t").onclick = () => {
        S.resumenSubTab = "tareos";
        $("sub-t").className = "active";
        $("sub-a").className = "";
        pintarResumen();
      };

      $("sub-a").onclick = () => {
        S.resumenSubTab = "asistencia";
        $("sub-a").className = "active";
        $("sub-t").className = "";
        pintarResumen();
      };

      $("btn-img-res").onclick = () => {
        if (S.resumenSubTab === "asistencia") {
          const allFilas = [];
          (S.asisResumen || []).forEach(t => {
            (t.filas || []).forEach(f => allFilas.push({ ...f, fundo: f.fundo || t.fundo || MASTER_FUNDO }));
          });
          if (!allFilas.length) return toast("Sin asistencia enviada para exportar");
          exportarDistribucionImagen(S.fecha, "RESUMEN MAESTRO", "CONSOLIDADO", allFilas);
        } else {
          toast("Usa Excel para exportar el consolidado de tareos");
        }
      };

      $("btn-rf").onclick = () => fetchResumen(true);
      $("f-res").onchange = () => fetchResumen(true);
      $("btn-csv").onclick = () => {
        if (!S.resumen.length) return toast("Sin datos enviados para descargar");
        if (typeof XLSX !== "undefined") {
          const rows = [["C.LABOR", "DNI", "NOMBRES", "LABOR", "FUNDO", "HORAS"]];
          S.resumen.forEach(t => {
            const f = t.fundo || MASTER_FUNDO;
            t.filas.forEach(x => rows.push([x.codigo, x.dni, x.nombres, x.labor, f, Number(x.horas) || 0]));
          });
          const ws = XLSX.utils.aoa_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Consolidado");
          XLSX.writeFile(wb, `Tareo_${S.fecha}.xlsx`);
          return;
        }
        const q = s => '"' + String(s ?? "").replace(/"/g, '""') + '"';
        const rows = ["C.LABOR,DNI,NOMBRES,LABOR,FUNDO,HORAS"];
        S.resumen.forEach(t => {
          const f = t.fundo || MASTER_FUNDO;
          t.filas.forEach(x => rows.push([x.codigo, x.dni, q(x.nombres), q(x.labor), q(f), x.horas].join(",")));
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv;charset=utf-8;" }));
        a.download = `Tareo_${S.fecha}.csv`;
        a.click();
      };

      fetchResumen(!cached);
    }

    // =========================================================================
    // VISTA MAESTRO: CREAR USUARIOS POR FUNDO
    // =========================================================================
    async function renderUsers(token = S.renderToken) {
      const pane = $("pane-users");
      if (!pane || S.activeTab !== "users" || S.renderToken !== token) return;

      pane.innerHTML = `
        <div class="card">
          <div style="font-weight:800;margin-bottom:6px">Crear usuario por fundo</div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <input id="u-nom" placeholder="Nombre responsable (ej. Nayely Calderon)" />
            <div class="row" style="flex-wrap:nowrap">
              <input id="u-fun" placeholder="Fundo (ej. QUEBRADA)" style="flex:1;text-transform:uppercase" />
              <input id="u-pin" inputmode="numeric" maxlength="8" placeholder="PIN (4-8 díg.)" style="width:115px" />
            </div>
            <button id="u-add" type="button" class="btn">Crear usuario</button>
          </div>
        </div>
        <div class="card">
          <div style="font-weight:800;margin-bottom:4px">Usuarios activos</div>
          <div id="u-list" class="m">Cargando...</div>
        </div>
      `;

      const pintarUsuarios = () => {
        if (!$("u-list") || S.activeTab !== "users" || S.renderToken !== token) return;
        $("u-list").innerHTML = S.users.length
          ? S.users.map(u => `
              <div class="row sp" style="padding:7px 0;border-bottom:1px solid var(--border)">
                <div style="min-width:0;flex:1">
                  <b>${esc(u.nombre || "Responsable")}</b> · <b style="color:#6ee7b7">${esc(u.fundo)}</b>
                  <div class="m">PIN: <code>${esc(u.pin)}</code></div>
                </div>
                <button type="button" class="btn btn-d btn-xs" data-del="${esc(u.pin)}">Eliminar</button>
              </div>
            `).join("")
          : "Aún no hay usuarios creados.";

        document.querySelectorAll("[data-del]").forEach(b => {
          b.onclick = async () => {
            const pinDel = b.dataset.del;
            const ok = await confirmar("¿Eliminar usuario?", `Se revocará el PIN ${pinDel}.`, "Eliminar", true);
            if (!ok) return;
            S.users = S.users.filter(u => String(u.pin) !== String(pinDel));
            store.set(CACHE.USERS, S.users);
            pintarUsuarios();
            await api({ accion: "eliminarUsuario", pinEliminar: pinDel });
            toast("Usuario eliminado");
          };
        });
      };

      const listar = async () => {
        if (S.users.length) pintarUsuarios();
        const r = await api({ accion: "listarUsuarios" });
        if (S.activeTab !== "users" || S.renderToken !== token) return;
        if (r && r.ok && Array.isArray(r.data)) {
          S.users = r.data;
          store.set(CACHE.USERS, S.users);
          pintarUsuarios();
        }
      };

      $("u-add").onclick = async () => {
        const nombre = $("u-nom").value.trim();
        const fundo = $("u-fun").value.trim().toUpperCase();
        const nuevoPin = $("u-pin").value.trim();
        if (!nombre || !fundo || !nuevoPin) return toast("Completa nombre, fundo y PIN");
        if (S.users.some(u => String(u.pin) === nuevoPin) || nuevoPin === MASTER_PIN) {
          return toast("Ese PIN ya está en uso");
        }

        S.users.push({ nombre, fundo, pin: nuevoPin });
        store.set(CACHE.USERS, S.users);
        $("u-nom").value = "";
        $("u-fun").value = "";
        $("u-pin").value = "";
        pintarUsuarios();

        const r = await api({ accion: "crearUsuario", nombre, fundo, nuevoPin });
        if (!r.ok) {
          S.users = S.users.filter(u => String(u.pin) !== nuevoPin);
          store.set(CACHE.USERS, S.users);
          pintarUsuarios();
          return toast(r.error);
        }
        toast("Usuario guardado en Drive");
      };

      listar();
    }

    // =========================================================================
    // VISTA MAESTRO: DATOS (EXCEL PERSONAL + LABORES CON ORDEN + FONDO)
    // =========================================================================
    function renderDatos() {
      const pane = $("pane-datos");
      if (!pane || S.activeTab !== "datos") return;

      let editLabores = S.L.map(l => ({ labor: l.labor, codigo: l.codigo }));
      if (!editLabores.length) editLabores = [{ labor: "", codigo: "" }];

      pane.innerHTML = `
        <div class="card">
          <div style="font-weight:800;margin-bottom:4px">Carga masiva de personal (Excel)</div>
          <p class="m" style="margin:0 0 8px">
            Sube tu archivo <b>Excel (<code>.xlsx</code> / <code>.xls</code>)</b>. Detecta encabezados automáticamente y se guarda en Drive.
          </p>
          <label class="excel-drop" for="fp">
            <div style="font-weight:800;color:#6ee7b7;font-size:12px">📊 Seleccionar Excel de Trabajadores (.xlsx / .xls)</div>
            <div class="m" style="font-size:10.5px;margin-top:2px">También acepta .csv, .tsv o .txt</div>
          </label>
          <input type="file" id="fp" accept=".xlsx,.xls,.txt,.tsv,.csv" style="display:none" />
          <div id="fs" class="m" style="font-weight:700;color:#6ee7b7;margin-bottom:6px"></div>
          <details>
            <summary class="m" style="cursor:pointer;font-size:11px">O pegar filas copiadas desde Excel</summary>
            <textarea id="pt" rows="4" placeholder="Pega aquí las filas de Excel..." style="font-family:monospace;font-size:11px;margin-top:6px"></textarea>
            <button id="ps" type="button" class="btn" style="margin-top:6px;width:100%">Guardar personal pegado</button>
          </details>
        </div>

        <div class="card">
          <div class="row sp" style="margin-bottom:6px">
            <div style="font-weight:800">Maestro de Labores y Códigos</div>
            <label for="fl-excel" class="btn btn-s btn-xs" style="cursor:pointer">📊 Importar Excel</label>
            <input type="file" id="fl-excel" accept=".xlsx,.xls,.csv,.tsv,.txt" style="display:none" />
          </div>
          <div class="m" style="font-size:10.5px;margin-bottom:6px">Usa <b>↑</b> y <b>↓</b> para cambiar el orden en que aparecen en la lista.</div>

          <table class="labor-table">
            <thead>
              <tr>
                <th style="width:48px">ORDEN</th>
                <th>LABOR</th>
                <th style="width:66px;text-align:center">CÓDIGO</th>
                <th style="width:28px"></th>
              </tr>
            </thead>
            <tbody id="l-tbody"></tbody>
          </table>

          <div class="row sp" style="margin-top:8px;gap:6px">
            <button id="l-add-row" type="button" class="btn btn-s btn-xs">+ Añadir labor</button>
            <button id="l-def" type="button" class="btn btn-s btn-xs">Restaurar 10 oficiales</button>
          </div>
          <button id="ls" type="button" class="btn" style="width:100%;margin-top:8px">Guardar labores y orden</button>
        </div>

        <div class="card">
          <div style="font-weight:800;margin-bottom:4px">Imagen de fondo (Apariencia)</div>
          <p class="m" style="margin:0 0 8px">Se optimiza para móvil y se guarda en Drive.</p>
          <input type="file" id="bg-file" accept="image/*" style="margin-bottom:6px" />
          <div class="row" style="flex-wrap:nowrap;margin-bottom:6px">
            <input id="bg-url" placeholder="O pega URL https://..." value="${S.bgImage && !S.bgImage.startsWith("data:") ? esc(S.bgImage) : ""}" style="flex:1" />
            <button id="bg-apply" type="button" class="btn btn-xs">Aplicar</button>
          </div>
          <button id="bg-clear" type="button" class="btn btn-s btn-xs" style="width:100%">Quitar fondo</button>
        </div>
      `;

      const pintarTablaLabores = () => {
        if (!$("l-tbody") || S.activeTab !== "datos") return;
        const total = editLabores.length;
        $("l-tbody").innerHTML = editLabores.map((item, idx) => `
          <tr>
            <td>
              <div class="ord-btns">
                <button type="button" data-up="${idx}" ${idx === 0 ? "disabled" : ""} title="Subir">↑</button>
                <button type="button" data-dn="${idx}" ${idx === total - 1 ? "disabled" : ""} title="Bajar">↓</button>
              </div>
            </td>
            <td><input class="l-nom" data-ln="${idx}" placeholder="NOMBRE DE LABOR" value="${esc(item.labor)}" /></td>
            <td><input class="l-cod" data-lc="${idx}" inputmode="numeric" placeholder="CÓD." value="${esc(item.codigo)}" /></td>
            <td style="text-align:right">
              <button type="button" class="btn btn-d btn-xs" data-lx="${idx}" title="Quitar fila">✕</button>
            </td>
          </tr>
        `).join("");

        document.querySelectorAll("[data-up]").forEach(btn => {
          btn.onclick = () => {
            const i = Number(btn.dataset.up);
            if (i <= 0) return;
            const tmp = editLabores[i - 1];
            editLabores[i - 1] = editLabores[i];
            editLabores[i] = tmp;
            pintarTablaLabores();
          };
        });

        document.querySelectorAll("[data-dn]").forEach(btn => {
          btn.onclick = () => {
            const i = Number(btn.dataset.dn);
            if (i >= editLabores.length - 1) return;
            const tmp = editLabores[i + 1];
            editLabores[i + 1] = editLabores[i];
            editLabores[i] = tmp;
            pintarTablaLabores();
          };
        });

        document.querySelectorAll("[data-ln]").forEach(inp => {
          inp.oninput = () => { editLabores[Number(inp.dataset.ln)].labor = inp.value; };
        });

        document.querySelectorAll("[data-lc]").forEach(inp => {
          inp.oninput = () => { editLabores[Number(inp.dataset.lc)].codigo = inp.value; };
        });

        document.querySelectorAll("[data-lx]").forEach(btn => {
          btn.onclick = () => {
            editLabores.splice(Number(btn.dataset.lx), 1);
            if (!editLabores.length) editLabores.push({ labor: "", codigo: "" });
            pintarTablaLabores();
          };
        });
      };

      pintarTablaLabores();

      $("l-add-row").onclick = () => {
        editLabores.push({ labor: "", codigo: "" });
        pintarTablaLabores();
        const inputs = document.querySelectorAll(".l-nom");
        if (inputs.length) inputs[inputs.length - 1].focus();
      };

      $("l-def").onclick = () => {
        editLabores = DEFAULT_LABORES.map(l => ({ labor: l.labor, codigo: l.codigo }));
        pintarTablaLabores();
        toast("10 labores oficiales restauradas; presiona Guardar");
      };

      $("ls").onclick = async () => {
        const limpias = editLabores
          .map(x => ({
            labor: String(x.labor || "").trim().toUpperCase(),
            codigo: Number(String(x.codigo || "").trim()) || String(x.codigo || "").trim()
          }))
          .filter(x => x.labor && x.codigo !== "");

        if (!limpias.length) return toast("Ingresa al menos una labor con su código");

        $("ls").disabled = true;
        const r = await api({ accion: "cargarLabores", labores: limpias });
        if ($("ls")) $("ls").disabled = false;
        if (!r.ok) return toast(r.error);

        S.L = limpias;
        editLabores = limpias.map(l => ({ labor: l.labor, codigo: l.codigo }));
        store.set(CACHE.LABORES, limpias);
        pintarTablaLabores();
        const sub = document.querySelector(".user-sub");
        if (sub) sub.textContent = `${S.P.size} pers. · ${S.L.length} labores · 30d`;
        toast(`✓ ${limpias.length} labores y orden guardados`);
      };

      $("fl-excel").onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          const matriz = await leerArchivoComoMatriz(f);
          const L = matrizLaboresALista(matriz);
          if (!L.length) return toast("No se detectaron columnas LABOR y CÓDIGO");
          editLabores = L.map(x => ({ labor: x.labor, codigo: x.codigo }));
          pintarTablaLabores();
          toast(`${L.length} labores importadas; presiona Guardar`);
        } catch (err) {
          toast(err.message || "Error leyendo Excel de labores");
        }
        e.target.value = "";
      };

      const subirTsvAlServidor = async rawTsv => {
        const compactLines = parsePersonalTsv(rawTsv);
        if (!compactLines.length) return toast("No se detectaron trabajadores con DNI válido");
        const compactTxt = compactLines.join("\n");
        if ($("fs")) $("fs").textContent = `Subiendo ${compactLines.length} trabajadores a Drive...`;
        const r = await api({ accion: "cargarPersonal", tsv: rawTsv });
        if (!r.ok) {
          if ($("fs")) $("fs").textContent = "";
          return toast(r.error);
        }
        store.setRaw(CACHE.PERSONAL, compactTxt);
        loadPersonalIntoMemory(compactTxt);
        if ($("fs")) {
          $("fs").textContent = `✓ ${r.total} trabajadores cargados en Drive (${Math.max(1, Math.round(compactTxt.length / 1024))} KB)`;
        }
        toast(`Personal actualizado (${r.total} trabajadores)`);
        const sub = document.querySelector(".user-sub");
        if (sub) sub.textContent = `${S.P.size} pers. · ${S.L.length} labores · 30d`;
      };

      $("fp").onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          if ($("fs")) $("fs").textContent = `Leyendo ${f.name}...`;
          const matriz = await leerArchivoComoMatriz(f);
          const tsv = matrizPersonalATsv(matriz);
          if (!tsv) {
            if ($("fs")) $("fs").textContent = "";
            return toast("No se encontraron columnas válidas de DNI y nombres");
          }
          await subirTsvAlServidor(tsv);
        } catch (err) {
          if ($("fs")) $("fs").textContent = "";
          toast(err.message || "Error leyendo el archivo Excel");
        }
        e.target.value = "";
      };

      $("ps").onclick = async () => {
        const txt = $("pt").value.trim();
        if (!txt) return toast("Pega la tabla primero");
        await subirTsvAlServidor(txt);
      };

      const saveBg = async val => {
        applyBg(val);
        store.setRaw(CACHE.BG, val);
        const r = await api({ accion: "guardarConfig", bgImage: val });
        toast(r.ok ? "Fondo guardado en Drive" : "Fondo aplicado localmente");
      };

      $("bg-file").onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          await saveBg(await compressImg(f, 1200, 0.72));
        } catch (err) { toast(err.message); }
      };

      $("bg-apply").onclick = async () => {
        const u = $("bg-url").value.trim();
        if (!u) return toast("Ingresa una URL");
        await saveBg(u);
      };

      $("bg-clear").onclick = async () => saveBg("");
    }

    // =========================================================================
    // ARRANQUE INMEDIATO
    // =========================================================================
    store.purgeOlderThan30Days();
    applyBg(store.getRaw(CACHE.BG, ""));
    hydrateFromCache();
    initTopbar();
    renderLogin();
  </script>
</body>
</html>
