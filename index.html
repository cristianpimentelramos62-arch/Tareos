<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Sistema de Tareos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- SheetJS para lectura y exportación nativa de Excel (.xlsx / .xls) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #080d0a;
      --bg-grad: radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.14), transparent 42%),
                 radial-gradient(circle at 85% 90%, rgba(5, 150, 105, 0.12), transparent 45%);
      --card: rgba(16, 25, 20, 0.82);
      --card-solid: #111b15;
      --text: #ecf5ef;
      --muted: #8ea396;
      --border: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(52, 211, 153, 0.35);
      --primary: #10b981;
      --primary-dark: #059669;
      --warn: #f59e0b;
      --danger: #ef4444;
      --info: #38bdf8;
      --input: rgba(9, 15, 12, 0.88);
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
    }

    body.has-bg {
      --card: rgba(12, 19, 15, 0.86);
      --input: rgba(8, 13, 10, 0.90);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      font: 12.5px/1.38 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: var(--bg-grad);
      color: var(--text);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      min-height: 100dvh;
    }

    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #bg-veil {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    body.has-bg #bg-veil {
      background: linear-gradient(180deg, rgba(6, 11, 8, 0.72), rgba(6, 11, 8, 0.88));
    }

    /* Barra superior sticky adaptada a móvil */
    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(12, 20, 16, 0.86);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 25;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .sync-box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
      flex-shrink: 0;
    }

    .dot.warn {
      background: var(--warn);
      box-shadow: 0 0 8px var(--warn);
    }

    #sync-indicator {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      color: var(--text);
    }

    .mode-pill {
      flex-shrink: 0;
      display: inline-flex;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px;
      gap: 2px;
    }

    .mode-pill button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      cursor: pointer;
    }

    .mode-pill button.on-script {
      background: var(--primary);
      color: #051b11;
    }

    .mode-pill button.on-demo {
      background: var(--warn);
      color: #1c1002;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 10px 44px;
    }

    .card {
      width: 100%;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 11px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-title {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-sub {
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      min-width: 0;
    }

    .sp { justify-content: space-between; }
    .m { font-size: 11px; color: var(--muted); }

    input, select, textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      font: inherit;
      font-size: 12px;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
    }

    input[type="date"] {
      width: auto;
      padding: 4px 7px;
      font-size: 11.5px;
      color-scheme: dark;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    input:disabled, select:disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }

    button.btn, label.btn {
      font: inherit;
      font-size: 11.5px;
      font-weight: 700;
      border: 0;
      border-radius: 9px;
      padding: 7px 11px;
      cursor: pointer;
      background: var(--primary);
      color: #041c11;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      user-select: none;
    }

    button.btn:active, label.btn:active { transform: scale(0.98); }
    button.btn:hover, label.btn:hover { background: var(--primary-dark); color: #fff; }
    button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
    button.btn-s, label.btn-s { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--border); }
    button.btn-w { background: var(--warn); color: #1b1002; }
    button.btn-d { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    button.btn-info, label.btn-info { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
    button.btn-xs, label.btn-xs { padding: 4px 8px; font-size: 10.5px; border-radius: 7px; }

    .tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      margin-bottom: 8px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tabs button {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--primary);
      color: #041b10;
      border-color: var(--primary);
    }

    /* Contenedores DOM estrictamente independientes por pestaña */
    .tab-pane {
      display: none !important;
      width: 100%;
    }

    .tab-pane.active-pane {
      display: block !important;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .b-new { background: rgba(255, 255, 255, 0.09); color: var(--muted); }
    .b-bor { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .b-env { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }

    .masivo-banner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(56, 189, 248, 0.12));
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 9px 11px;
      margin-bottom: 8px;
    }

    /* Tarjetas compactas de tareo en móvil con letra pequeña legible */
    .t-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 9px;
      margin-bottom: 6px;
      backdrop-filter: blur(12px);
    }

    .t-top {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
    }

    .t-num {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.09);
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .t-top input.dni-in {
      font-size: 11.5px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 4px 7px;
    }

    .t-name {
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 5px;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      min-height: 21px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      flex-wrap: wrap;
    }

    .t-bot {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .t-bot select {
      font-size: 10.5px;
      padding: 5px 6px;
    }

    .code-pill {
      flex-shrink: 0;
      min-width: 46px;
      text-align: center;
      font-family: ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 800;
      padding: 5px 4px;
      border-radius: 7px;
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .hrs-box {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--input);
      overflow: hidden;
    }

    .hrs-box button {
      border: 0;
      background: transparent;
      color: var(--text);
      font-weight: 800;
      font-size: 13px;
      width: 24px;
      height: 27px;
      cursor: pointer;
    }

    .hrs-box input {
      width: 34px;
      border: 0;
      background: transparent;
      text-align: center;
      padding: 4px 1px;
      font-size: 11px;
      font-weight: 800;
    }

    .dist-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 9px;
      margin-bottom: 6px;
    }

    .dist-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 6px;
    }

    .dist-cell label {
      display: block;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dist-cell input {
      font-size: 11px;
      padding: 4px 4px;
      text-align: center;
      font-weight: 700;
    }

    .dist-total-box {
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 5px;
      text-align: center;
    }

    .bad { color: #f87171; font-size: 10.5px; font-weight: 800; }
    .warn-txt { color: #fbbf24; font-size: 10px; font-weight: 700; }

    .excel-drop {
      border: 1.5px dashed var(--primary);
      background: rgba(16, 185, 129, 0.08);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      display: block;
      margin-bottom: 8px;
    }

    .labor-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 0;
    }

    .labor-table th {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      padding: 4px 3px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .labor-table td {
      padding: 4px 2px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .labor-table input.l-nom {
      font-size: 10.8px;
      font-weight: 600;
      padding: 5px 5px;
      text-transform: uppercase;
    }

    .labor-table input.l-cod {
      font-size: 10.8px;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      padding: 5px 3px;
      text-align: center;
    }

    .ord-btns {
      display: inline-flex;
      gap: 2px;
      align-items: center;
    }

    .ord-btns button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-radius: 5px;
      width: 22px;
      height: 26px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ord-btns button:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table.res-tbl {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px;
    }

    table.res-tbl th, table.res-tbl td {
      padding: 5px 6px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 10.5px;
    }

    table.res-tbl th {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .kpi b { display: block; font-size: 15px; margin-top: 2px; color: var(--primary); }

    .login-wrap {
      width: 100%;
      max-width: 330px;
      margin: 15vh auto 0;
      padding: 0 12px;
    }

    .login-card {
      padding: 24px 18px;
      text-align: center;
      border-color: var(--border-strong);
    }

    .login-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .login-row input {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.28em;
      padding: 9px 10px;
    }

    .login-row button {
      flex-shrink: 0;
      padding: 9px 16px;
    }

    #toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      max-width: 400px;
      margin: 0 auto;
      padding: 9px 12px;
      border-radius: 10px;
      background: #062819;
      border: 1px solid var(--primary);
      color: #ecfdf5;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 80;
      text-align: center;
    }

    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      z-index: 65;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #modal .box {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 340px;
      width: 100%;
      padding: 15px;
    }
  </style>
</head>
<body>
  <div id="bg-layer"></div>
  <div id="bg-veil"></div>

  <div class="topbar">
    <div class="sync-box">
      <span id="sync-dot" class="dot"></span>
      <span id="sync-indicator">Script (Drive)</span>
    </div>
    <div class="mode-pill">
      <button id="m-script" type="button">Script (Drive)</button>
      <button id="m-demo" type="button">Demo</button>
    </div>
  </div>

  <div id="app"></div>
  <datalist id="dl-dni"></datalist>
  <div id="toast"></div>

  <div id="modal">
    <div class="box">
      <div id="m-title" style="font-weight:800;font-size:14px;margin-bottom:6px">Confirmar</div>
      <div id="m-body" class="m" style="margin-bottom:14px;line-height:1.45"></div>
      <div class="row" style="justify-content:flex-end">
        <button id="m-no" type="button" class="btn btn-s">Cancelar</button>
        <button id="m-yes" type="button" class="btn">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURACIÓN GLOBAL, RETENCIÓN DE 30 DÍAS Y LABORES OFICIALES
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyilM2sXACMZfpctKQdxWrikrwD--hCUuEj55PImcL9ArnCKu1ffm1c1BsAHQOEVWBYNg/exec";
    const MASTER_PIN = "0104";
    const MASTER_FUNDO = "ADMI";
    const RETENTION_DAYS = 30;
    const TODAY = new Date().toISOString().slice(0, 10);

    const DEFAULT_LABORES = [
      { labor: "SUPERVISOR DE COSECHA", codigo: 7069 },
      { labor: "OFICINA", codigo: 7074 },
      { labor: "SUPERVISOR HAND PACKED", codigo: 7073 },
      { labor: "SUPERVISOR BULK", codigo: 7162 },
      { labor: "SUPERVISOR DE CICLO", codigo: 7072 },
      { labor: "LIMPIEZA DE FUNDO", codigo: 7152 },
      { labor: "MANTENIMIENTO DE CALLES Y CAMINOS", codigo: 7053 },
      { labor: "PLANILLERO", codigo: 7144 },
      { labor: "JABERO", codigo: 7081 },
      { labor: "INDIRECTOS", codigo: 11000 }
    ];

    const DIST_FIELDS = [
      { key: "cosecha", label: "Cosecha" },
      { key: "supCiclo", label: "Sup. Ciclo" },
      { key: "supCuadrilla", label: "Sup. Cuadrilla" },
      { key: "jabero", label: "Jabero" },
      { key: "limpieza", label: "Limpieza" },
      { key: "riego", label: "Riego" },
      { key: "otros", label: "Otros" }
    ];

    const CACHE = {
      PERSONAL: "tareos_v12_personal",
      LABORES: "tareos_v12_labores",
      USERS: "tareos_v12_users",
      BG: "tareos_v12_bg",
      TAREO_PREFIX: "tareos_v12_tareo_",
      ASIS_PREFIX: "tareos_v12_asis_",
      RESUMEN_PREFIX: "tareos_v12_resumen_"
    };

    const $ = id => document.getElementById(id);
    const keyDni = d => String(d || "").replace(/\D/g, "").replace(/^0+/, "");
    const padDni = d => String(d).padStart(8, "0");
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function getCutoffIso(days = RETENTION_DAYS) {
      const d = new Date();
      d.setDate(d.getDate() - days);
      return d.toISOString().slice(0, 10);
    }

    const store = {
      get(k, fallback = null) {
        try {
          const v = localStorage.getItem(k);
          return v === null ? fallback : JSON.parse(v);
        } catch (e) {
          return fallback;
        }
      },
      set(k, val) {
        try {
          localStorage.setItem(k, JSON.stringify(val));
        } catch (e) {}
      },
      remove(k) {
        try {
          localStorage.removeItem(k);
        } catch (e) {}
      },
      getRaw(k, fallback = "") {
        try {
          return localStorage.getItem(k) || fallback;
        } catch (e) {
          return fallback;
        }
      },
      setRaw(k, val) {
        try {
          if (val) localStorage.setItem(k, val);
          else localStorage.removeItem(k);
        } catch (e) {}
      },
      purgeOlderThan30Days() {
        try {
          const cutoff = getCutoffIso(RETENTION_DAYS);
          const keysToDelete = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!k || !k.startsWith("tareos_v12_")) continue;
            const m = k.match(/(\d{4}-\d{2}-\d{2})/);
            if (m && m[1] < cutoff) {
              keysToDelete.push(k);
            }
          }
          keysToDelete.forEach(k => localStorage.removeItem(k));
        } catch (e) {}
      }
    };

    // =========================================================================
    // DATOS DEMO AISLADOS
    // =========================================================================
    const DEMO = {
      users: [
        { nombre: "Nayely Calderon", fundo: "QUEBRADA", pin: "0403" }
      ],
      personalTxt: [
        "16660571|CLAVO PURIHUAMAN BERNARDO SEBASTIAN|ADMI|ACTIVO",

    function compressImg(file, maxW = 1200, q = 0.72) {
      return new Promise((resolve, reject) => {
        const rd = new FileReader();
        rd.onerror = () => reject(new Error("Error leyendo imagen"));
        rd.onload = e => {
          const img = new Image();
          img.onerror = () => reject(new Error("Imagen no válida"));
          img.onload = () => {
            const scale = img.width > maxW ? maxW / img.width : 1;
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL("image/jpeg", q));
          };
          img.src = e.target.result;
        };
        rd.readAsDataURL(file);
      });
    }

    function localFallbackApi(req) {
      store.purgeOlderThan30Days();
      const pin = String(req.pin || "").trim();
      const fundo = S.fundo || (pin === MASTER_PIN ? MASTER_FUNDO : "FUNDO");

      if (req.accion === "guardarBorrador") {
        store.set(`${CACHE.TAREO_PREFIX}live_${req.fecha}_${fundo}_${pin}`, { filas: req.filas || [], estado: "BORRADOR" });
        return { ok: true, offline: true };
      }
      if (req.accion === "enviarTareo") {
        const envioObj = {
          pin,
          fundo,
          usuario: S.nombre || fundo,
          fecha: req.fecha,
          filas: req.filas || [],
          enviado: new Date().toISOString()
        };
        store.set(`${CACHE.TAREO_PREFIX}live_${req.fecha}_${fundo}_${pin}`, {
          filas: req.filas || [],
          estado: "ENVIADO",
          enviado: envioObj.enviado
        });
        const rKey = `${CACHE.RESUMEN_PREFIX}live_${req.fecha}`;
        const cur = store.get(rKey, { data: [], borradores: [], asistencia: [], asistenciaBorradores: [] });
        cur.data = (cur.data || []).filter(x => !(x.fundo === fundo && String(x.pin || pin) === pin));
        cur.data.push(envioObj);
        store.set(rKey, cur);
        return { ok: true, offline: true };
      }
      if (req.accion === "borrarTareo" || req.accion === "reabrirTareo") {
        const targetFundo = req.fundo || fundo;
        const targetPin = req.targetPin || pin;
        const tKey = `${CACHE.TAREO_PREFIX}live_${req.fecha}_${targetFundo}_${targetPin}`;
        if (req.accion === "borrarTareo") {
          store.remove(tKey);
        } else {
          const prev = store.get(tKey, { filas: [] });
          store.set(tKey, { filas: prev.filas || [], estado: "BORRADOR" });
        }
        const rKey = `${CACHE.RESUMEN_PREFIX}live_${req.fecha}`;
        const cur = store.get(rKey, { data: [], borradores: [], asistencia: [], asistenciaBorradores: [] });
        const removed = (cur.data || []).find(x => x.fundo === targetFundo && (!targetPin || String(x.pin || targetPin) === String(targetPin)));
        cur.data = (cur.data || []).filter(x => !(x.fundo === targetFundo && (!targetPin || String(x.pin || targetPin) === String(targetPin))));
        if (req.accion === "reabrirTareo" && removed) {
          cur.borradores = (cur.borradores || []).filter(x => x.fundo !== targetFundo);
          cur.borradores.push({ ...removed, actualizado: new Date().toISOString() });
        }
        store.set(rKey, cur);
        return { ok: true, offline: true };
      }
      if (req.accion === "guardarAsistenciaBorrador") {
        store.set(`${CACHE.ASIS_PREFIX}live_${req.fecha}_${fundo}_${pin}`, {
          responsable: req.responsable || S.nombre || fundo,
          filas: req.filas || [],
          estado: "BORRADOR"
        });
        return { ok: true, offline: true };
      }
      if (req.accion === "enviarAsistencia") {
        const envioAsis = {
          pin,
          fundo,
          responsable: req.responsable || S.nombre || fundo,
          usuario: S.nombre || fundo,
          fecha: req.fecha,
          filas: req.filas || [],
          enviado: new Date().toISOString()
        };
        store.set(`${CACHE.ASIS_PREFIX}live_${req.fecha}_${fundo}_${pin}`, {
          responsable: envioAsis.responsable,
          filas: envioAsis.filas,
          estado: "ENVIADO"
        });
        const rKey = `${CACHE.RESUMEN_PREFIX}live_${req.fecha}`;
        const cur = store.get(rKey, { data: [], borradores: [], asistencia: [], asistenciaBorradores: [] });
        cur.asistencia = (cur.asistencia || []).filter(x => !(x.fundo === fundo && String(x.pin || pin) === pin));
        cur.asistencia.push(envioAsis);
        store.set(rKey, cur);
        return { ok: true, offline: true };
      }
      if (req.accion === "borrarAsistencia" || req.accion === "reabrirAsistencia") {
        const targetFundo = req.fundo || fundo;
        const targetPin = req.targetPin || pin;
        store.remove(`${CACHE.ASIS_PREFIX}live_${req.fecha}_${targetFundo}_${targetPin}`);
        const rKey = `${CACHE.RESUMEN_PREFIX}live_${req.fecha}`;
        const cur = store.get(rKey, { data: [], borradores: [], asistencia: [], asistenciaBorradores: [] });
        cur.asistencia = (cur.asistencia || []).filter(x => !(x.fundo === targetFundo && (!targetPin || String(x.pin || targetPin) === String(targetPin))));
        store.set(rKey, cur);
        return { ok: true, offline: true };
      }
      return null;
    }

    async function api(payload) {
      if (S.demo) return demoApi({ pin: S.pin, ...payload });
      const bodyObj = { pin: S.pin, ...payload };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(bodyObj)
        });
        const txt = await res.text();
        try {
          return JSON.parse(txt);
        } catch (parseErr) {
          if (txt.includes("accounts.google.com")) {
            return { ok: false, error: "Script privado: pon acceso en 'Cualquier persona'" };
          }
          const fb = localFallbackApi(bodyObj);
          return fb || { ok: false, error: "Respuesta inválida del Script" };
        }
      } catch (postErr) {
        try {
          const compact = JSON.stringify(bodyObj);
          if (compact.length < 1800) {
            const url = `${API_URL}?q=${encodeURIComponent(compact)}`;
            const resGet = await fetch(url, { method: "GET", redirect: "follow" });
            const txtGet = await resGet.text();
            return JSON.parse(txtGet);
          }
        } catch (getErr) {}
        const fb = localFallbackApi(bodyObj);
        return fb || { ok: false, error: "Sin conexión con Google Drive" };
      }
    }

    // =========================================================================
    // PARSEO DE EXCEL (.xlsx / .xls / .csv)

    function normHeader(h) {
      return String(h || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .trim();
    }

    async function leerArchivoComoMatriz(file) {
      const name = (file.name || "").toLowerCase();
      if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
        if (typeof XLSX === "undefined") {
          throw new Error("No se cargó el lector Excel.");
        }
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        return XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
      }
      const txt = await file.text();
      const sep = txt.includes("\t") ? "\t" : (txt.includes(";") ? ";" : ",");
      return txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep));
    }

    function matrizTareoMasivoAFilas(rows) {
      if (!Array.isArray(rows) || !rows.length) return [];

      let codCol = 0;
      let dniCol = 1;
      let hrsCol = 3;
      let startRow = 0;

      for (let r = 0; r < Math.min(rows.length, 10); r++) {
        const normRow = (rows[r] || []).map(normHeader);
        const dIdx = normRow.findIndex(c => c === "DNI" || c === "DOCUMENTO" || c === "NRO DOCUMENTO");
        const cIdx = normRow.findIndex(c => c.includes("LABOR") || c.includes("COD"));
        const hIdx = normRow.findIndex(c => c.includes("HORA") || c === "HRS");
        if (dIdx !== -1) {
          dniCol = dIdx;
          if (cIdx !== -1) codCol = cIdx;
          if (hIdx !== -1) hrsCol = hIdx;
          else hrsCol = normRow.length >= 4 ? 3 : 2;
          startRow = r + 1;
          break;
        }
      }

      const codeToLabor = new Map();
      S.L.forEach(l => codeToLabor.set(String(l.codigo).trim(), l.labor));

      const filas = [];
      for (let i = startRow; i < rows.length; i++) {
        const row = rows[i] || [];
        const rawDni = keyDni(row[dniCol]);
        if (!rawDni || rawDni.length < 6) continue;

        const codStr = String(row[codCol] ?? "").trim();
        const laborEncontrada = codeToLabor.get(codStr) || "";
        const hrsNum = Number(String(row[hrsCol] ?? "8").replace(",", "."));
        const horas = !isNaN(hrsNum) && hrsNum > 0 ? hrsNum : 8;

        filas.push({
          dni: padDni(rawDni),
          labor: laborEncontrada,
          codigoManual: laborEncontrada ? "" : codStr,
          horas
        });
      }
      return filas;
    }
