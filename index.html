<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sistema de Tareos · Liquid Glass</title>
  <!-- Arranque en 0 ms: aplica solo fondo sólido inmediato (negro o blanco) antes del primer pintado -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("st_color_mode_v1") || "dark";
        document.documentElement.setAttribute("data-mode", mode);
        document.documentElement.style.backgroundColor = mode === "light" ? "#f2f5fa" : "#060a10";
      } catch (e) {}
    })();
  </script>
  <style>
    :root, [data-mode="dark"] {
      --bg-base: #060a10;
      --bg-grad-1: rgba(56, 189, 248, 0.22);
      --bg-grad-2: rgba(16, 185, 129, 0.16);
      --glass-alpha: 0.72;
      --glass-bg: rgba(15, 22, 34, var(--glass-alpha));
      --glass-card: rgba(22, 31, 48, var(--glass-alpha));
      --glass-input: rgba(8, 12, 20, 0.78);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.08);
      --drawer-bg: rgba(11, 17, 28, 0.96);
      --pill-bg: rgba(0, 0, 0, 0.28);
      --row-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-contrast: #041019;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --accent-border: rgba(56, 189, 248, 0.48);
      --accent-glow: rgba(56, 189, 248, 0.26);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #f43f5e;
      --warn: #f59e0b;
      --ok: #10b981;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    [data-mode="light"] {
      --bg-base: #f2f5fa;
      --bg-grad-1: rgba(14, 165, 233, 0.16);
      --bg-grad-2: rgba(16, 185, 129, 0.12);
      --glass-alpha: 0.78;
      --glass-bg: rgba(255, 255, 255, var(--glass-alpha));
      --glass-card: rgba(255, 255, 255, var(--glass-alpha));
      --glass-input: rgba(241, 245, 249, 0.88);
      --glass-border: rgba(15, 23, 42, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.75);
      --drawer-bg: rgba(248, 250, 252, 0.97);
      --pill-bg: rgba(15, 23, 42, 0.06);
      --row-border: rgba(15, 23, 42, 0.09);
      --accent: #0284c7;
      --accent-contrast: #ffffff;
      --accent-soft: rgba(2, 132, 199, 0.14);
      --accent-border: rgba(2, 132, 199, 0.42);
      --accent-glow: rgba(2, 132, 199, 0.22);
      --text: #0f172a;
      --muted: #475569;
      --danger: #e11d48;
      --warn: #d97706;
      --ok: #059669;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Capa de fondo global diferida (administrada solo por Admi y cacheada para todos) */
    #bg-photo-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 14% 10%, var(--bg-grad-1), transparent 46%),
        radial-gradient(circle at 86% 24%, var(--bg-grad-2), transparent 48%);
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #bg-photo-layer.ready { opacity: 1; }

    #bg-photo-scrim {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: transparent;
      transition: background 0.25s ease;
    }

    [data-mode="dark"] #bg-photo-scrim.has-img {
      background: linear-gradient(180deg, rgba(6, 10, 16, 0.42), rgba(6, 10, 16, 0.62));
    }

    [data-mode="light"] #bg-photo-scrim.has-img {
      background: linear-gradient(180deg, rgba(242, 245, 250, 0.35), rgba(242, 245, 250, 0.56));
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 10px 12px 88px;
      overflow-x: hidden;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), inset 0 1px 0 var(--glass-highlight);
    }

    .card {
      background: var(--glass-card);
      backdrop-filter: blur(18px) saturate(155%);
      -webkit-backdrop-filter: blur(18px) saturate(155%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14), inset 0 1px 0 var(--glass-highlight);
      max-width: 100%;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .sp { justify-content: space-between; }
    .m { color: var(--muted); font-size: 11.5px; }

    input, select, textarea {
      background: var(--glass-input);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      max-width: 100%;
      min-width: 0;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input:disabled, select:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #000000));
      color: var(--accent-contrast);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.1s ease, opacity 0.15s ease;
      box-shadow: 0 4px 14px var(--accent-glow);
      user-select: none;
      touch-action: manipulation;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-s { background: var(--pill-bg); color: var(--text); border: 1px solid var(--glass-border); box-shadow: none; }
    .btn-w { background: linear-gradient(135deg, #f59e0b, #d97706); color: #180c00; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.22); }
    .btn-d { background: rgba(244, 63, 94, 0.16); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.36); box-shadow: none; }
    .btn-info { background: rgba(16, 185, 129, 0.18); color: var(--ok); border: 1px solid rgba(16, 185, 129, 0.38); box-shadow: none; }
    .btn-xs { padding: 6px 9px; font-size: 11px; border-radius: 8px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .b-new { background: var(--pill-bg); color: var(--muted); border: 1px solid var(--glass-border); }
    .b-bor { background: rgba(245, 158, 11, 0.16); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.35); }
    .b-env { background: rgba(16, 185, 129, 0.16); color: var(--ok); border: 1px solid rgba(16, 185, 129, 0.35); }
    .b-auto { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }

    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 11px;
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      font-size: 11px;
      width: 100%;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
      display: inline-block;
      flex-shrink: 0;
    }

    .dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    .user-header { border-radius: var(--radius-lg); padding: 11px 13px; margin-bottom: 9px; }
    .user-title { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .role-chip { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; }

    .nav-strip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 5px;
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .nav-strip::-webkit-scrollbar { display: none; }

    .nav-tab {
      flex: 0 0 auto;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
      touch-action: manipulation;
    }
    .nav-tab.active {
      background: var(--accent-soft);
      color: var(--text);
      border-color: var(--accent-border);
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .nav-tab.single-full {
      flex: 1;
      text-align: center;
    }

    .masivo-banner {
      background: linear-gradient(135deg, var(--accent-soft), rgba(16, 185, 129, 0.1));
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-lg);
      padding: 11px 12px;
      margin-bottom: 10px;
    }

    .worker-card, .dist-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 11px;
      margin-bottom: 8px;
    }

    .t-num {
      min-width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      font-size: 11.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    .dni-box { position: relative; flex: 1; display: flex; align-items: center; min-width: 0; }
    .dni-box input { width: 100%; padding-right: 32px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; letter-spacing: 0.04em; }
    .dni-clear {
      position: absolute;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 0;
      background: var(--pill-bg);
      color: var(--text);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .worker-name-pill { margin: 6px 0; padding: 6px 9px; border-radius: 9px; background: var(--pill-bg); font-size: 12px; font-weight: 700; }
    .worker-name-pill.no-contrato { background: rgba(244, 63, 94, 0.16); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.35); }

    .stepper { display: inline-flex; align-items: center; background: var(--glass-input); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); overflow: hidden; flex-shrink: 0; }
    .stepper button { background: transparent; border: 0; color: var(--text); width: 30px; height: 32px; font-size: 15px; font-weight: 800; cursor: pointer; }
    .stepper span { min-width: 28px; text-align: center; font-weight: 800; font-size: 12.5px; }

    .dist-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 7px; }
    .aj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
    @media (max-width: 440px) {
      .dist-grid { grid-template-columns: repeat(2, 1fr); }
      .aj-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .dist-cell label { display: block; font-size: 10px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
    .dist-cell input, .dist-cell select { width: 100%; padding: 6px 8px; font-size: 12px; }
    .auto-pill { padding: 6px 8px; border-radius: var(--radius-sm); background: var(--accent-soft); border: 1px solid var(--accent-border); color: var(--accent); font-weight: 800; font-size: 12px; text-align: center; }

    .drawer-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 14, 0.62); backdrop-filter: blur(6px); z-index: 90; display: none; }
    .drawer-backdrop.open { display: block; }
    .drawer-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(315px, 85vw);
      background: var(--drawer-bg); backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
      border-left: 1px solid var(--glass-border); padding: 18px 14px; z-index: 95;
      transform: translateX(102%); transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex; flex-direction: column; gap: 8px;
    }
    .drawer-panel.open { transform: translateX(0); }

    .drawer-item {
      width: 100%; text-align: left; background: var(--pill-bg); border: 1px solid var(--glass-border);
      color: var(--text); padding: 11px 12px; border-radius: var(--radius-md); font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    }
    .drawer-item.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }

    .zone-check-group { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0 8px; max-height: 150px; overflow-y: auto; }
    .zone-pill-btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border-radius: 10px; font-size: 11px;
      font-weight: 700; cursor: pointer; border: 1px solid var(--glass-border); background: var(--pill-bg); color: var(--muted);
    }
    .zone-pill-btn.checked { background: var(--accent-soft); border-color: var(--accent); color: var(--text); box-shadow: 0 2px 10px var(--accent-glow); }

    .swatch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .swatch-btn {
      padding: 10px 8px; border-radius: var(--radius-md); border: 2px solid var(--glass-border);
      background: var(--pill-bg); color: var(--text); font-size: 11.5px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 7px;
    }
    .swatch-btn.selected { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

    /* Pantalla de Inicio Móvil (0 ms renderizada en HTML estático, privada y limpia) */
    .login-wrap { min-height: 76vh; display: flex; align-items: center; justify-content: center; padding: 10px 2px; width: 100%; }
    .login-card { width: 100%; max-width: 390px; padding: 24px 16px; margin: 0 auto; overflow: hidden; }
    .login-stack { display: flex; flex-direction: column; gap: 11px; width: 100%; }
    .pin-input-mobile {
      display: block; width: 100%; min-width: 0; max-width: 100%; height: 52px;
      font-size: 22px; text-align: center; letter-spacing: 0.22em; padding: 10px 12px;
      font-weight: 800; border-radius: var(--radius-md);
    }
    .login-submit-btn { width: 100%; height: 48px; font-size: 15px; border-radius: var(--radius-md); }
    .login-err { min-height: 18px; color: var(--danger); font-size: 12px; font-weight: 700; text-align: center; }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(2, 6, 14, 0.74); backdrop-filter: blur(8px);
      z-index: 120; display: none; align-items: center; justify-content: center; padding: 14px;
    }
    .modal-bg.open { display: flex; }
    .modal-box { width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; border-radius: var(--radius-lg); padding: 16px; }

    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--drawer-bg); border: 1px solid var(--accent-border); color: var(--text);
      padding: 9px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; opacity: 0;
      pointer-events: none; transition: all 0.2s ease; z-index: 150; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
      white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    table.clean-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    table.clean-tbl th, table.clean-tbl td { padding: 6px 5px; border-bottom: 1px solid var(--row-border); text-align: left; }
    table.clean-tbl th { color: var(--muted); font-size: 10px; text-transform: uppercase; }
    table.clean-tbl tfoot td { border-top: 2px solid var(--accent-border); font-weight: 800; background: var(--accent-soft); color: var(--text); }
  </style>
</head>
<body>
  <!-- Capas de fondo diferidas (administradas solo por Admi, se pintan tras el primer frame en 0 ms) -->
  <div id="bg-photo-layer"></div>
  <div id="bg-photo-scrim"></div>

  <div class="app-shell">
    <!-- Barra superior de estado -->
    <div class="status-strip glass">
      <div class="row" style="gap:6px;min-width:0;flex:1;flex-wrap:nowrap">
        <span id="sync-dot" class="dot"></span>
        <span id="sync-txt" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Drive + Respaldo Local</span>
      </div>
      <div class="row" style="gap:4px;flex-shrink:0;flex-wrap:nowrap">
        <button id="mode-drive" type="button" class="btn btn-xs">Drive</button>
        <button id="mode-demo" type="button" class="btn btn-s btn-xs">Demo</button>
      </div>
    </div>

    <!-- Contenedor Principal (Login limpio y privado renderizado en 0 ms) -->
    <div id="app">
      <div class="login-wrap">
        <div class="card login-card">
          <div style="font-size:21px;font-weight:800;margin-bottom:4px;letter-spacing:-0.01em">Sistema de Tareos</div>
          <div class="m" style="margin-bottom:16px">Ingresa tu PIN de acceso</div>
          <div class="login-stack">
            <input
              id="loginPin"
              class="pin-input-mobile"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="8"
              autocomplete="off"
              placeholder="••••"
              autofocus
            />
            <button id="go" type="button" class="btn login-submit-btn">Ingresar</button>
            <div id="loginErr" class="login-err" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Confirmación -->
  <div id="confirm-modal" class="modal-bg">
    <div class="modal-box glass">
      <div id="cm-title" style="font-weight:800;font-size:15px;margin-bottom:6px">Confirmar</div>
      <div id="cm-msg" class="m" style="font-size:12.5px;margin-bottom:14px;line-height:1.45"></div>
      <div class="row sp">
        <button id="cm-cancel" type="button" class="btn btn-s" style="flex:1">Cancelar</button>
        <button id="cm-ok" type="button" class="btn" style="flex:1">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Modal Vista Previa Imagen PNG -->
  <div id="img-modal" class="modal-bg">
    <div class="modal-box glass">
      <div class="row sp" style="margin-bottom:8px">
        <b id="im-title" style="font-size:13.5px">Reporte en Imagen</b>
        <button id="im-close" type="button" class="btn btn-s btn-xs">Cerrar</button>
      </div>
      <div style="background:#06090f;border-radius:12px;padding:6px;margin-bottom:10px;text-align:center">
        <img id="im-preview" alt="Vista previa" style="max-width:100%;height:auto;border-radius:8px;display:block;margin:0 auto" />
      </div>
      <div class="row" style="gap:6px">
        <button id="im-share" type="button" class="btn btn-info" style="flex:1">Compartir / Fotos</button>
        <a id="im-dl" download="reporte.png" class="btn" style="flex:1;text-decoration:none">Descargar PNG</a>
      </div>
    </div>
  </div>

  <!-- Toast flotante -->
  <div id="toast" class="toast"></div>

  <script>
    "use strict";

    // =========================================================================
    // CONFIGURACIÓN, CONSTANTES Y MAESTROS PRECARGADOS (HOJA 2)
    // =========================================================================
    const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbyilM2sXACMZfpctKQdxWrikrwD--hCUuEj55PImcL9ArnCKu1ffm1c1BsAHQOEVWBYNg/exec";
    const MASTER_PIN = "0104";
    const MASTER_FUNDO = "ADMI";
    const RETENTION_DAYS = 30;
    const FAST_AUTH_TIMEOUT_MS = 4000;
    const BG_SYNC_TIMEOUT_MS = 7000;

    const CACHE = {
      API_URL: "st_api_url_v1",
      DEMO: "st_demo_mode_v1",
      COLOR_MODE: "st_color_mode_v1",
      THEME: "st_theme_v1",
      GLOBAL_BG_IMAGE: "st_global_bg_image_v1",
      GLOBAL_BG_SCOPE: "st_global_bg_scope_v1",
      GLOBAL_GLASS_ALPHA: "st_global_glass_alpha_v1",
      ZONAS: "st_zonas_v2",
      USERS: "st_users_v3",
      PERSONAL: "st_personal_v1",
      LABORES: "st_labores_v1",
      CICLOS: "st_ciclos_v2",
      FORMATOS: "st_formatos_v1",
      DESTINOS: "st_destinos_v1",
      AJUSTE_LAST_FUNDO: "st_ajuste_last_fundo_v1",
      PROY_LAST_FUNDO: "st_proy_last_fundo_v1",

    function localIsoDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    const TODAY = localIsoDate(0);

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function normText(s) {
      return String(s ?? "").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function normFundoKey(s) {
      return normText(s).replace(/[_\s]+/g, " ").trim();
    }

    function formatFechaSlash(iso) {
      const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso || "");
    }

    function calcularSemanaISO(iso) {
      const m = String(iso || TODAY).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const dt = m ? new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]))) : new Date();
      const dayNum = dt.getUTCDay() || 7;
      dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
      return Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
    }

    function normalizePerfil(p) {
      const n = normText(p);
      if (n === "ADMIN" || n === "ADMI" || n === "MAESTRO") return "admi";
      if (n === "AUXILIAR" || n === "AUX") return "auxiliar";
      return "supervisor";
    }

    function perfilLabel(p) {
      const n = normalizePerfil(p);
      return n === "admi" ? "Admi" : (n === "auxiliar" ? "Auxiliar" : "Supervisor");
    }

    function parseUserZonas(uOrArr) {
      if (!uOrArr) return ["TRUJILLO"];
      if (Array.isArray(uOrArr)) {
        const clean = Array.from(new Set(uOrArr.map(normText).filter(Boolean)));
        return clean.length ? clean : ["TRUJILLO"];
      }
      if (typeof uOrArr === "object") {
        if (Array.isArray(uOrArr.zonas) && uOrArr.zonas.length) return parseUserZonas(uOrArr.zonas);
        return parseUserZonas(uOrArr.zona || "TRUJILLO");
      }
      const parts = String(uOrArr).split(/[,+/|]+/).map(normText).filter(Boolean);
      return parts.length ? Array.from(new Set(parts)) : ["TRUJILLO"];
    }

    function parseUserFundos(uOrArr) {
      if (!uOrArr) return [];
      const cleanOne = f => String(f ?? "").trim().toUpperCase();
      if (Array.isArray(uOrArr)) {
        const map = new Map();
        uOrArr.forEach(item => {
          const val = cleanOne(item);
          const k = normFundoKey(val);
          if (k && k !== "TODOS" && k !== MASTER_FUNDO && !map.has(k)) map.set(k, val);
        });
        return Array.from(map.values());
      }
      if (typeof uOrArr === "object") {
        if (Array.isArray(uOrArr.fundos) && uOrArr.fundos.length) return parseUserFundos(uOrArr.fundos);
        return parseUserFundos(uOrArr.fundo || "");
      }
      const parts = String(uOrArr).split(/[,+/|]+/).map(cleanOne).filter(Boolean);
      return parseUserFundos(parts);
    }

        try { localStorage.setItem(k, String(v)); } catch (e) {}
      },
      get(k, def = null) {
        try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
      },
      set(k, v) {
        try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
      },
      del(k) {
        try { localStorage.removeItem(k); } catch (e) {}

      purgeOlderThan30Days() {
        const limitIso = localIsoDate(-RETENTION_DAYS);
        const prefixes = [CACHE.TAREO_PREFIX, CACHE.ASIS_PREFIX, CACHE.AJUSTE_PREFIX, CACHE.PROY_PREFIX];
        try {
          const toDel = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!k) continue;
            const p = prefixes.find(px => k.startsWith(px));
            if (!p) continue;
            const m = k.slice(p.length).match(/^(\d{4}-\d{2}-\d{2})_/);
            if (m && m[1] < limitIso) toDel.push(k);
          }
          toDel.forEach(k => localStorage.removeItem(k));
        } catch (e) {}
      }
    };

    function comprimirImagenArchivo(file, maxSide = 1280, quality = 0.76) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Error al leer imagen"));
        reader.onload = ev => {
          const img = new Image();
          img.onerror = () => reject(new Error("Imagen no válida"));
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxSide || h > maxSide) {
              if (w > h) { h = Math.round(h * (maxSide / w)); w = maxSide; }
              else { w = Math.round(w * (maxSide / h)); h = maxSide; }
            }
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            c.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL("image/jpeg", quality));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function demoApiHandler(payload) {
      ensureHydrated();
      const acc = payload.accion;
      if (acc === "login") {
        if (S.pin === MASTER_PIN) return { ok: true, perfil: "admi", nombre: "Administrador", fundo: MASTER_FUNDO, fundos: [MASTER_FUNDO], zona: "TODAS", zonas: ["TODAS"] };
        const u = S.users.find(x => String(x.pin) === String(S.pin));
        return u ? { ok: true, ...u } : { ok: false, error: "PIN incorrecto" };
      }
      if (acc === "getPersonal") return { ok: true, data: store.getRaw(CACHE.PERSONAL, SEED_PERSONAL_TXT) };
      if (acc === "getLabores") return { ok: true, data: S.L };
      if (acc === "getConfig") {
        return {
          ok: true,
          data: {
            zonas: S.zonas,
            ciclos: S.ciclos,
            formatos: S.formatos,
            destinos: S.destinos,
            apariencia: {
              bgImage: getGlobalBgImageData(),
              bgScope: store.getRaw(CACHE.GLOBAL_BG_SCOPE, "both"),
              glassAlpha: store.getRaw(CACHE.GLOBAL_GLASS_ALPHA, "0.72")
            }
          }
        };
      }
      if (acc === "resumen") {
        const f = payload.fecha || S.fecha;
        const collect = prefix => {
          const arr = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!k || !k.startsWith(prefix + f + "_")) continue;
            const d = store.get(k, null);
            if (d && d.estado === "ENVIADO") {
              const parts = k.slice(prefix.length).split("_");
              const pinKey = parts[parts.length - 1];
              const fundoKey = parts.slice(1, -1).join("_");
              const uObj = S.users.find(x => String(x.pin) === pinKey);
              arr.push({
                fecha: f,
                fundo: fundoKey,
                usuario: uObj ? uObj.nombre : (pinKey === MASTER_PIN ? "Administrador" : "Supervisor"),
                responsable: d.responsable || (uObj ? uObj.nombre : "Responsable"),
                zona: uObj ? uObj.zona : "",
                filas: d.filas || []
              });
            }
          }
          return arr;
        };
        return {
          ok: true,
          data: collect(CACHE.TAREO_PREFIX),
          asistencia: collect(CACHE.ASIS_PREFIX),
          ajuste: collect(CACHE.AJUSTE_PREFIX),
          proyeccion: collect(CACHE.PROY_PREFIX)
        };
      }
      return { ok: true };
    }

    // =========================================================================
    // FUNDOS Y ZONAS REALES (CICLOS + USUARIOS MULTI-FUNDO)
    // =========================================================================
    function obtenerFundosDisponibles() {
      const mapUnico = new Map();
      const registrar = raw => {
        const clean = String(raw || "").trim().toUpperCase();
        const key = normFundoKey(clean);
        if (!key || key === "TODOS" || key === MASTER_FUNDO) return;
        if (!mapUnico.has(key)) mapUnico.set(key, clean);
      };
      (S.ciclos || []).forEach(c => registrar(c.fundo));
      (S.users || []).forEach(u => parseUserFundos(u).forEach(registrar));
      (S.fundosUsuario || []).forEach(registrar);
      return Array.from(mapUnico.values()).sort((a, b) => a.localeCompare(b, "es"));
    }

    function resolverZonaRegistro(reg) {
      if (reg && reg.zona) return normText(reg.zona);
      const fk = normFundoKey(reg?.fundo);
      if (!fk) return "";
      const cic = (S.ciclos || []).find(c => normFundoKey(c.fundo) === fk && c.zona);
      if (cic) return normText(cic.zona);
      const usr = (S.users || []).find(u => parseUserFundos(u).some(f => normFundoKey(f) === fk));
      if (usr) return parseUserZonas(usr)[0] || "";
      return "";
    }

    function obtenerFundosPermitidosUsuario() {
      const todos = obtenerFundosDisponibles();
      if (S.perfil === "admi") return todos;
      const misZonas = parseUserZonas(S.zonasUsuario.length ? S.zonasUsuario : S.zona);
      if (S.perfil === "auxiliar") {
        return todos.filter(fn => {
          const z = resolverZonaRegistro({ fundo: fn });
          return z && misZonas.includes(z);
        });
      }
      const misFundos = parseUserFundos(S.fundosUsuario.length ? S.fundosUsuario : S.fundo);
      if (!misFundos.length) return [];
      return misFundos.map(mf => todos.find(t => normFundoKey(t) === normFundoKey(mf)) || mf);
    }

    function obtenerFiltroFundoPersistente(cacheKey) {
      const saved = store.getRaw(cacheKey, "TODOS");
      const permitidos = obtenerFundosPermitidosUsuario();
      if (S.perfil === "supervisor") {
        if (saved && saved !== "TODOS") {
          const match = permitidos.find(f => normFundoKey(f) === normFundoKey(saved));
          if (match) return match;
        }
        return permitidos.length > 1 ? "TODOS" : (permitidos[0] || "TODOS");
      }
      if (saved && saved !== "TODOS") {
        const match = permitidos.find(f => normFundoKey(f) === normFundoKey(saved));
        return match || "TODOS";
      }
      return "TODOS";
    }

    function guardarFiltroFundoPersistente(cacheKey, val) {
      store.setRaw(cacheKey, val || "TODOS");
      return val || "TODOS";
    }

    function filtrarRegistrosPorZonaYFundo(lista) {
      const misZonas = parseUserZonas(S.zonasUsuario.length ? S.zonasUsuario : S.zona);
      return (lista || []).filter(reg => {
        const zReg = resolverZonaRegistro(reg);
        if (S.perfil !== "admi" && zReg && !misZonas.includes(zReg)) return false;
        if (S.resumenFiltroZona !== "TODAS" && zReg !== S.resumenFiltroZona) return false;
        if (S.resumenFiltroFundo !== "TODOS" && normFundoKey(reg.fundo) !== normFundoKey(S.resumenFiltroFundo)) return false;
        return true;
      });
    }

    function obtenerModulosPorFundo(fundo) {
      const fk = normFundoKey(fundo);
      const mods = Array.from(new Set((S.ciclos || []).filter(c => normFundoKey(c.fundo) === fk).map(c => String(c.modulo).trim()).filter(Boolean)));
      return mods.length ? mods : ["1"];
    }

    function obtenerVariedadesPorFundoYModulo(fundo, modulo) {
      const fk = normFundoKey(fundo);
      const mk = String(modulo || "").trim();
      const vars = Array.from(new Set((S.ciclos || []).filter(c => normFundoKey(c.fundo) === fk && String(c.modulo).trim() === mk).map(c => String(c.variedad).trim()).filter(Boolean)));
      if (vars.length) return vars;
      const porFundo = Array.from(new Set((S.ciclos || []).filter(c => normFundoKey(c.fundo) === fk).map(c => String(c.variedad).trim()).filter(Boolean)));
      return porFundo.length ? porFundo : ["—"];
    }

    function buscarCiclo(fundo, modulo, variedad) {
      const fk = normFundoKey(fundo);
      const mk = String(modulo || "").trim();
      const vk = normText(variedad);
      const exact = (S.ciclos || []).find(c => normFundoKey(c.fundo) === fk && String(c.modulo).trim() === mk && normText(c.variedad) === vk);
      if (exact) return Number(exact.ciclo) || 0;
      const byMod = (S.ciclos || []).find(c => normFundoKey(c.fundo) === fk && String(c.modulo).trim() === mk);
      return byMod ? (Number(byMod.ciclo) || 0) : 0;
    }

    function crearFilaAjusteVacia(fundoPre = "") {
      const permitidos = obtenerFundosPermitidosUsuario();
      const fn = (fundoPre && fundoPre !== "TODOS") ? fundoPre : (permitidos[0] || "");
      const mod = fn ? (obtenerModulosPorFundo(fn)[0] || "1") : "1";
      const vr = fn ? (obtenerVariedadesPorFundoYModulo(fn, mod)[0] || "") : "";
      return recalcularFilaAjuste({
        fecha: S.fecha, fundo: fn, modulo: mod, variedad: vr, ciclo: buscarCiclo(fn, mod, vr),
        responsable: S.nombre, formato: S.formatos[0] || "Granel", destino: S.destinos[0] || "USA",
        diasReingreso: "", ha: 0, kgHa: 0, jornales: 0
      }, S.fecha);
    }

    function recalcularFilaAjuste(raw, fechaDefault = S.fecha) {
      const fecha = raw.fecha || fechaDefault;
      const semana = calcularSemanaISO(fecha);
      const ha = Number(raw.ha) || 0;
      const kgHa = Number(raw.kgHa) || 0;
      const jornales = Number(raw.jornales) || 0;
      const kilos = Math.round(ha * kgHa);
      const kgJornales = jornales > 0 ? Number((kilos / jornales).toFixed(1)) : 0;
      const cicloAuto = buscarCiclo(raw.fundo, raw.modulo, raw.variedad);
      return {
        semana, fecha, tipo: "Cosecha",
        fundo: raw.fundo || "", modulo: String(raw.modulo || ""), variedad: raw.variedad || "",
        ciclo: cicloAuto || Number(raw.ciclo) || 0,
        responsable: raw.responsable || S.nombre,
        formato: raw.formato || S.formatos[0] || "Granel",
        destino: raw.destino || S.destinos[0] || "USA",
        diasReingreso: raw.diasReingreso === "" || raw.diasReingreso === undefined ? "" : Number(raw.diasReingreso),
        ha, kgHa, jornales, kilos, kgJornales
      };
    }

    function crearFilaProyeccionVacia(fundoPre = "") {
      const permitidos = obtenerFundosPermitidosUsuario();
      const fn = (fundoPre && fundoPre !== "TODOS") ? fundoPre : (permitidos[0] || "");
      const mod = fn ? (obtenerModulosPorFundo(fn)[0] || "1") : "1";
      const vr = fn ? (obtenerVariedadesPorFundoYModulo(fn, mod)[0] || "") : "";
      return recalcularFilaProyeccion({
        fecha: S.fechaProy, fundo: fn, modulo: mod, variedad: vr, ciclo: buscarCiclo(fn, mod, vr),
        formato: "", destino: "", diasReingreso: "", ha: 0, kgHa: 0, jornales: 0
      }, S.fechaProy);
    }

    function recalcularFilaProyeccion(raw, fechaDefault = S.fechaProy) {
      const fecha = raw.fecha || fechaDefault;
      const semana = calcularSemanaISO(fecha);
      const ha = Number(raw.ha) || 0;
      const kgHa = Number(raw.kgHa) || 0;
      const jornales = Number(raw.jornales) || 0;
      const kilos = Math.round(ha * kgHa);
      const kgJornales = jornales > 0 ? Number((kilos / jornales).toFixed(1)) : 0;
      const cicloAuto = buscarCiclo(raw.fundo, raw.modulo, raw.variedad);
      return {
        semana, fecha, tipo: "Cosecha",
        fundo: raw.fundo || "", modulo: String(raw.modulo || ""), variedad: raw.variedad || "",
        ciclo: cicloAuto || Number(raw.ciclo) || 0,
        formato: "", destino: "",
        diasReingreso: raw.diasReingreso === "" || raw.diasReingreso === undefined ? "" : Number(raw.diasReingreso),

    }

    function abrirSesion(perfilRaw, nombre, fundoRaw, zonaRaw, zonasArrRaw = null, fundosArrRaw = null) {
      ensureHydrated();
      const perfil = normalizePerfil(perfilRaw);
      S.perfil = perfil;
      S.nombre = nombre || (perfil === "admi" ? "Administrador" : "Responsable");

      const fs = perfil === "admi" ? [MASTER_FUNDO] : (perfil === "auxiliar" ? [] : parseUserFundos(fundosArrRaw || fundoRaw));
      S.fundosUsuario = fs;
      S.fundo = perfil === "admi" ? MASTER_FUNDO : (perfil === "auxiliar" ? "TODOS" : (fs[0] || ""));

      const zs = perfil === "admi" ? ["TODAS"] : parseUserZonas(zonasArrRaw || zonaRaw || "TRUJILLO");
      S.zonasUsuario = zs;
      S.zona = formatZonasLabel(zs);

      S.resumenFiltroZona = "TODAS";
      S.resumenFiltroFundo = "TODOS";

    async function doLogin(pinForzado = null) {
      if (authInFlight) return;
      const pinEl = $("loginPin");
      const goEl = $("go");
      const errEl = $("loginErr");
      if (errEl) errEl.textContent = "";
      const pin = (pinForzado !== null ? String(pinForzado) : (pinEl?.value || "")).replace(/\D/g, "").trim();
      if (!pin) return mostrarErrorPin("Ingresa tu PIN");

      ensureHydrated();
      S.pin = pin;

      if (pin === MASTER_PIN) {
        abrirSesion("admi", "Administrador", MASTER_FUNDO, "TODAS", ["TODAS"], [MASTER_FUNDO]);
        if (!S.demo) api({ accion: "login" }, BG_SYNC_TIMEOUT_MS);
        return;
      }

      const localUser = S.users.find(u => String(u.pin) === pin);
      if (localUser) {
        abrirSesion(localUser.perfil || "supervisor", localUser.nombre, localUser.fundo, localUser.zona || "TRUJILLO", localUser.zonas, localUser.fundos);
        if (!S.demo) {
          api({ accion: "login" }, BG_SYNC_TIMEOUT_MS).then(r => {
            if (r && r.ok && S.pin === pin) {
              S.nombre = r.nombre || S.nombre;
              if (r.perfil) S.perfil = normalizePerfil(r.perfil);
              if (r.fundos || r.fundo) {
                S.fundosUsuario = parseUserFundos(r.fundos || r.fundo);
                S.fundo = S.perfil === "auxiliar" ? "TODOS" : (S.fundosUsuario[0] || S.fundo);
              }
              if (r.zonas || r.zona) {
                S.zonasUsuario = parseUserZonas(r.zonas || r.zona);
                S.zona = formatZonasLabel(S.zonasUsuario);
              }
            }
          });
        }
        return;
      }

      if (S.demo) { limpiarSesionMemoria(); return mostrarErrorPin("PIN incorrecto"); }

      authInFlight = true;
      if (goEl) { goEl.disabled = true; goEl.textContent = "Verificando..."; }
      const r = await api({ accion: "login" }, FAST_AUTH_TIMEOUT_MS);
      authInFlight = false;
      if (goEl) { goEl.disabled = false; goEl.textContent = "Ingresar"; }

      if (!r || !r.ok) { limpiarSesionMemoria(); return mostrarErrorPin((r && r.error) || "PIN incorrecto"); }

      const perfilSrv = normalizePerfil(r.perfil || r.rol);
      const zsSrv = parseUserZonas(r.zonas || r.zona || "TRUJILLO");
      const zonaSrv = formatZonasLabel(zsSrv);
      const fsSrv = perfilSrv === "auxiliar" ? ["TODOS"] : parseUserFundos(r.fundos || r.fundo);
      const fundoSrv = perfilSrv === "auxiliar" ? "TODOS" : formatFundosLabel(fsSrv);
      S.users.push({ nombre: r.nombre || "Responsable", perfil: perfilSrv, zona: zonaSrv, zonas: zsSrv, fundo: fundoSrv, fundos: fsSrv, pin });
      sincronizarZonasDesdeMaestros();
      store.set(CACHE.USERS, S.users);
      abrirSesion(perfilSrv, r.nombre, fundoSrv, zonaSrv, zsSrv, fsSrv);
    }

    function bindLoginEvents() {
      const pinEl = $("loginPin");
      const goEl = $("go");
      if (!pinEl || !goEl) return;

      const handlePinCheck = e => {
        const clean = String(pinEl.value || "").replace(/\D/g, "").slice(0, 8);
        if (pinEl.value !== clean) pinEl.value = clean;
        if (clean.length === 4 && !authInFlight) doLogin(clean);
        else if (e && e.key === "Enter" && clean.length > 0 && !authInFlight) doLogin(clean);
      };

      pinEl.addEventListener("input", handlePinCheck);
      pinEl.addEventListener("keyup", handlePinCheck);
      pinEl.addEventListener("change", handlePinCheck);
      goEl.onclick = () => doLogin();
    }

    function leerArchivoComoMatriz(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
        reader.onload = e => {
          try {
            if (window.XLSX) {
              const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
              const ws = wb.Sheets[wb.SheetNames[0]];
              resolve(XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" }));
            } else {
              const txt = new TextDecoder("utf-8").decode(new Uint8Array(e.target.result));
              const lines = txt.split(/\r?\n/).filter(l => l.trim());
              const sep = lines[0]?.includes("\t") ? "\t" : (lines[0]?.includes(";") ? ";" : ",");
              resolve(lines.map(l => l.split(sep).map(c => c.trim())));
            }
          } catch (err) { reject(new Error("Formato de archivo no válido")); }
        };
        reader.readAsArrayBuffer(file);
      });
    }

    function matrizExcelAFilasTareo(matriz) {
      const out = [];
      let idxDni = 1, idxLab = 0, idxHor = 2;
      matriz.forEach((row, rIdx) => {
        const cols = row.map(c => String(c ?? "").trim());
        if (!cols.some(Boolean)) return;
        const normCols = cols.map(normText);
        if (rIdx === 0 && (normCols.some(c => c.includes("DNI")) || normCols.some(c => c.includes("LABOR")))) {
          const d = normCols.findIndex(c => c.includes("DNI"));
          const l = normCols.findIndex(c => c.includes("LABOR") || c.includes("COD"));
          const h = normCols.findIndex(c => c.includes("HORA") || c.includes("HR"));
          if (d !== -1) idxDni = d;
          if (l !== -1) idxLab = l;
          if (h !== -1) idxHor = h;
          return;
        }
        const rawDni = String(cols[idxDni] || "").replace(/\D/g, "");
        if (!rawDni) return;
        const dni = rawDni.padStart(8, "0").slice(-8);
        const labor = String(cols[idxLab] || S.L[0]?.codigo || "").trim();
        const horas = Math.min(24, Math.max(1, Number(cols[idxHor]) || 8));
        out.push({ dni, labor, horas });
      });
      return out;
    }

                <div class="m" style="font-size:10.5px">Sube tu plantilla con C.LABOR, DNI y HORAS</div>
              </div>
              <label for="t-masivo-file" class="btn" style="flex-shrink:0">📥 Masivo</label>
              <input type="file" id="t-masivo-file" accept=".xlsx,.xls,.csv,.tsv" style="display:none" />
            </div>
          </div>
        `}
        <div id="t-list"></div>
        <div class="card">
          ${soloLectura ? `
            <div class="row sp">
              <span class="m">Tareo enviado correctamente.</span>
              <div class="row">
                <button id="btn-t-edit" type="button" class="btn btn-w btn-xs">Editar tareo</button>
                <button id="btn-t-del" type="button" class="btn btn-d btn-xs">Borrar enviado</button>
              </div>
            </div>
          ` : `
            <div class="row sp" style="gap:6px">
              <button id="btn-t-add" type="button" class="btn btn-s" style="flex:1">+ Agregar fila</button>
              ${esEnviado && S.editandoEnviado ? `<button id="btn-t-cancel" type="button" class="btn btn-s">Cancelar</button>` : ""}
            </div>
            <div class="row" style="margin-top:6px;gap:6px">
              ${!esEnviado ? `<button id="btn-t-bor" type="button" class="btn btn-w" style="flex:1">Guardar borrador</button>` : ""}
              <button id="btn-t-env" type="button" class="btn" style="flex:1">${esEnviado ? "Actualizar envío" : "Enviar al Maestro"}</button>
              ${esEnviado ? `<button id="btn-t-del2" type="button" class="btn btn-d">Borrar enviado</button>` : ""}
            </div>
          `}
        </div>
      `;

      $("btn-t-xls").onclick = () => {
        const validas = S.filas.filter(x => String(x.dni || "").replace(/\D/g, "").length >= 6);
        const rows = [["Fecha", "Fundo", "Responsable", "DNI", "Trabajador", "Cod. Labor", "Labor", "Horas"]];
        validas.forEach(x => {
          const dni = String(x.dni).replace(/\D/g, "").padStart(8, "0").slice(-8);
          const pers = S.P.get(dni);
          const labObj = S.L.find(l => String(l.codigo) === String(x.labor));
          rows.push([S.fecha, S.fundo, S.nombre, dni, pers ? pers.nombre : "NO TIENE CONTRATO", x.labor, labObj ? labObj.nombre : "", Number(x.horas) || 8]);
        });
        descargarExcelDesdeMatriz(rows, `Tareo_${S.fundo}_${S.fecha}.xlsx`, "Tareo");
      };

      $("f-tareo").onchange = async e => {
        const token = ++S.renderToken;
        S.fecha = e.target.value;
        cargarTareoDesdeCache(); renderTareo();
        const ok = await cargarTareo(token);
        if (ok && S.renderToken === token && S.activeView === "tareo" && !S.editandoEnviado) renderTareo();
      };

      const borrarEnviado = async () => {
        const ok = await confirmar("¿Borrar tareo enviado?", `Se eliminará el envío del ${S.fecha}.`, "Borrar", true);
        if (!ok) return;
        const r = await api({ accion: "borrarTareo", fecha: S.fecha, fundo: S.fundo, targetPin: S.pin });
        if (!r.ok) return toast(r.error);
        store.del(tareoCacheKey());
        S.filas = [{ dni: "", labor: S.L[0]?.codigo || "", horas: 8 }];
        S.estado = "NUEVO"; S.editandoEnviado = false;
        toast("Envío eliminado");
        if (S.activeView === "tareo") renderTareo();
      };

      if (soloLectura) {
        $("btn-t-edit").onclick = () => { S.renderToken++; S.editandoEnviado = true; renderTareo(); };
        $("btn-t-del").onclick = borrarEnviado;
      } else {
        if ($("t-masivo-file")) {
          $("t-masivo-file").onchange = async e => {
            const f = e.target.files[0];
            if (!f) return;
            try {
              const matriz = await leerArchivoComoMatriz(f);
              const nuevas = matrizExcelAFilasTareo(matriz);
              if (!nuevas.length) return toast("No se encontraron DNIs válidos");
              S.filas = S.filas.filter(x => x.dni).concat(nuevas);
              pintarTarjetasTareo(false);
              toast(`✓ ${nuevas.length} trabajadores cargados`);
            } catch (err) { toast(err.message || "Error al leer Excel"); }
            e.target.value = "";
          };
        }
        $("btn-t-add").onclick = () => {
          const ultimaLab = S.filas.length ? S.filas[S.filas.length - 1].labor : (S.L[0]?.codigo || "");
          S.filas.push({ dni: "", labor: ultimaLab, horas: 8 });
          pintarTarjetasTareo(false);
        };
        if ($("btn-t-cancel")) $("btn-t-cancel").onclick = () => { S.renderToken++; S.editandoEnviado = false; cargarTareoDesdeCache(); renderTareo(); };
        if ($("btn-t-del2")) $("btn-t-del2").onclick = borrarEnviado;

        const prepararFilasTareo = () => S.filas
          .filter(x => String(x.dni || "").replace(/\D/g, "").length >= 6)
          .map(x => {
            const dni = String(x.dni).replace(/\D/g, "").padStart(8, "0").slice(-8);
            const pers = S.P.get(dni);
            return { dni, nombre: pers ? pers.nombre : "NO TIENE CONTRATO", labor: x.labor || S.L[0]?.codigo || "", horas: Number(x.horas) || 8 };
          });

        if ($("btn-t-bor")) {
          $("btn-t-bor").onclick = async () => {
            const limpias = prepararFilasTareo();
            store.set(tareoCacheKey(), { filas: S.filas, estado: "BORRADOR" });
            S.estado = "BORRADOR"; renderTareo();
            const r = await api({ accion: "guardarBorrador", fecha: S.fecha, filas: limpias });
            if (!r.ok) return toast(r.error);
            toast("Borrador guardado");
          };
        }

        $("btn-t-env").onclick = async () => {
          const limpias = prepararFilasTareo();
          if (!limpias.length) return toast("Ingresa al menos un DNI válido");
          const totH = limpias.reduce((a, b) => a + (Number(b.horas) || 0), 0);
          const ok = await confirmar(esEnviado ? "¿Actualizar tareo?" : "¿Enviar tareo?", `Se enviarán ${limpias.length} trabajadores (${totH} h) del ${S.fecha}.`, esEnviado ? "Actualizar" : "Enviar");
          if (!ok) return;
          $("btn-t-env").disabled = true;
          const r = await api({ accion: "enviarTareo", fecha: S.fecha, filas: limpias });
          if ($("btn-t-env")) $("btn-t-env").disabled = false;
          if (!r.ok) return toast(r.error);
          S.filas = limpias; S.estado = "ENVIADO"; S.editandoEnviado = false;
          store.set(tareoCacheKey(), { filas: limpias, estado: "ENVIADO", enviado: new Date().toISOString() });
          toast(esEnviado ? "Tareo actualizado" : "¡Tareo enviado!");
          if (S.activeView === "tareo") renderTareo();
        };
      }
      pintarTarjetasTareo(soloLectura);
    }

    function actualizarStatsTareo() {
      const validas = S.filas.filter(x => String(x.dni || "").replace(/\D/g, "").length >= 6);
      const totH = validas.reduce((a, b) => a + (Number(b.horas) || 0), 0);
      if ($("t-stats")) $("t-stats").textContent = `${validas.length} pers. · ${totH} h`;
    }

    function pintarTarjetasTareo(soloLectura = false) {
      const list = $("t-list");
      if (!list || S.activeView !== "tareo") return;
      const dis = soloLectura ? "disabled" : "";

      list.innerHTML = S.filas.map((row, idx) => {
        const dniClean = String(row.dni || "").replace(/\D/g, "");
        const dniPad = dniClean.length >= 6 ? dniClean.padStart(8, "0").slice(-8) : "";
        const pers = dniPad ? S.P.get(dniPad) : null;
        let nameHtml = `<span class="m">Escribe el DNI para autocompletar</span>`;
        let nameClass = "worker-name-pill";

        if (dniClean.length > 0 && dniClean.length < 8) nameHtml = `<span class="m">Completando DNI (${dniClean.length}/8)...</span>`;
        else if (dniClean.length >= 8) {
          if (pers) nameHtml = `✓ ${esc(pers.nombre)}`;
          else if (S.P.size > 0) { nameHtml = `⚠ NO TIENE CONTRATO`; nameClass += " no-contrato"; }
          else nameHtml = `DNI ${esc(dniPad)}`;
        }

        const labOpts = S.L.map(l => `<option value="${esc(l.codigo)}" ${String(row.labor) === String(l.codigo) ? "selected" : ""}>${esc(l.codigo)} · ${esc(l.nombre)}</option>`).join("");

        return `
          <div class="worker-card">
            <div class="row" style="flex-wrap:nowrap">
              <span class="t-num">${idx + 1}</span>
              <div class="dni-box">
                <input ${dis} type="tel" inputmode="numeric" maxlength="8" placeholder="DNI (8 dígitos)" value="${esc(row.dni)}" data-dni="${idx}" />
                ${!soloLectura && row.dni ? `<button type="button" class="dni-clear" data-dniclr="${idx}">✕</button>` : ""}
              </div>
              ${soloLectura ? "" : `<button type="button" class="btn btn-d btn-xs" data-tdel="${idx}">Eliminar</button>`}
            </div>
            <div class="${nameClass}" data-namebox="${idx}">${nameHtml}</div>
            <div class="row" style="flex-wrap:nowrap;gap:6px">
              <select ${dis} style="flex:1;min-width:0" data-tlab="${idx}">
                <option value="">— Elegir Labor —</option>
                ${labOpts}
              </select>
              <div class="stepper">
                <button ${dis} type="button" data-thminus="${idx}">−</button>
                <span data-thval="${idx}">${Number(row.horas) || 8}</span>
                <button ${dis} type="button" data-thplus="${idx}">+</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      if (!soloLectura) {
        list.querySelectorAll("[data-dni]").forEach(inp => {
          inp.oninput = e => {
            const i = Number(e.target.dataset.dni);
            const val = e.target.value.replace(/\D/g, "").slice(0, 8);
            e.target.value = val; S.filas[i].dni = val;
            const box = list.querySelector(`[data-namebox="${i}"]`);
            if (box) {
              if (!val) { box.className = "worker-name-pill"; box.innerHTML = `<span class="m">Escribe el DNI para autocompletar</span>`; }
              else if (val.length < 8) { box.className = "worker-name-pill"; box.innerHTML = `<span class="m">Completando DNI (${val.length}/8)...</span>`; }
              else {
                const p = S.P.get(val);
                if (p) { box.className = "worker-name-pill"; box.textContent = `✓ ${p.nombre}`; }
                else if (S.P.size > 0) { box.className = "worker-name-pill no-contrato"; box.textContent = "⚠ NO TIENE CONTRATO"; }
                else { box.className = "worker-name-pill"; box.textContent = `DNI ${val}`; }
              }
            }
            actualizarStatsTareo();
          };
        });
        list.querySelectorAll("[data-dniclr]").forEach(btn => { btn.onclick = () => { S.filas[Number(btn.dataset.dniclr)].dni = ""; pintarTarjetasTareo(false); }; });
        list.querySelectorAll("[data-tdel]").forEach(btn => {
          btn.onclick = () => {
            S.filas.splice(Number(btn.dataset.tdel), 1);
            if (!S.filas.length) S.filas.push({ dni: "", labor: S.L[0]?.codigo || "", horas: 8 });
            pintarTarjetasTareo(false);
          };
        });
        list.querySelectorAll("[data-tlab]").forEach(sel => { sel.onchange = e => { S.filas[Number(e.target.dataset.tlab)].labor = e.target.value; }; });
        list.querySelectorAll("[data-thminus]").forEach(btn => {
          btn.onclick = () => {
            const i = Number(btn.dataset.thminus);
            S.filas[i].horas = Math.max(1, (Number(S.filas[i].horas) || 8) - 1);
            const sp = list.querySelector(`[data-thval="${i}"]`);
            if (sp) sp.textContent = S.filas[i].horas;
            actualizarStatsTareo();
          };
        });
        list.querySelectorAll("[data-thplus]").forEach(btn => {
          btn.onclick = () => {
            const i = Number(btn.dataset.thplus);
            S.filas[i].horas = Math.min(24, (Number(S.filas[i].horas) || 8) + 1);
            const sp = list.querySelector(`[data-thval="${i}"]`);
            if (sp) sp.textContent = S.filas[i].horas;
            actualizarStatsTareo();
          };
        });
      }
      actualizarStatsTareo();
    }

    // =========================================================================
    // VISTA 2: ASISTENCIA / DISTRIBUCIÓN COSECHA (CON MULTI-FUNDO VISIBLE)
    // =========================================================================
    function totalFilaAsis(r) {
      return (Number(r.cosecha) || 0) + (Number(r.supCiclo) || 0) + (Number(r.supCuadrilla) || 0) +
        (Number(r.jabero) || 0) + (Number(r.limpieza) || 0) + (Number(r.riego) || 0) + (Number(r.otros) || 0);
    }

    function renderAsistencia() {
      const pane = $("pane-asistencia");
      if (!pane || S.activeView !== "asistencia") return;
      const esEnviado = S.asisEstado === "ENVIADO";
      const soloLectura = esEnviado && !S.asisEditandoEnviado;
      const permitidos = obtenerFundosPermitidosUsuario();

      let badge = `<span class="badge b-new">NUEVO</span>`;
      if (S.asisEstado === "BORRADOR") badge = `<span class="badge b-bor">BORRADOR</span>`;
      else if (esEnviado && !S.asisEditandoEnviado) badge = `<span class="badge b-env">ENVIADO</span>`;
      else if (esEnviado && S.asisEditandoEnviado) badge = `<span class="badge b-bor">EDITANDO</span>`;

      pane.innerHTML = `
        <div class="card">
          <div class="row sp" style="margin-bottom:6px">
            <div class="row"><input type="date" id="f-asis" value="${S.fecha}" />${badge}</div>
            <div class="row" style="gap:4px">
              <button id="btn-asis-img" type="button" class="btn btn-info btn-xs">🖼 Foto PNG</button>
              <button id="btn-asis-xls" type="button" class="btn btn-s btn-xs">📊 Excel</button>
            </div>
          </div>

          ${permitidos.length > 1 ? `
            <div class="row" style="margin-bottom:6px;gap:6px;flex-wrap:nowrap">
              <select id="asis-fundo-sel" style="flex:1;font-weight:700;font-size:12px;border-color:var(--accent-border)">
                ${permitidos.map(fn => `<option value="${esc(fn)}" ${normFundoKey(S.asisFundoActivo) === normFundoKey(fn) ? "selected" : ""}>🌾 Fundo Asistencia: ${esc(fn)}</option>`).join("")}
              </select>
              <span class="badge b-auto">${permitidos.length} fundos</span>
            </div>
          ` : (S.asisFundoActivo ? `<div class="row" style="margin-bottom:6px"><span class="badge b-env">🌾 Fundo: ${esc(S.asisFundoActivo)}</span></div>` : "")}

          <div class="row" style="gap:6px">
            <input ${soloLectura ? "disabled" : ""} id="asis-resp" value="${esc(S.asisResponsable)}" placeholder="Responsable" style="flex:1" />
          </div>
        </div>

        ${soloLectura ? "" : `
          <div class="masivo-banner">
            <div class="row sp" style="flex-wrap:nowrap">
              <div style="min-width:0;flex:1">
                <div style="font-weight:800;font-size:12px">Subir Distribución por Excel</div>
                <div class="m" style="font-size:10.5px">Fundo, Grupo, Supervisor, Cosecha, Jabero, etc.</div>
              </div>
              <label for="asis-masivo-file" class="btn" style="flex-shrink:0">📥 Masivo</label>
              <input type="file" id="asis-masivo-file" accept=".xlsx,.xls,.csv,.tsv" style="display:none" />
            </div>
          </div>
        `}

        <div id="asis-list"></div>
        <div class="card" id="asis-totales"></div>

        <div class="card">
          ${soloLectura ? `
            <div class="row sp">
              <span class="m">Distribución enviada.</span>
              <div class="row">
                <button id="btn-a-edit" type="button" class="btn btn-w btn-xs">Editar</button>
                <button id="btn-a-del" type="button" class="btn btn-d btn-xs">Borrar enviado</button>
              </div>
            </div>
          ` : `
            <div class="row sp" style="gap:6px">
              <button id="btn-a-add" type="button" class="btn btn-s" style="flex:1">+ Agregar supervisor</button>
              ${esEnviado && S.asisEditandoEnviado ? `<button id="btn-a-cancel" type="button" class="btn btn-s">Cancelar</button>` : ""}
            </div>
            <div class="row" style="margin-top:6px;gap:6px">
              ${!esEnviado ? `<button id="btn-a-bor" type="button" class="btn btn-w" style="flex:1">Guardar borrador</button>` : ""}
              <button id="btn-a-env" type="button" class="btn" style="flex:1">${esEnviado ? "Actualizar envío" : "Enviar asistencia"}</button>
              ${esEnviado ? `<button id="btn-a-del2" type="button" class="btn btn-d">Borrar enviado</button>` : ""}
            </div>
          `}
        </div>
      `;

      if ($("asis-fundo-sel")) {
        $("asis-fundo-sel").onchange = async e => {
          const token = ++S.renderToken;
          S.asisFundoActivo = e.target.value;
          cargarAsistenciaDesdeCache();
          renderAsistencia();
          const ok = await cargarAsistencia(token);
          if (ok && S.renderToken === token && S.activeView === "asistencia" && !S.asisEditandoEnviado) renderAsistencia();
        };
      }

      $("f-asis").onchange = async e => {
        const token = ++S.renderToken;
        S.fecha = e.target.value;
        cargarAsistenciaDesdeCache(); renderAsistencia();
        const ok = await cargarAsistencia(token);
        if (ok && S.renderToken === token && S.activeView === "asistencia" && !S.asisEditandoEnviado) renderAsistencia();
      };

      $("btn-asis-img").onclick = () => exportarAsistenciaImagen(S.fecha, `${S.asisResponsable || S.nombre} · ${S.asisFundoActivo || S.fundo}`, S.asisFilas);
      $("btn-asis-xls").onclick = () => exportarAsistenciaExcel(S.asisFilas, `Distribucion_${S.asisFundoActivo || S.fundo}_${S.fecha}`);

      const borrarAsis = async () => {
        const fnTarget = S.asisFundoActivo || S.fundo;
        const ok = await confirmar("¿Borrar asistencia enviada?", `Se eliminará la distribución de ${fnTarget} del ${S.fecha}.`, "Borrar", true);
        if (!ok) return;
        const r = await api({ accion: "borrarAsistencia", fecha: S.fecha, fundo: fnTarget, targetPin: S.pin });
        if (!r.ok) return toast(r.error);
        store.del(asisCacheKey(S.fecha, fnTarget, S.pin));
        S.asisFilas = [{ fundo: fnTarget, grupo: "1", supervisor: "", cosecha: 0, supCiclo: 0, supCuadrilla: 0, jabero: 0, limpieza: 0, riego: 0, otros: 0 }];
        S.asisEstado = "NUEVO"; S.asisEditandoEnviado = false;
        toast("Asistencia eliminada");
        if (S.activeView === "asistencia") renderAsistencia();
      };

      if (soloLectura) {
        $("btn-a-edit").onclick = () => { S.renderToken++; S.asisEditandoEnviado = true; renderAsistencia(); };
        $("btn-a-del").onclick = borrarAsis;
      } else {
        $("asis-resp").oninput = e => { S.asisResponsable = e.target.value; };
        if ($("btn-a-del2")) $("btn-a-del2").onclick = borrarAsis;
        if ($("asis-masivo-file")) {
          $("asis-masivo-file").onchange = async e => {
            const f = e.target.files[0];
            if (!f) return;
            try {
              const matriz = await leerArchivoComoMatriz(f);
              const nuevas = [];
              matriz.forEach((row, idx) => {
                const c = row.map(v => String(v ?? "").trim());
                if (!c.some(Boolean)) return;
                if (idx === 0 && normText(c.join(" ")).includes("SUPERVISOR")) return;
                if (!c[0] && !c[2]) return;
                nuevas.push({
                  fundo: c[0] || S.asisFundoActivo || "", grupo: c[1] || "", supervisor: c[2] || "",
                  cosecha: Number(c[3]) || 0, supCiclo: Number(c[4]) || 0, supCuadrilla: Number(c[5]) || 0,
                  jabero: Number(c[6]) || 0, limpieza: Number(c[7]) || 0, riego: Number(c[8]) || 0, otros: Number(c[9]) || 0
                });
              });
              if (!nuevas.length) return toast("No se detectaron filas válidas");
              S.asisFilas = S.asisFilas.filter(x => x.supervisor || totalFilaAsis(x) > 0).concat(nuevas);
              pintarFilasAsistencia(false);
              toast(`✓ ${nuevas.length} filas cargadas`);
            } catch (err) { toast(err.message || "Error al leer Excel"); }
            e.target.value = "";
          };
        }
        $("btn-a-add").onclick = () => {
          S.asisFilas.push({ fundo: S.asisFundoActivo || "", grupo: String(S.asisFilas.length + 1), supervisor: "", cosecha: 0, supCiclo: 0, supCuadrilla: 0, jabero: 0, limpieza: 0, riego: 0, otros: 0 });
          pintarFilasAsistencia(false);
        };
        if ($("btn-a-cancel")) $("btn-a-cancel").onclick = () => { S.renderToken++; S.asisEditandoEnviado = false; cargarAsistenciaDesdeCache(); renderAsistencia(); };

        const armarAsis = () => S.asisFilas.filter(x => x.supervisor.trim() || totalFilaAsis(x) > 0).map(x => ({ ...x, fundo: x.fundo || S.asisFundoActivo || "" }));
        if ($("btn-a-bor")) {
          $("btn-a-bor").onclick = async () => {
            const limpias = armarAsis();
            const fnTarget = S.asisFundoActivo || S.fundo;
            store.set(asisCacheKey(S.fecha, fnTarget, S.pin), { responsable: S.asisResponsable, filas: S.asisFilas, estado: "BORRADOR" });
            S.asisEstado = "BORRADOR"; renderAsistencia();
            await api({ accion: "guardarAsistenciaBorrador", fecha: S.fecha, fundo: fnTarget, responsable: S.asisResponsable, filas: limpias });
            toast("Borrador guardado");
          };
        }
        $("btn-a-env").onclick = async () => {
          const limpias = armarAsis();
          if (!limpias.length) return toast("Ingresa al menos un supervisor");
          const fnTarget = limpias[0].fundo || S.asisFundoActivo || S.fundo;
          const tot = limpias.reduce((a, b) => a + totalFilaAsis(b), 0);
          const ok = await confirmar(esEnviado ? "¿Actualizar asistencia?" : "¿Enviar asistencia?", `Se enviarán ${limpias.length} supervisores (${tot} personas) de ${fnTarget} (${S.fecha}).`, esEnviado ? "Actualizar" : "Enviar");
          if (!ok) return;
          $("btn-a-env").disabled = true;
          const r = await api({ accion: "enviarAsistencia", fecha: S.fecha, fundo: fnTarget, responsable: S.asisResponsable, filas: limpias });
          if ($("btn-a-env")) $("btn-a-env").disabled = false;
          if (!r.ok) return toast(r.error);
          S.asisFilas = limpias; S.asisEstado = "ENVIADO"; S.asisEditandoEnviado = false;

    // =========================================================================
    // VISTA 3: AJUSTE (16 COLUMNAS)
    // =========================================================================
    function matrizAjusteMasivoAFilas(matriz) {
      const out = [];
      matriz.forEach((row, idx) => {
        const c = row.map(v => String(v ?? "").trim());
        if (!c.some(Boolean)) return;
        const joined = normText(c.join(" "));
        if (idx === 0 && (joined.includes("VARIEDAD") || joined.includes("JORNALES") || joined.includes("MODULO"))) return;

        let fecha = S.fecha, fundo = "", modulo = "", variedad = "", ciclo = 0, responsable = S.nombre, formato = "", destino = "", dias = "", ha = 0, kgHa = 0, jornales = 0;
        if (c.length >= 14) {
          const fRaw = c[1];
          const mSlash = fRaw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          if (mSlash) fecha = `${mSlash[3]}-${mSlash[2].padStart(2, "0")}-${mSlash[1].padStart(2, "0")}`;
          else if (/^\d{4}-\d{2}-\d{2}$/.test(fRaw)) fecha = fRaw;
          fundo = c[3] || ""; modulo = c[4] || ""; variedad = c[5] || ""; ciclo = Number(c[6]) || 0;
          responsable = c[7] || S.nombre; formato = c[8] || S.formatos[0] || "Granel"; destino = c[9] || S.destinos[0] || "USA";
          dias = c[10] === "" ? "" : Number(c[10]); ha = Number(c[11]) || 0; kgHa = Number(c[12]) || 0; jornales = Number(c[13]) || 0;
        } else {
          fundo = c[0] || ""; modulo = c[1] || ""; variedad = c[2] || "";
          formato = c[3] || S.formatos[0] || "Granel"; destino = c[4] || S.destinos[0] || "USA";
          dias = c[5] === "" ? "" : Number(c[5]); ha = Number(c[6]) || 0; kgHa = Number(c[7]) || 0; jornales = Number(c[8]) || 0;
        }
        if (!fundo && !variedad && ha === 0 && kgHa === 0) return;
        out.push(recalcularFilaAjuste({ fecha, fundo, modulo, variedad, ciclo, responsable, formato, destino, diasReingreso: dias, ha, kgHa, jornales }, fecha));
      });
      return out;
    }

        ? S.ajusteFilas
        : S.ajusteFilas.filter(r => normFundoKey(r.fundo) === normFundoKey(S.ajusteFiltroFundo));

        store.del(ajusteCacheKey());
        S.ajusteFilas = [crearFilaAjusteVacia(S.ajusteFiltroFundo !== "TODOS" ? S.ajusteFiltroFundo : "")];
        S.ajusteEstado = "NUEVO"; S.ajusteEditandoEnviado = false;

              const nuevas = matrizAjusteMasivoAFilas(matriz);
              if (!nuevas.length) return toast("No se detectaron filas válidas");
              S.ajusteFilas = S.ajusteFilas.filter(x => (Number(x.ha) || 0) > 0 || (Number(x.kgHa) || 0) > 0).concat(nuevas);
              pintarFilasAjuste(false);
              toast(`✓ ${nuevas.length} filas de Ajuste cargadas`);
            } catch (err) { toast(err.message || "Error al leer Excel"); }

          pintarFilasAjuste(false);

        const armarAj = () => S.ajusteFilas
          .filter(x => (Number(x.ha) || 0) > 0 || (Number(x.kgHa) || 0) > 0 || (Number(x.jornales) || 0) > 0)
          .map(x => recalcularFilaAjuste({ ...x, fecha: S.fecha, responsable: S.nombre }, S.fecha));

        if ($("btn-aj-bor")) {

          const ok = await confirmar(esEnviado ? "¿Actualizar Ajuste?" : "¿Enviar Ajuste?", `Se enviarán ${limpias.length} filas (${totKg.toLocaleString("en-US")} kg) del ${S.fecha}.`, esEnviado ? "Actualizar" : "Enviar");

          if (!r.ok) return toast(r.error);

          toast(esEnviado ? "Ajuste actualizado" : "¡Reporte de Ajuste enviado!");
